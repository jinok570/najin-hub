&lt;body&gt;

&lt;div class=&quot;nav&quot;&gt;
  &lt;div class=&quot;nav-logo&quot;&gt;상담기록&lt;/div&gt;
  &lt;button class=&quot;nav-btn active&quot; onclick=&quot;showScreen(&#x27;input&#x27;)&quot;&gt;✏️ 입력&lt;/button&gt;
  &lt;button class=&quot;nav-btn&quot; onclick=&quot;showScreen(&#x27;list&#x27;)&quot;&gt;📋 목록&lt;/button&gt;
  &lt;button class=&quot;nav-btn&quot; onclick=&quot;showScreen(&#x27;class&#x27;)&quot;&gt;👧 반관리&lt;/button&gt;
  &lt;button class=&quot;nav-btn&quot; onclick=&quot;showScreen(&#x27;backup&#x27;)&quot;&gt;💾 백업&lt;/button&gt;
&lt;/div&gt;

&lt;!-- ① 입력 --&gt;
&lt;div class=&quot;screen active&quot; id=&quot;screen-input&quot;&gt;
  &lt;div class=&quot;form-wrap&quot;&gt;
    &lt;div class=&quot;sec-title&quot;&gt;새 상담 기록 입력&lt;/div&gt;

    &lt;!-- 유아 스크롤 선택 --&gt;
    &lt;div class=&quot;child-picker&quot;&gt;
      &lt;div class=&quot;picker-label&quot;&gt;유아명 선택 &lt;span class=&quot;req&quot;&gt;*&lt;/span&gt;&lt;/div&gt;
      &lt;select class=&quot;child-select&quot; id=&quot;childSelect&quot; onchange=&quot;onSelectChild()&quot;&gt;
        &lt;option value=&quot;&quot; disabled selected&gt;유아 이름 선택...&lt;/option&gt;
      &lt;/select&gt;
      &lt;span class=&quot;err-msg&quot; id=&quot;e-childName&quot; style=&quot;display:none&quot;&gt;유아를 선택하거나 직접 입력하세요&lt;/span&gt;
    &lt;/div&gt;

    &lt;!-- 직접 입력 --&gt;
    &lt;div class=&quot;fg full&quot; style=&quot;margin-bottom:12px;&quot;&gt;
      &lt;label class=&quot;lbl&quot; style=&quot;margin-bottom:4px;&quot;&gt;직접 입력 (목록에 없을 경우)&lt;/label&gt;
      &lt;input class=&quot;fi&quot; id=&quot;childNameDirect&quot; placeholder=&quot;유아명 직접 입력...&quot; oninput=&quot;onDirectInput()&quot;&gt;
    &lt;/div&gt;

    &lt;div class=&quot;form-grid&quot;&gt;
      &lt;div class=&quot;fg&quot;&gt;
        &lt;label class=&quot;lbl&quot;&gt;날짜 &lt;span class=&quot;req&quot;&gt;*&lt;/span&gt;&lt;/label&gt;
        &lt;input class=&quot;fi&quot; type=&quot;date&quot; id=&quot;date&quot;&gt;
        &lt;span class=&quot;err-msg&quot; id=&quot;e-date&quot; style=&quot;display:none&quot;&gt;입력하세요&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fg&quot;&gt;
        &lt;label class=&quot;lbl&quot;&gt;시간 (시작 ~ 종료)&lt;/label&gt;
        &lt;div class=&quot;time-row&quot;&gt;
          &lt;select class=&quot;child-select time-sel&quot; id=&quot;startHour&quot;&gt;&lt;option value=&quot;&quot; disabled selected&gt;시&lt;/option&gt;&lt;/select&gt;
          &lt;select class=&quot;child-select time-sel&quot; id=&quot;startMin&quot;&gt;&lt;option value=&quot;&quot; disabled selected&gt;분&lt;/option&gt;&lt;/select&gt;
          &lt;span class=&quot;time-sep&quot;&gt;~&lt;/span&gt;
          &lt;select class=&quot;child-select time-sel&quot; id=&quot;endHour&quot;&gt;&lt;option value=&quot;&quot; disabled selected&gt;시&lt;/option&gt;&lt;/select&gt;
          &lt;select class=&quot;child-select time-sel&quot; id=&quot;endMin&quot;&gt;&lt;option value=&quot;&quot; disabled selected&gt;분&lt;/option&gt;&lt;/select&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fg&quot;&gt;
        &lt;label class=&quot;lbl&quot;&gt;방법&lt;/label&gt;
        &lt;div class=&quot;radio-grp&quot;&gt;
          &lt;label class=&quot;rlbl&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;method&quot; value=&quot;전화 연락&quot; checked&gt; 전화 연락&lt;/label&gt;
          &lt;label class=&quot;rlbl&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;method&quot; value=&quot;대면&quot;&gt; 대면&lt;/label&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fg&quot;&gt;
        &lt;label class=&quot;lbl&quot;&gt;상담 대상 &lt;span class=&quot;req&quot;&gt;*&lt;/span&gt;&lt;/label&gt;
        &lt;input class=&quot;fi&quot; id=&quot;target&quot; placeholder=&quot;어머니 / 아버지 / 할머니&quot;&gt;
        &lt;span class=&quot;err-msg&quot; id=&quot;e-target&quot; style=&quot;display:none&quot;&gt;입력하세요&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;fg full&quot;&gt;
        &lt;label class=&quot;lbl&quot;&gt;상담 내용 &lt;span class=&quot;req&quot;&gt;*&lt;/span&gt;&lt;/label&gt;
        &lt;textarea class=&quot;fi&quot; id=&quot;content&quot; placeholder=&quot;키워드 또는 간단한 메모 입력 후 ✨ AI 보완 버튼을 눌러보세요&quot;&gt;&lt;/textarea&gt;
        &lt;button class=&quot;ai-btn&quot; onclick=&quot;aiExpand(&#x27;content&#x27;)&quot; id=&quot;ai-btn-content&quot;&gt;
          &lt;span id=&quot;ai-icon-content&quot;&gt;✨&lt;/span&gt; AI 보완
        &lt;/button&gt;
        &lt;span class=&quot;err-msg&quot; id=&quot;e-content&quot; style=&quot;display:none&quot;&gt;입력하세요&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;button class=&quot;add-btn&quot; onclick=&quot;addRecord()&quot;&gt;＋ 기록 추가&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ② 목록 --&gt;
&lt;div class=&quot;screen&quot; id=&quot;screen-list&quot;&gt;
  &lt;div class=&quot;list-toolbar&quot;&gt;
    &lt;span class=&quot;count-badge&quot; id=&quot;countBadge&quot;&gt;0건&lt;/span&gt;
    &lt;button class=&quot;toolbar-btn word&quot; id=&quot;wordBtn&quot; onclick=&quot;downloadDoc()&quot; disabled&gt;📄 워드 저장&lt;/button&gt;
    &lt;button class=&quot;toolbar-btn&quot; onclick=&quot;window.print()&quot;&gt;🖨 인쇄&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;search-wrap&quot;&gt;
    &lt;input class=&quot;search-input&quot; id=&quot;searchInput&quot; placeholder=&quot;🔍  유아명 또는 내용으로 검색...&quot; oninput=&quot;renderList()&quot;&gt;
  &lt;/div&gt;
  &lt;div class=&quot;list-wrap&quot; id=&quot;listWrap&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ③ 반 관리 --&gt;
&lt;div class=&quot;screen&quot; id=&quot;screen-class&quot;&gt;
  &lt;div class=&quot;class-wrap&quot;&gt;
    &lt;div class=&quot;class-card&quot;&gt;
      &lt;div class=&quot;class-card-head&quot;&gt;
        &lt;span class=&quot;class-card-icon&quot;&gt;🏫&lt;/span&gt;
        &lt;span class=&quot;class-card-title&quot;&gt;새 반 추가&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;class-card-body&quot;&gt;
        &lt;div class=&quot;add-class-row&quot;&gt;
          &lt;input class=&quot;class-input&quot; id=&quot;newClassName&quot; placeholder=&quot;반 이름 (예: 보석반, 별빛반...)&quot; onkeydown=&quot;if(event.key===&#x27;Enter&#x27;)addClass()&quot;&gt;
          &lt;button class=&quot;class-add-btn&quot; onclick=&quot;addClass()&quot;&gt;＋ 반 추가&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;class-list&quot; id=&quot;classList&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ④ 백업 --&gt;
&lt;div class=&quot;screen&quot; id=&quot;screen-backup&quot;&gt;
  &lt;div class=&quot;backup-wrap&quot;&gt;
    &lt;div class=&quot;stats-row&quot;&gt;
      &lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;stat-num&quot; id=&quot;statTotal&quot;&gt;0&lt;/div&gt;&lt;div class=&quot;stat-lbl&quot;&gt;전체 기록&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;stat-num&quot; id=&quot;statChild&quot;&gt;0&lt;/div&gt;&lt;div class=&quot;stat-lbl&quot;&gt;유아 수&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;stat-box&quot;&gt;&lt;div class=&quot;stat-num&quot; id=&quot;statClass&quot;&gt;0&lt;/div&gt;&lt;div class=&quot;stat-lbl&quot;&gt;반 수&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;!-- AI API 키 설정 --&gt;
    &lt;div class=&quot;api-key-card&quot;&gt;
      &lt;div class=&quot;api-key-head&quot;&gt;&lt;span style=&quot;font-size:16px;&quot;&gt;🔑&lt;/span&gt;&lt;span style=&quot;font-family:&#x27;Nanum Myeongjo&#x27;,serif;font-size:13px;font-weight:700;letter-spacing:1px;&quot;&gt;AI 보완 설정&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;api-key-body&quot; id=&quot;apiKeySection&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;backup-card&quot;&gt;
      &lt;div class=&quot;backup-card-head&quot;&gt;&lt;span class=&quot;backup-icon&quot;&gt;📤&lt;/span&gt;&lt;span class=&quot;backup-title&quot;&gt;백업 내보내기&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;backup-card-body&quot;&gt;
        &lt;p class=&quot;backup-desc&quot;&gt;모든 기록과 반 정보를 &lt;strong&gt;JSON 파일&lt;/strong&gt;로 저장해요. 반 명단도 함께 백업돼요.&lt;/p&gt;
        &lt;button class=&quot;backup-btn export&quot; onclick=&quot;exportBackup()&quot;&gt;📤 백업 파일 저장 (.json)&lt;/button&gt;
        &lt;div class=&quot;backup-status&quot; id=&quot;exportStatus&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;backup-card&quot;&gt;
      &lt;div class=&quot;backup-card-head&quot;&gt;&lt;span class=&quot;backup-icon&quot;&gt;📥&lt;/span&gt;&lt;span class=&quot;backup-title&quot;&gt;백업 불러오기&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;backup-card-body&quot;&gt;
        &lt;p class=&quot;backup-desc&quot;&gt;이전 백업 파일을 불러와요. 기록과 반 명단이 &lt;strong&gt;합쳐져서&lt;/strong&gt; 저장돼요.&lt;/p&gt;
        &lt;button class=&quot;backup-btn import&quot; onclick=&quot;document.getElementById(&#x27;importFile&#x27;).click()&quot;&gt;📥 백업 파일 불러오기 (.json)&lt;/button&gt;
        &lt;input type=&quot;file&quot; id=&quot;importFile&quot; accept=&quot;.json&quot; onchange=&quot;importBackup(event)&quot;&gt;
        &lt;div class=&quot;backup-status&quot; id=&quot;importStatus&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;backup-card&quot;&gt;
      &lt;div class=&quot;backup-card-head&quot;&gt;&lt;span class=&quot;backup-icon&quot;&gt;📄&lt;/span&gt;&lt;span class=&quot;backup-title&quot;&gt;전체 워드로 저장&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;backup-card-body&quot;&gt;
        &lt;p class=&quot;backup-desc&quot;&gt;모든 기록을 &lt;strong&gt;워드(.doc) 파일&lt;/strong&gt;로 한번에 저장해요.&lt;/p&gt;
        &lt;button class=&quot;backup-btn word-all&quot; onclick=&quot;downloadDoc()&quot;&gt;📄 전체 워드 파일 저장&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const RECORDS_KEY = &#x27;consult_records_v1&#x27;;
const CLASSES_KEY  = &#x27;consult_classes_v1&#x27;;

let records = [];
let classes  = []; // [{id, name, children:[...]}]
let selectedChild = &#x27;&#x27;; // 토글로 선택된 이름

/* ── 저장/불러오기 ── */
var allowEmptyRecordSave = false;   /* 진짜로 다 지웠을 때만 true */
function saveAll() {
  /* ⚠️ 빈 목록으로 기존 기록을 덮어쓰지 않는다.
     (앱이 비어있는 상태에서 반 추가 등으로 saveAll 이 돌면 기록이 날아갔었음) */
  var skip = false;
  if (!records.length &amp;&amp; !allowEmptyRecordSave) {
    var cur = null;
    try { cur = JSON.parse(localStorage.getItem(RECORDS_KEY) || &#x27;[]&#x27;); } catch(e){ cur = []; }
    if (Array.isArray(cur) &amp;&amp; cur.length) {
      skip = true;
      console.warn(&#x27;[상담기록] 빈 목록으로 덮어쓰기를 막고, 저장된 &#x27; + cur.length + &#x27;건을 다시 불러옵니다.&#x27;);
      records = cur;                       /* 자가 복구 */
      try { if (typeof renderList === &#x27;function&#x27;) renderList(); } catch(e){}
      try { if (typeof renderStats === &#x27;function&#x27;) renderStats(); } catch(e){}
    }
  }
  if (!skip) { try { localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); } catch(e){} }
  try { localStorage.setItem(CLASSES_KEY, JSON.stringify(classes)); } catch(e){}
  allowEmptyRecordSave = false;
}
function loadAll() {
  try { const d=localStorage.getItem(RECORDS_KEY); if(d) records=JSON.parse(d); } catch(e){ records=[]; }
  try { const d=localStorage.getItem(CLASSES_KEY);  if(d) classes=JSON.parse(d);  } catch(e){ classes=[]; }
}

/* ── 외부에서 통합 백업을 위해 데이터 접근 가능하게 노출 ── */
window.getBackupData = function(){
  return { records: records, classes: classes };
};
window.setBackupData = function(data){
  if(data &amp;&amp; Array.isArray(data.records)) records = data.records;
  if(data &amp;&amp; Array.isArray(data.classes)) classes = data.classes;
  try{ normalizeData(); }catch(e){}
  saveAll();
  /* 데이터 저장 후 화면을 즉시 다시 그림 (iframe reload 없이) */
  try{ if(typeof renderList===&#x27;function&#x27;) renderList(); }catch(e){}
  try{ if(typeof renderStats===&#x27;function&#x27;) renderStats(); }catch(e){}
  try{ if(typeof renderClassList===&#x27;function&#x27;) renderClassList(); }catch(e){}
  try{ if(typeof renderToggleArea===&#x27;function&#x27;) renderToggleArea(); }catch(e){}
  /* 카운트 뱃지 업데이트 */
  try{
    var badge=document.getElementById(&#x27;countBadge&#x27;);
    if(badge) badge.textContent=records.length+&#x27;건&#x27;;
  }catch(e){}
  /* 워드 저장 버튼 활성/비활성 */
  try{
    var wb=document.getElementById(&#x27;wordBtn&#x27;);
    if(wb) wb.disabled=!records.length;
  }catch(e){}
  return true;
};

/* ── 유틸 ── */
function $(id){ return document.getElementById(id); }
function esc(s){ return (s||&#x27;&#x27;).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;); }
function showStatus(id, msg, type){
  const el=$(id); el.textContent=msg; el.className=&#x27;backup-status &#x27;+type; el.style.display=&#x27;block&#x27;;
  setTimeout(()=&gt;el.style.display=&#x27;none&#x27;, 3000);
}

/* ── 화면 전환 ── */
function showScreen(name){
  document.querySelectorAll(&#x27;.screen&#x27;).forEach(s=&gt;s.classList.remove(&#x27;active&#x27;));
  document.querySelectorAll(&#x27;.nav-btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
  $(&#x27;screen-&#x27;+name).classList.add(&#x27;active&#x27;);
  const map={input:0,list:1,class:2,backup:3};
  document.querySelectorAll(&#x27;.nav-btn&#x27;)[map[name]]?.classList.add(&#x27;active&#x27;);
  if(name===&#x27;input&#x27;)  renderToggleArea();
  if(name===&#x27;list&#x27;)   renderList();
  if(name===&#x27;class&#x27;)  renderClassList();
  if(name===&#x27;backup&#x27;) { renderStats(); renderApiKeySection(); }
}

/* ══════════════════
   반 관리
══════════════════ */
function addClass(){
  const name = $(&#x27;newClassName&#x27;).value.trim();
  if(!name) return;
  classes.push({ id: Date.now(), name, children:[] });
  $(&#x27;newClassName&#x27;).value = &#x27;&#x27;;
  saveAll(); renderClassList(); renderToggleArea();
}
function deleteClass(id){
  if(!confirm(&#x27;이 반을 삭제할까요? (반 안의 유아 명단도 삭제됩니다)&#x27;)) return;
  classes = classes.filter(c=&gt;c.id!==id);
  saveAll(); renderClassList(); renderToggleArea();
}
function addChild(classId){
  const inputEl = $(&#x27;childInput-&#x27;+classId);
  const name = inputEl.value.trim();
  if(!name) return;
  const cls = classes.find(c=&gt;c.id===classId);
  if(!cls) return;
  if(cls.children.includes(name)){ inputEl.value=&#x27;&#x27;; return; }
  cls.children.push(name);
  inputEl.value=&#x27;&#x27;;
  saveAll(); renderClassList(); renderToggleArea();
}
function deleteChild(classId, childName){
  const cls = classes.find(c=&gt;c.id===classId);
  if(!cls) return;
  cls.children = cls.children.filter(n=&gt;n!==childName);
  if(selectedChild===childName){ selectedChild=&#x27;&#x27;; updateSelectedDisplay(); }
  saveAll(); renderClassList(); renderToggleArea();
}
function renderClassList(){
  const wrap = $(&#x27;classList&#x27;);
  if(!classes.length){
    wrap.innerHTML = &#x27;&lt;div class=&quot;empty&quot;&gt;&lt;div class=&quot;empty-icon&quot;&gt;🏫&lt;/div&gt;&lt;div&gt;아직 반이 없습니다&lt;br&gt;위에서 반을 추가해주세요&lt;/div&gt;&lt;/div&gt;&#x27;;
    return;
  }
  wrap.innerHTML = classes.map(cls=&gt;`
    &lt;div class=&quot;class-item&quot;&gt;
      &lt;div class=&quot;class-item-head&quot;&gt;
        &lt;span class=&quot;class-item-name&quot;&gt;🏷 ${esc(cls.name)}&lt;/span&gt;
        &lt;button class=&quot;class-del-btn&quot; onclick=&quot;deleteClass(${cls.id})&quot;&gt;×&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;children-area&quot;&gt;
        &lt;div class=&quot;children-tags&quot;&gt;
          ${cls.children.length
            ? cls.children.map(n=&gt;`
                &lt;div class=&quot;child-tag&quot;&gt;
                  ${esc(n)}
                  &lt;button class=&quot;child-tag-del&quot; onclick=&quot;deleteChild(${cls.id},&#x27;${n.replace(/&#x27;/g,&quot;\\&#x27;&quot;)}&#x27;)&quot;&gt;×&lt;/button&gt;
                &lt;/div&gt;`).join(&#x27;&#x27;)
            : &#x27;&lt;span class=&quot;no-child&quot;&gt;아직 유아가 없습니다&lt;/span&gt;&#x27;}
        &lt;/div&gt;
        &lt;div class=&quot;add-child-row&quot;&gt;
          &lt;input class=&quot;child-input&quot; id=&quot;childInput-${cls.id}&quot; placeholder=&quot;유아 이름 입력 후 추가&quot;
            onkeydown=&quot;if(event.key===&#x27;Enter&#x27;)addChild(${cls.id})&quot;&gt;
          &lt;button class=&quot;child-add-btn&quot; onclick=&quot;addChild(${cls.id})&quot;&gt;＋ 추가&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`).join(&#x27;&#x27;);
}

/* ══════════════════
   입력 화면 토글
══════════════════ */
function renderToggleArea(){
  const sel = $(&#x27;childSelect&#x27;);
  if(!sel) return;
  const prev = sel.value;
  sel.innerHTML = &#x27;&#x27;;
  // 기본 placeholder
  const placeholder=document.createElement(&#x27;option&#x27;);
  placeholder.value=&#x27;&#x27;; placeholder.disabled=true; placeholder.selected=true;
  placeholder.textContent=&#x27;유아 이름 선택...&#x27;;
  sel.appendChild(placeholder);

  const allChildren = classes.flatMap(c=&gt;c.children);
  if(allChildren.length){
    classes.filter(c=&gt;c.children.length).forEach(cls=&gt;{
      const grp=document.createElement(&#x27;optgroup&#x27;);
      grp.label=&#x27;🏷 &#x27;+cls.name;
      cls.children.forEach(n=&gt;{
        const opt=document.createElement(&#x27;option&#x27;);
        opt.value=n; opt.textContent=n;
        grp.appendChild(opt);
      });
      sel.appendChild(grp);
    });
  }
  if(prev) sel.value=prev;
}
function onSelectChild(){
  const sel=$(&#x27;childSelect&#x27;);
  selectedChild=sel.value||&#x27;&#x27;;
  $(&#x27;childNameDirect&#x27;).value=&#x27;&#x27;;
  $(&#x27;e-childName&#x27;).style.display=&#x27;none&#x27;;
}
function onDirectInput(){
  selectedChild=&#x27;&#x27;;
  const sel=$(&#x27;childSelect&#x27;);
  if(sel) sel.selectedIndex=-1;
}
function getChildName(){
  const direct = $(&#x27;childNameDirect&#x27;).value.trim();
  return direct || selectedChild;
}

/* ══════════════════
   기록 추가
══════════════════ */
function $$(id){return document.getElementById(id);}
function formatDate(v){
  if(!v) return &#x27;&#x27;;
  const [y,m,d]=v.split(&#x27;-&#x27;);
  return y+&#x27;년 &#x27;+parseInt(m)+&#x27;월 &#x27;+parseInt(d)+&#x27;일&#x27;;
}
function addRecord(){
  const childName = getChildName();
  const rawDate = $(&#x27;date&#x27;).value;
  const date = rawDate ? formatDate(rawDate) : &#x27;&#x27;;
  const target  = $(&#x27;target&#x27;).value.trim();
  const content = $(&#x27;content&#x27;).value.trim();
  const sh=$(&#x27;startHour&#x27;).value, sm=$(&#x27;startMin&#x27;).value;
  const eh=$(&#x27;endHour&#x27;).value,   em=$(&#x27;endMin&#x27;).value;
  const startTime = sh&amp;&amp;sm ? sh+&#x27;:&#x27;+sm : &#x27;&#x27;;
  const endTime   = eh&amp;&amp;em ? eh+&#x27;:&#x27;+em : &#x27;&#x27;;
  const method = document.querySelector(&#x27;input[name=&quot;method&quot;]:checked&#x27;).value;

  let ok = true;
  if(!childName){ $(&#x27;e-childName&#x27;).style.display=&#x27;block&#x27;; ok=false; } else { $(&#x27;e-childName&#x27;).style.display=&#x27;none&#x27;; }
  [[&#x27;date&#x27;,date],[&#x27;target&#x27;,target],[&#x27;content&#x27;,content]].forEach(([k,v])=&gt;{
    const el=$(k), er=$(&#x27;e-&#x27;+k);
    if(!v){ el.classList.add(&#x27;err&#x27;); er.style.display=&#x27;block&#x27;; ok=false; }
    else  { el.classList.remove(&#x27;err&#x27;); er.style.display=&#x27;none&#x27;; }
  });
  if(!ok) return;

  records.push({ id:Date.now(), childName, date, startTime, endTime, method, target, content, createdAt:new Date().toISOString() });
  /* 입력 시 records를 오름차순으로 정렬 (renderList의 reverse()와 결합하면 최근이 위) */
  try{
    records.sort(function(a,b){
      function k(s){
        if(!s) return &#x27;0000-00-00&#x27;;
        var m = String(s).match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
        if(m){
          var p=function(n){return n.length===1?&#x27;0&#x27;+n:n;};
          return m[1]+&#x27;-&#x27;+p(m[2])+&#x27;-&#x27;+p(m[3]);
        }
        return String(s);
      }
      var da=k(a&amp;&amp;a.date), db=k(b&amp;&amp;b.date);
      if(da !== db) return da.localeCompare(db);
      var ta=(a&amp;&amp;a.startTime)||&#x27;&#x27;, tb=(b&amp;&amp;b.startTime)||&#x27;&#x27;;
      if(ta !== tb) return ta.localeCompare(tb);
      return ((a&amp;&amp;a.id)||0) - ((b&amp;&amp;b.id)||0);
    });
  }catch(e){ console.error(&#x27;정렬 에러:&#x27;,e); }
  saveAll();

  $(&#x27;date&#x27;).value=&#x27;&#x27;;
  [&#x27;startHour&#x27;,&#x27;startMin&#x27;,&#x27;endHour&#x27;,&#x27;endMin&#x27;].forEach(id=&gt;{$$(id).selectedIndex=0;});
  $(&#x27;target&#x27;).value=&#x27;&#x27;; $(&#x27;content&#x27;).value=&#x27;&#x27;; $(&#x27;childNameDirect&#x27;).value=&#x27;&#x27;;
  document.querySelector(&#x27;input[name=&quot;method&quot;][value=&quot;전화 연락&quot;]&#x27;).checked=true;
  selectedChild=&#x27;&#x27;; updateSelectedDisplay(); renderToggleArea();

  const btn=document.querySelector(&#x27;.add-btn&#x27;);
  btn.textContent=&#x27;✅ 기록이 저장됐어요!&#x27;; btn.style.background=&#x27;#1e7e45&#x27;;
  setTimeout(()=&gt;{ btn.textContent=&#x27;＋ 기록 추가&#x27;; btn.style.background=&#x27;&#x27;; },1800);
}

/* ══════════════════
   목록 렌더
══════════════════ */
function renderList(){
  const q=($(&#x27;searchInput&#x27;)?.value||&#x27;&#x27;).trim().toLowerCase();
  const filtered = q ? records.filter(r=&gt;(r.childName+r.content+r.date).toLowerCase().includes(q)) : records;
  $(&#x27;countBadge&#x27;).textContent=`총 ${records.length}건`;
  const wb=$(&#x27;wordBtn&#x27;); if(wb) wb.disabled=records.length===0;
  const wrap=$(&#x27;listWrap&#x27;); wrap.innerHTML=&#x27;&#x27;;
  if(!filtered.length){
    wrap.innerHTML=`&lt;div class=&quot;empty&quot;&gt;&lt;div class=&quot;empty-icon&quot;&gt;📋&lt;/div&gt;&lt;div&gt;${q?&#x27;검색 결과가 없습니다&#x27;:&#x27;저장된 기록이 없습니다&#x27;}&lt;/div&gt;&lt;/div&gt;`;
    return;
  }
  /* 입력 순서 역순 (최근에 입력한 것이 위) */
  filtered.slice().reverse().forEach((r,i)=&gt;{
    const time=r.startTime&amp;&amp;r.endTime?`${r.startTime} ~ ${r.endTime}`:r.startTime||&#x27;—&#x27;;
    const div=document.createElement(&#x27;div&#x27;); div.className=&#x27;record-card&#x27;;
    div.innerHTML=`
      &lt;div class=&quot;rc-head&quot;&gt;
        &lt;span class=&quot;rc-num&quot;&gt;${filtered.length-i}&lt;/span&gt;
        &lt;span class=&quot;rc-name&quot;&gt;${esc(r.childName)}&lt;/span&gt;
        &lt;span class=&quot;rc-date&quot;&gt;${esc(r.date)}&lt;/span&gt;
        &lt;button class=&quot;rc-edit&quot; onclick=&quot;openEditModal(${r.id})&quot; title=&quot;수정&quot;&gt;✏️&lt;/button&gt;
        &lt;button class=&quot;rc-del&quot; onclick=&quot;deleteRecord(${r.id})&quot; title=&quot;삭제&quot;&gt;×&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rc-body&quot;&gt;
        &lt;table class=&quot;rc-table&quot;&gt;&lt;tbody&gt;
          &lt;tr&gt;&lt;td class=&quot;lb&quot;&gt;유아명&lt;/td&gt;&lt;td&gt;${esc(r.childName)}&lt;/td&gt;&lt;td class=&quot;lb&quot;&gt;날짜&lt;/td&gt;&lt;td&gt;${esc(r.date)}&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;lb&quot;&gt;시간&lt;/td&gt;&lt;td&gt;${esc(time)}&lt;/td&gt;&lt;td class=&quot;lb&quot;&gt;방법&lt;/td&gt;&lt;td&gt;${esc(r.method)}&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;lb&quot;&gt;상담 대상&lt;/td&gt;&lt;td colspan=&quot;3&quot;&gt;${esc(r.target)}&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;lb&quot;&gt;상담 내용&lt;/td&gt;&lt;td colspan=&quot;3&quot;&gt;&lt;div class=&quot;rc-content&quot;&gt;${esc(r.content).replace(/\n/g,&#x27;&lt;br&gt;&#x27;)}&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;&lt;/table&gt;
      &lt;/div&gt;`;
    wrap.appendChild(div);
  });
}
function deleteRecord(id){
  if(!confirm(&#x27;이 기록을 삭제할까요?&#x27;)) return;
  records=records.filter(r=&gt;r.id!==id);
  allowEmptyRecordSave = true;
  saveAll(); renderList();
}

/* ══════════════════
   통계
══════════════════ */
function renderStats(){
  $(&#x27;statTotal&#x27;).textContent=records.length;
  $(&#x27;statChild&#x27;).textContent=new Set(records.map(r=&gt;r.childName)).size;
  $(&#x27;statClass&#x27;).textContent=classes.length;
}

/* ══════════════════
   백업
══════════════════ */
function exportBackup(){
  if(!records.length&amp;&amp;!classes.length){ showStatus(&#x27;exportStatus&#x27;,&#x27;저장된 데이터가 없습니다.&#x27;,&#x27;err&#x27;); return; }
  const data={ version:2, exportedAt:new Date().toISOString(), records, classes };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:&#x27;application/json&#x27;});
  const url=URL.createObjectURL(blob);
  const a=document.createElement(&#x27;a&#x27;);
  const d=new Date(); const ds=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,&#x27;0&#x27;)}${String(d.getDate()).padStart(2,&#x27;0&#x27;)}`;
  a.href=url; a.download=`상담기록_백업_${ds}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showStatus(&#x27;exportStatus&#x27;,`✅ 기록 ${records.length}건 + 반 ${classes.length}개 백업 완료!`,&#x27;ok&#x27;);
}
function importBackup(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=&gt;{
    try{
      const data=JSON.parse(ev.target.result);
      // 기록 합치기
      const importedRecords=data.records||data;
      if(Array.isArray(importedRecords)){
        const existIds=new Set(records.map(r=&gt;r.id));
        const newRecs=importedRecords.filter(r=&gt;!existIds.has(r.id));
        records=[...records,...newRecs];
      }
      // 반 합치기
      if(Array.isArray(data.classes)){
        const existClassIds=new Set(classes.map(c=&gt;c.id));
        const newCls=data.classes.filter(c=&gt;!existClassIds.has(c.id));
        classes=[...classes,...newCls];
      }
      saveAll(); renderStats(); renderClassList(); renderToggleArea();
      showStatus(&#x27;importStatus&#x27;,`✅ 불러오기 완료! (전체 기록 ${records.length}건)`,&#x27;ok&#x27;);
    }catch{ showStatus(&#x27;importStatus&#x27;,&#x27;❌ 파일 형식이 올바르지 않습니다.&#x27;,&#x27;err&#x27;); }
    e.target.value=&#x27;&#x27;;
  };
  reader.readAsText(file);
}

function saveEdit(){
  const id=parseInt($(&#x27;editId&#x27;).value);
  const childName=$(&#x27;editChildName&#x27;).value.trim();
  const rawDate=$(&#x27;editDate&#x27;).value;
  const date=rawDate?formatDate(rawDate):&#x27;&#x27;;
  const target=$(&#x27;editTarget&#x27;).value.trim();
  const content=$(&#x27;editContent&#x27;).value.trim();
  if(!childName||!date||!target||!content){ alert(&#x27;필수 항목을 모두 입력하세요&#x27;); return; }
  const sh=$(&#x27;editStartHour&#x27;).value, sm=$(&#x27;editStartMin&#x27;).value;
  const eh=$(&#x27;editEndHour&#x27;).value,   em=$(&#x27;editEndMin&#x27;).value;
  const startTime=sh&amp;&amp;sm?sh+&#x27;:&#x27;+sm:&#x27;&#x27;;
  const endTime=eh&amp;&amp;em?eh+&#x27;:&#x27;+em:&#x27;&#x27;;
  const method=document.querySelector(&#x27;input[name=&quot;editMethod&quot;]:checked&#x27;)?.value||&#x27;전화 연락&#x27;;
  const idx=records.findIndex(x=&gt;x.id===id);
  if(idx===-1) return;
  records[idx]={...records[idx],childName,date,startTime,endTime,method,target,content};
  /* 수정 후 records 정렬 (날짜가 바뀐 경우 위치 재조정) */
  try{
    records.sort(function(a,b){
      function k(s){
        if(!s) return &#x27;0000-00-00&#x27;;
        var m = String(s).match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
        if(m){
          var p=function(n){return n.length===1?&#x27;0&#x27;+n:n;};
          return m[1]+&#x27;-&#x27;+p(m[2])+&#x27;-&#x27;+p(m[3]);
        }
        return String(s);
      }
      var da=k(a&amp;&amp;a.date), db=k(b&amp;&amp;b.date);
      if(da !== db) return da.localeCompare(db);
      var ta=(a&amp;&amp;a.startTime)||&#x27;&#x27;, tb=(b&amp;&amp;b.startTime)||&#x27;&#x27;;
      if(ta !== tb) return ta.localeCompare(tb);
      return ((a&amp;&amp;a.id)||0) - ((b&amp;&amp;b.id)||0);
    });
  }catch(e){ console.error(&#x27;정렬 에러:&#x27;,e); }
  saveAll(); renderList();
  $(&#x27;editModal&#x27;).style.display=&#x27;none&#x27;;
  document.body.style.overflow=&#x27;&#x27;;
}
function setSelVal(id,val){
  const sel=$(id); if(!sel||!val) return;
  for(let i=0;i&lt;sel.options.length;i++){
    if(sel.options[i].value===val){sel.selectedIndex=i;return;}
  }
}
function dateToInput(str){
  if(!str) return &#x27;&#x27;;
  // &quot;2025년 5월 1일&quot; → &quot;2025-05-01&quot;
  const m=str.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
  if(!m) return &#x27;&#x27;;
  return m[1]+&#x27;-&#x27;+String(m[2]).padStart(2,&#x27;0&#x27;)+&#x27;-&#x27;+String(m[3]).padStart(2,&#x27;0&#x27;);
}

}

style="margin-top:12px;padding:11px 12px;border:1px solid #e3d9c8;border-radius:9px;background:#faf8f3;font-size:12px;line-height:1.75;color:#5a4530;"></div></div></div></div><div id="syncModal" class="bk-modal" onclick="if(event.target===this)closeSyncModal()"><div class="bk-box"><div class="bk-head"><span class="bk-title" id="syncTitle">🔐 암호백업</span><button class="bk-x" onclick="closeSyncModal()">✕</button></div><div class="bk-body"><div class="bk-desc" id="syncDesc"></div><input class="sync-pw" id="syncPw" type="password" autocomplete="off" placeholder="암호 입력"><button class="bk-btn bk-btn-dl" id="syncGo">확인</button><button class="bk-btn bk-btn-c" onclick="closeSyncModal()">닫기</button><div class="bk-status" id="syncStatus"></div><div class="bk-note" id="syncNote"></div></div></div></div><script>var cur="eval";
/* ════════════════════════════════════════════════
   🔐 암호백업 (기기간 전송)  — AES-GCM + PBKDF2
   PC에서 만들어 sync.json 으로 배포 → 폰에서 암호 넣고 복원
   ════════════════════════════════════════════════ */
var SYNC_URL="sync.json";
var syncMode="create";

function b64enc(bytes){
  var s="",CH=8192;
  for(var i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s);
}
function b64dec(str){
  var bin=atob(str),out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function syncKey(pw,salt){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"])
    .then(function(km){
      return crypto.subtle.deriveKey(
        {name:"PBKDF2",salt:salt,iterations:150000,hash:"SHA-256"},
        km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
    });
}
async function gzipBytes(u8){
  if(typeof CompressionStream==="undefined") return null;
  var st=new Blob([u8]).stream().pipeThrough(new CompressionStream("gzip"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function gunzipBytes(u8){
  var st=new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
function syncStatusMsg(t,cls){
  var el=document.getElementById("syncStatus");
  el.className="bk-status "+cls; el.innerHTML=t;
}
function closeSyncModal(){
  document.getElementById("syncModal").classList.remove("open");
  document.getElementById("syncPw").value="";
}

/* ── 만들기 (PC) ── */
function openSyncCreate(){
  syncMode="create";
  document.getElementById("syncTitle").textContent="🔐 암호백업 만들기";
  document.getElementById("syncDesc").innerHTML=
    "유아평가·상담기록을 <b>암호로 잠근 파일</b>로 만들어요.<br>"
    +"폰에서 이 암호를 넣어야만 열려서, 공개 주소에 올려도 내용이 보이지 않아요.";
  document.getElementById("syncPw").placeholder="새 암호 (잊으면 못 열어요)";
  document.getElementById("syncGo").textContent="🔐 암호 걸어 파일 만들기";
  document.getElementById("syncStatus").className="bk-status";
  document.getElementById("syncNote").innerHTML=
    "<b>만든 뒤 이렇게 하세요</b><br>"
    +"① 받은 파일 이름을 <b>sync.json</b> 으로<br>"
    +"② <b>나진허브_배포</b> 폴더에 넣기<br>"
    +"③ <b>배포.bat</b> 더블클릭<br>"
    +"④ 폰에서 앱 열면 자동으로 물어봐요";
  document.getElementById("syncModal").classList.add("open");
}

function doSyncCreate(){
  var pw=document.getElementById("syncPw").value;
  if(pw.length<4){ syncStatusMsg("암호를 4자 이상 넣어주세요.","err"); return; }
  syncStatusMsg("🔐 암호를 거는 중… 잠시만요","ok");

  function lsJSON(k){ try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;} }
  var evalData=null, consultData=null;
  try{ evalData=getIframeBackupData("f-eval"); }catch(e){}
  if(!evalData||!evalData.records) evalData=lsJSON("유아평가_v3");
  try{ consultData=getIframeBackupData("f-consult"); }catch(e){}
  if(!consultData||!consultData.records||!consultData.records.length){
    consultData={records:lsJSON("consult_records_v1")||[],classes:lsJSON("consult_classes_v1")||[]};
  }
  var payload={type:"교실일지_통합백업",version:"1.1",exportedAt:new Date().toISOString(),
               data:{eval:evalData,consult:consultData}};
  var en=(evalData&&evalData.records)?Object.keys(evalData.records).length:0;
  var cn=(consultData&&consultData.records)?consultData.records.length:0;
  if(!en&&!cn){ syncStatusMsg("⚠️ 백업할 데이터가 없어요.","err"); return; }

  var salt=crypto.getRandomValues(new Uint8Array(16));
  var iv=crypto.getRandomValues(new Uint8Array(12));
  (async function(){
    var raw=new TextEncoder().encode(JSON.stringify(payload));
    var zipped=null;
    try{ zipped=await gzipBytes(raw); }catch(e){ zipped=null; }
    var body=zipped||raw;
    var key=await syncKey(pw,salt);
    var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,body);
    return {ct:ct,z:zipped?"gzip":null,rawLen:raw.length};
  })().then(function(res){
    var ct=res.ct;
    var box={v:1,alg:"AES-GCM",kdf:"PBKDF2-SHA256-150000",z:res.z,
             at:new Date().toISOString(),
             counts:{eval:en,consult:cn},
             salt:b64enc(salt),iv:b64enc(iv),ct:b64enc(new Uint8Array(ct))};
    var blob=new Blob([JSON.stringify(box)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="sync.json"; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},2000);
    var mb=(JSON.stringify(box).length/1048576).toFixed(2);
    syncStatusMsg("✅ <b>sync.json</b> 파일이 만들어졌어요!<br>유아평가 "+en+"일치 · 상담기록 "+cn+"건 · "+mb+" MB"+(res.z?" (압축됨)":"")+"<br><br>아래 안내대로 배포해주세요.","ok");
    document.getElementById("syncPw").value="";
  }).catch(function(e){
    syncStatusMsg("❌ 암호화 실패: "+(e.message||e),"err");
  });
}

/* ── 불러오기 (폰) ── */
var syncBox=null, syncTag=null;
function openSyncRestore(auto){
  syncMode="restore";
  document.getElementById("syncTitle").textContent="☁️ 서버 백업 불러오기";
  document.getElementById("syncDesc").innerHTML="서버에서 백업을 찾는 중…";
  document.getElementById("syncPw").placeholder="암호 입력";
  document.getElementById("syncGo").textContent="🔓 암호 풀고 복원하기";
  document.getElementById("syncStatus").className="bk-status";
  document.getElementById("syncNote").innerHTML="";
  document.getElementById("syncModal").classList.add("open");

  fetch(SYNC_URL,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("서버에 백업 파일이 없어요 (sync.json)");
    syncTag=r.headers.get("etag")||r.headers.get("last-modified");
    return r.json();
  }).then(function(box){
    syncBox=box;
    var d=new Date(box.at);
    var when=d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate()+" "
            +String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    document.getElementById("syncDesc").innerHTML=
      "📦 <b>"+when+"</b> 에 만든 백업이 있어요<br>"
      +"유아평가 <b>"+(box.counts?box.counts.eval:"?")+"</b>일치 · 상담기록 <b>"+(box.counts?box.counts.consult:"?")+"</b>건<br><br>"
      +"<b>PC에서 정한 암호</b>를 넣어주세요.";
  }).catch(function(e){
    syncBox=null;
    document.getElementById("syncDesc").innerHTML="";
    syncStatusMsg("❌ "+(e.message||e),"err");
  });
}

function doSyncRestore(){
  if(!syncBox){ syncStatusMsg("❌ 불러올 백업이 없어요.","err"); return; }
  var pw=document.getElementById("syncPw").value;
  if(!pw){ syncStatusMsg("암호를 넣어주세요.","err"); return; }
  syncStatusMsg("🔓 암호를 푸는 중… 잠시만요","ok");

  (async function(){
    var key=await syncKey(pw,b64dec(syncBox.salt));
    var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64dec(syncBox.iv)},key,b64dec(syncBox.ct));
    var bytes=new Uint8Array(plain);
    if(syncBox.z==="gzip") bytes=await gunzipBytes(bytes);
    return bytes;
  })().then(function(plain){
    var backup=JSON.parse(new TextDecoder().decode(plain));
    var d=backup.data||{};
    var msg=[];
    if(d.eval){
      localStorage.setItem("유아평가_v3",JSON.stringify(d.eval));
      msg.push("✓ 유아평가 "+(d.eval.records?Object.keys(d.eval.records).length:0)+"일치");
    }
    if(d.consult){
      localStorage.setItem("consult_records_v1",JSON.stringify(d.consult.records||[]));
      localStorage.setItem("consult_classes_v1",JSON.stringify(d.consult.classes||[]));
      msg.push("✓ 상담기록 "+((d.consult.records||[]).length)+"건");
    }
    if(!msg.length){ syncStatusMsg("⚠️ 복원할 데이터가 없어요.","err"); return; }
    try{
      localStorage.setItem("sync_applied_at",syncBox.at);
      if(syncTag){ localStorage.setItem("sync_applied_tag",syncTag); localStorage.setItem("sync_seen_tag",syncTag); }
    }catch(e){}
    try{ sessionStorage.setItem("bk_last_result",msg.join("<br>")); }catch(e){}
    syncStatusMsg("✅ 복원 완료!<br>"+msg.join("<br>")+"<br><br>🔄 잠시 후 화면을 새로 불러올게요…","ok");
    setTimeout(function(){ location.reload(); },1800);
  }).catch(function(e){
    syncStatusMsg("❌ 암호가 틀렸거나 파일이 손상됐어요.<br><span style='font-size:11px'>("+(e.message||e)+")</span>","err");
  });
}

document.getElementById("syncGo").addEventListener("click",function(){
  if(syncMode==="cloud") doCloudSetup(); else if(syncMode==="create") doSyncCreate(); else doSyncRestore();
});
document.getElementById("syncPw").addEventListener("keydown",function(e){
  if(e.key==="Enter") document.getElementById("syncGo").click();
});

/* 새 백업이 올라와 있으면 앱 열 때 한 번만 물어보기
   — 파일이 크므로 HEAD 로 "바뀌었는지"만 확인하고, 실제 내려받기는 사용자가 누를 때 */
(function(){
  if(!window.fetch||!window.crypto||!crypto.subtle) return;
  fetch(SYNC_URL,{method:"HEAD",cache:"no-store"}).then(function(r){
    if(!r.ok) return;
    var tag=r.headers.get("etag")||r.headers.get("last-modified");
    if(!tag) return;
    var applied=null,seen=null;
    try{ applied=localStorage.getItem("sync_applied_tag"); seen=localStorage.getItem("sync_seen_tag"); }catch(e){}
    if(tag===applied||tag===seen) return;
    try{ localStorage.setItem("sync_seen_tag",tag); }catch(e){}
    setTimeout(function(){ openSyncRestore(true); },1200);
  }).catch(function(){});
})();

/* ── 화면 크기 직접 조절 (A- / A+) : 안쪽 iframe 까지 함께 확대 ── */
var SZ_STEPS=[1,1.15,1.3,1.5,1.7,2,2.3,2.6,3];
function szAuto(){var w=window.innerWidth;
  return w>=1200?1.7:w>=950?1.6:w>=760?1.45:w>=620?1.3:w>=520?1.15:1;}
function szLoad(){try{var v=parseFloat(localStorage.getItem("najin_ui_scale"));if(v>0)return v;}catch(e){}return szAuto();}
function szSave(v){try{localStorage.setItem("najin_ui_scale",String(v));}catch(e){}}
var SZ=szLoad();
function szApply(){
  ["f-eval","f-consult"].forEach(function(id){
    var fr=document.getElementById(id); if(!fr)return;
    try{ var d=fr.contentDocument; if(d&&d.body) d.body.style.zoom=SZ; }catch(e){}
  });
  var el=document.getElementById("szVal"); if(el) el.textContent=Math.round(SZ*100)+"%";
}
function stepScale(dir){
  var bi=0,bd=1e9,i,d;
  for(i=0;i<SZ_STEPS.length;i++){d=Math.abs(SZ_STEPS[i]-SZ);if(d<bd){bd=d;bi=i;}}
  var ni=bi+dir; if(ni<0)ni=0; if(ni>SZ_STEPS.length-1)ni=SZ_STEPS.length-1;
  SZ=SZ_STEPS[ni]; szSave(SZ); szApply();
}
["f-eval","f-consult"].forEach(function(id){
  var fr=document.getElementById(id);

function uploadCombinedBackup(ev){
  var file=ev.target.files[0];
  if(!file){return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var backup=JSON.parse(e.target.result);
      var evalObj=null, consultObj=null;

      /* ── 백업 형식 판별 ── */
      if(backup && backup.type==="교실일지_통합백업" && backup.data){
        evalObj    = backup.data.eval    || null;
        consultObj = backup.data.consult || null;
      }else if(backup && (backup.children || backup.records)){
        evalObj = backup;                             /* 유아평가 단일 백업 */
      }else if(Array.isArray(backup)){
        consultObj = {records:backup, classes:[]};    /* 상담기록 단일 백업 */
      }else{
        showBkStatus("❌ 인식할 수 없는 백업 형식이에요.","err");
        ev.target.value=""; return;
      }

      /* ── 부모 localStorage 에 직접 기록 ──
         srcdoc iframe 은 부모와 같은 origin 이라 저장소를 공유한다.
         따라서 iframe 이 준비됐는지와 무관하게 확실히 저장된다.       */
      var msg=[], wrote=0;

      /* ⚠️ 작은 상담기록을 먼저 저장한다.
         유아평가가 저장공간을 거의 다 쓰는 경우가 있어서, 큰 것을 먼저 쓰면
         상담기록이 들어갈 자리가 없어져 조용히 실패하기 때문. */
      if(consultObj){
        try{
          var recs=Array.isArray(consultObj.records)?consultObj.records:[];
          var cls =Array.isArray(consultObj.classes)?consultObj.classes:[];
          localStorage.setItem("consult_records_v1", JSON.stringify(recs));
          localStorage.setItem("consult_classes_v1", JSON.stringify(cls));
          msg.push("✓ 상담기록 "+recs.length+"건"); wrote++;
        }catch(err){ msg.push("✗ 상담기록 저장 실패 — 저장공간 부족일 수 있어요"); }
      }else{
        msg.push("· 상담기록 — 파일에 데이터 없음");
      }

      if(evalObj){
        try{
          localStorage.setItem("유아평가_v3", JSON.stringify(evalObj));
          var en=evalObj.records?Object.keys(evalObj.records).length:0;
          msg.push("✓ 유아평가 "+en+"일치"); wrote++;
        }catch(err){
          msg.push("✗ 유아평가 저장 실패 — 저장공간이 부족해요 ("
                   +Math.round(JSON.stringify(evalObj).length/1024)+" KB 필요)");
        }
      }else{
        msg.push("· 유아평가 — 파일에 데이터 없음");
      }

      if(!wrote){
        showBkStatus("⚠️ 복원된 게 없어요.<br>"+msg.join("<br>"),"err");
        ev.target.value=""; return;
      }

      /* ── 진짜로 저장됐는지 되읽어서 검증 ── */
      var bad=[];
      if(evalObj && !localStorage.getItem("유아평가_v3")) bad.push("유아평가");
      if(consultObj && !localStorage.getItem("consult_records_v1")) bad.push("상담기록");
      if(bad.length){
        showBkStatus("❌ "+bad.join("·")+" 저장이 확인되지 않았어요.<br>"
                    +"저장공간이 가득 찼거나 시크릿 모드일 수 있어요.<br>"+msg.join("<br>"),"err");
        ev.target.value=""; return;
      }

      /* ── 화면 새로 불러오기 (두 탭 모두 확실히 반영) ── */
      showBkStatus("✅ 복원 완료!<br>"+msg.join("<br>")
                  +"<br><br>🔄 잠시 후 화면을 새로 불러올게요…","ok");
      ev.target.value="";
      try{ sessionStorage.setItem("bk_last_result", msg.join("<br>")); }catch(e){}
      setTimeout(function(){ location.reload(); }, 1800);
      return;

    }catch(err){
      showBkStatus("❌ 파일을 읽을 수 없어요: "+(err.message||err),"err");
    }
    ev.target.value="";
  };
  reader.onerror=function(){
    showBkStatus("❌ 파일 읽기 실패","err");
    ev.target.value="";
  };
  reader.readAsText(file,"UTF-8");
}

    var at=new Date().toISOString();
    var batch=cloudDb.batch();
    parts.forEach(function(p,i){ batch.set(ref.collection("parts").doc(String(i)),{i:i,ct:p,at:at}); });
    batch.set(ref,{v:2,alg:"AES-GCM",kdf:"PBKDF2-SHA256-150000",z:zipped?"gzip":null,at:at,device:cloudDevice(),
                   counts:col.counts,salt:b64enc(salt),iv:b64enc(iv),n:parts.length,bytes:ct.length});
    await batch.commit();
    cloudLS(CLOUD_AT_KEY,at); cloudLastErr="";
    cloudChip("ok","저장됨 "+new Date(at).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}),
              "유아평가 "+col.counts.eval+"일치 · 상담기록 "+col.counts.consult+"건 · "+Math.round(ct.length/1024)+"KB");
  }catch(e){
    cloudLastErr=(e&&e.message)||String(e);
    cloudChip("err","실패","자동 백업 실패: "+cloudLastErr);
  }finally{ cloudBusy=false; }
}
function cloudSchedule(reason){
  if(!cloudPw()) return;
  clearTimeout(cloudTimer);
  cloudChip("pending","곧 저장");
  cloudTimer=setTimeout(function(){ cloudPush(reason||"auto"); }, CLOUD_DEBOUNCE);
}

/* ── 내려받기 ── */
async function cloudFetch(pw){
  await cloudInit();
  var room=await cloudRoomId(pw);
  var ref=cloudDoc(room);
  var snap=await ref.get();
  if(!snap.exists) return null;
  var m=snap.data();
  var ct="";
  if(m.n>0){
    var ps=await ref.collection("parts").get();
    var arr=[]; ps.forEach(function(d){ var x=d.data(); arr[x.i]=x.ct; });
    ct=arr.join("");
  }else ct=m.ct||"";
  var key=await syncKey(pw,b64dec(m.salt));
  var plain=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64dec(m.iv)},key,b64dec(ct)));
  if(m.z==="gzip") plain=await gunzipBytes(plain);
  return {meta:m, backup:JSON.parse(new TextDecoder().decode(plain))};
}
function cloudApply(res){
  var d=(res.backup&&res.backup.data)||{}; var msg=[];
  if(d.consult){
    localStorage.setItem("consult_records_v1",JSON.stringify(d.consult.records||[]));
    localStorage.setItem("consult_classes_v1",JSON.stringify(d.consult.classes||[]));
    msg.push("✓ 상담기록 "+((d.consult.records||[]).length)+"건");
  }
  if(d.eval){ localStorage.setItem("유아평가_v3",JSON.stringify(d.eval)); msg.push("✓ 유아평가 "+(d.eval.records?Object.keys(d.eval.records).length:0)+"일치"); }
  cloudLS(CLOUD_AT_KEY,res.meta.at);
  return msg;
}
async function cloudPullNow(force){
  var pw=cloudPw(); if(!pw){ showBkStatus("먼저 암호를 정해주세요.","err"); return; }
  try{
    showBkStatus("☁️ 클라우드에서 내려받는 중…","ok");
    var res=await cloudFetch(pw);
    if(!res){ showBkStatus("클라우드에 아직 백업이 없어요. 이 기기 기록을 지금 올릴게요.","ok"); cloudPush("manual"); return; }
    var when=new Date(res.meta.at).toLocaleString("ko-KR");
    if(!force && !confirm("클라우드 백업("+when+")으로 이 기기 기록을 바꿀까요?\n유아평가 "+(res.meta.counts?res.meta.counts.eval:"?")+"일치 · 상담기록 "+(res.meta.counts?res.meta.counts.consult:"?")+"건\n\n(이 기기에만 있는 최근 변경은 사라져요)")) { showBkStatus("취소했어요.","err"); return; }
    var msg=cloudApply(res);
    try{ sessionStorage.setItem("bk_last_result","☁️ 클라우드에서 복원<br>"+msg.join("<br>")); }catch(e){}
    showBkStatus("✅ 복원 완료!<br>"+msg.join("<br>")+"<br><br>🔄 화면을 새로 불러올게요…","ok");
    setTimeout(function(){ location.reload(); },1500);
  }catch(e){
    var m=(e&&e.message)||String(e);
    showBkStatus("❌ 내려받기 실패: "+(/decrypt|operation/i.test(m)?"암호가 다른 기기와 달라요":m),"err");
  }
}

/* ── 실시간 감시: 다른 기기가 올리면 자동 반영 ── */
async function cloudWatch(){
  var pw=cloudPw(); if(!pw) return;
  try{
    await cloudInit();
    var room=await cloudRoomId(pw); cloudRoom=room;
    if(cloudUnsub) cloudUnsub();
    cloudUnsub=cloudDoc(room).onSnapshot(function(snap){
      if(!snap.exists) return;
      var m=snap.data()||{};
      var applied=cloudLS(CLOUD_AT_KEY)||"";
      if(!m.at || m.at<=applied) return;
      if(m.device===cloudDevice()){ cloudLS(CLOUD_AT_KEY,m.at); return; }
      if(cloudTimer || cloudBusy) return;   /* 이 기기에 올리려는 변경이 있으면 건너뜀 (곧 올라감) */
      cloudChip("busy","새 기록 받는 중…");
      cloudFetch(pw).then(function(res){
        if(!res) return;
        var msg=cloudApply(res);
        try{ sessionStorage.setItem("bk_last_result","☁️ 다른 기기의 기록을 자동 반영했어요<br>"+msg.join("<br>")); }catch(e){}
        location.reload();
      }).catch(function(e){ cloudLastErr=(e&&e.message)||String(e); cloudChip("err","받기 실패",cloudLastErr); });
    },function(e){ cloudLastErr=e.message||String(e); cloudChip("err","연결 오류",cloudLastErr); });
    cloudChip("ok","연결됨",cloudStatusHtml().replace(/<[^>]+>/g,""));
  }catch(e){ cloudLastErr=(e&&e.message)||String(e); cloudChip("err","연결 실패",cloudLastErr); }
}

function cloudTurnOff(){

  closeSyncModal(); cloudChip("off","꺼짐","자동 백업이 꺼져 있어요"); showBkStatus("자동 백업을 껐어요. 클라우드에 있던 기록은 그대로 남아 있어요.","ok");

async function doCloudSetup(){
  var pw=document.getElementById("syncPw").value;
  if(pw.length<4){ syncStatusMsg("암호를 4자 이상 넣어주세요.","err"); return; }
  syncStatusMsg("☁️ 클라우드에 연결하는 중…","ok");
  try{
    await cloudInit();
    var res=null;
    try{ res=await cloudFetch(pw); }
    catch(e){ syncStatusMsg("❌ 이 암호로는 클라우드 기록을 열 수 없어요. 다른 기기에서 정한 암호와 같은지 확인해주세요.","err"); return; }
    cloudLS(CLOUD_PW_KEY,pw);
    var local=cloudCollect();
    var mine=local.counts.eval+local.counts.consult;
    if(res){
      var cloudN=(res.meta.counts?(res.meta.counts.eval||0)+(res.meta.counts.consult||0):0);
      var when=new Date(res.meta.at).toLocaleString("ko-KR");
      if(mine===0 || confirm("클라우드에 "+when+" 백업이 있어요.\n유아평가 "+(res.meta.counts?res.meta.counts.eval:"?")+"일치 · 상담기록 "+(res.meta.counts?res.meta.counts.consult:"?")+"건\n\n[확인] 클라우드 기록을 이 기기에 내려받기\n[취소] 이 기기 기록("+mine+"건)을 클라우드에 올리기")){
        var msg=cloudApply(res);
        try{ sessionStorage.setItem("bk_last_result","☁️ 자동 백업 켜짐 · 클라우드에서 복원<br>"+msg.join("<br>")); }catch(e){}
        syncStatusMsg("✅ 켜졌어요! 클라우드 기록을 받아 새로 불러올게요…","ok");
        setTimeout(function(){ location.reload(); },1500); return;
      }
    }
    cloudLS(CLOUD_AT_KEY,null);
    if(!res && mine===0){
      syncStatusMsg("⚠️ 이 암호로 된 클라우드 백업이 없고, 이 기기에도 기록이 없어요.<br>다른 기기에서 켰다면 <b>그때 정한 암호</b>와 같은지 확인해주세요.<br>(처음 켜는 거라면 정상 — 그대로 켜졌어요)","err");
      cloudWatch(); return;
    }
    closeSyncModal();
    showBkStatus("✅ 자동 백업이 켜졸어요. 지금 이 기기 기록을 올리고 있어요…".replace("켜졸","켜졌"),"ok");
    await cloudPush("setup"); cloudWatch();
    var st=document.getElementById("cloudStatusLine"); if(st) st.innerHTML=cloudStatusHtml();
  }catch(e){ syncStatusMsg("❌ 연결 실패: "+((e&&e.message)||e),"err"); }
}

/* storage 이벤트를 못 받는 브라우저 대비: 20초마다 저장소 서명 비교 */
(function(){

/* ──────────── 토큰 사용량 추적 ──────────── */
var TK_KEY="cj_token_usage_v1";
var PRICE_IN=3/1000000;   /* Sonnet 4: $3 per MTok input  */
var PRICE_OUT=15/1000000; /* Sonnet 4: $15 per MTok output */
var USD_KRW=1400;         /* 대략 환율 (참고용) */

function tkEmpty(){return {input:0,output:0,calls:0,firstCall:null,lastCall:null};}
function tkLoad(){
  try{
    var d=JSON.parse(localStorage.getItem(TK_KEY)||"null");
    if(!d) return tkEmpty();
    return {input:d.input||0,output:d.output||0,calls:d.calls||0,firstCall:d.firstCall||null,lastCall:d.lastCall||null};
  }catch(e){return tkEmpty();}
}
function tkSave(t){try{localStorage.setItem(TK_KEY,JSON.stringify(t));}catch(e){}}

function tkFormatShort(n){
  if(n>=1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"")+"M";
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,"")+"k";
  return String(n);
}
function tkFormatDate(iso){
  if(!iso) return "—";
  try{
    var d=new Date(iso);
    var mm=String(d.getMonth()+1).padStart(2,"0");
    var dd=String(d.getDate()).padStart(2,"0");
    var hh=String(d.getHours()).padStart(2,"0");
    var mi=String(d.getMinutes()).padStart(2,"0");
    return d.getFullYear()+"."+mm+"."+dd+" "+hh+":"+mi;
  }catch(e){return "—";}
}

function tkUpdateChip(){
  var t=tkLoad();
  var total=t.input+t.output;
  var el=document.getElementById("tkChipNum");
  if(el) el.textContent=tkFormatShort(total);
}

function openTokenModal(){
  var t=tkLoad();
  var cost=t.input*PRICE_IN+t.output*PRICE_OUT;
  document.getElementById("tkInput").textContent=t.input.toLocaleString();
  document.getElementById("tkOutput").textContent=t.output.toLocaleString();
  document.getElementById("tkTotal").textContent=(t.input+t.output).toLocaleString();
  document.getElementById("tkCalls").textContent=t.calls.toLocaleString()+"회";
  document.getElementById("tkCostUsd").textContent="$"+cost.toFixed(4);
  document.getElementById("tkCostKrw").textContent="≈ "+Math.round(cost*USD_KRW).toLocaleString()+"원 (1$≈"+USD_KRW+"원 기준)";
  document.getElementById("tkFirst").textContent=tkFormatDate(t.firstCall);
  document.getElementById("tkLast").textContent=tkFormatDate(t.lastCall);
  document.getElementById("tokenModal").classList.add("show");
}
function closeTokenModal(e){
  if(e&&e.target.id&&e.target.id!=="tokenModal") return;
  document.getElementById("tokenModal").classList.remove("show");
}
function resetTokens(){
  if(!confirm("토큰 사용량 기록을 모두 초기화할까요?\n(누적 비용·호출 횟수가 0으로 돌아갑니다.)")) return;
  tkSave(tkEmpty());
  tkUpdateChip();
  openTokenModal();
}

window.addEventListener("message",function(e){
  if(!e.data||e.data.type!=="cj_token_usage") return;
  var t=tkLoad();
  t.input+=(e.data.input||0);
  t.output+=(e.data.output||0);
  t.calls+=1;
  var now=new Date().toISOString();
  if(!t.firstCall) t.firstCall=now;
  t.lastCall=now;
  tkSave(t);
  tkUpdateChip();
});

tkUpdateChip();
