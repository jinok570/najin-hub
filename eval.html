[{&quot;name&quot;:&quot;유아명&quot;,&quot;characteristics&quot;:&quot;- ...\n- ...&quot;,&quot;support&quot;:&quot;- ...\n- ...&quot;,&quot;note&quot;:&quot;...&quot;}, ...]
8. 요청받은 [평가 대상 유아 명단]에 있는 모든 이름을 빠짐없이 포함하세요. 한 명도 빠뜨리면 안 됩니다.`;

async function requestSemesterRows(names, blocksByName, periodLabel, guideText){
  if(!names.length) return {list:[], errMsg:&#x27;&#x27;, authFailed:false};
  const allObs=names.map(n=&gt;blocksByName[n]).join(&#x27;\n\n&#x27;).slice(0,12000);
  try{
    const res=await fetch(&#x27;https://n8n.auto-navajin.com/webhook/eval-ai&#x27;,{
      method:&#x27;POST&#x27;,
      headers:{
        &#x27;Content-Type&#x27;:&#x27;application/json&#x27;
      },
      body:JSON.stringify({
        model:rpModel,
        max_tokens:8192,
        system:SEMESTER_SYS+(guideText?`\n\n[참고자료 - 아래 문체와 형식을 최대한 참고하여 작성하세요]\n${guideText}`:&#x27;&#x27;),
        messages:[{role:&#x27;user&#x27;,content:`대상 기간: ${periodLabel}\n\n[평가 대상 유아 명단]\n${names.join(&#x27;, &#x27;)}\n\n[유아별 관찰 기록]\n${allObs}`}]
      })
    });
    if(!res.ok){
      if(res.status===401) return {list:null, errMsg:&#x27;&#x27;, authFailed:true};
      const err=await res.json().catch(()=&gt;({}));
      return {list:null, errMsg: err.error?.message||`오류 코드: ${res.status}`, authFailed:false};
    }
    const data=await res.json();
    trackTokens(data);
    const raw=(data.content||[]).filter(b=&gt;b.type===&#x27;text&#x27;).map(b=&gt;b.text).join(&#x27;&#x27;).trim();
    const list=parseNameKeyedJson(raw);

}

  const allNames=db.children.slice();

    }
  });

  if(!allNames.length){
    showToast(&#x27;등록된 유아가 없습니다.&#x27;);
    icon.textContent=&#x27;✨&#x27;;btn.disabled=false;
    return;
  }

  const guideText=(db.reportGuideFiles||[]).map(f=&gt;f.text).join(&#x27;\n\n&#x27;).slice(0,4000);

  // AI가 명단 일부를 빠뜨리는 경우가 있어(특히 인원이 많을 때), 빠진 아이만 골라 최대 3회까지 재요청한다
  let remaining=allNames.slice();
  let resultsByName={};
  let attempts=0;
  let authFailed=false;
  let lastErrMsg=&#x27;&#x27;;
  while(remaining.length &amp;&amp; attempts&lt;2){
    attempts++;
    const r=await requestSemesterRows(remaining, blocksByName, periodLabel, guideText);
    if(r.authFailed){ authFailed=true; break; }
    if(!r.list){ lastErrMsg=r.errMsg; break; }
    r.list.forEach(item=&gt;{ if(item&amp;&amp;item.name) resultsByName[item.name]=item; });
    remaining=remaining.filter(n=&gt;!resultsByName[n]);
  }

  if(authFailed){
    showToast(&#x27;❌ API 키가 올바르지 않습니다.&#x27;);
    icon.textContent=&#x27;✨&#x27;;btn.disabled=false;return;
  }

  remaining.forEach(name=&gt;{
    resultsByName[name]={name, characteristics:&#x27;다양한 놀이와 활동에 즐겁게 참여하며 또래와 원만하게 지냄.&#x27;, support:&#x27;-지속적인 관찰과 격려&#x27;, note:&#x27;&#x27;};
  });

  const header=[&#x27;번호&#x27;,&#x27;유아명&#x27;,&#x27;놀이 및 행동특성&#x27;,&#x27;지원방안&#x27;,&#x27;비고 (다문화, 특수 등)&#x27;];
  const rows=allNames.map((name,i)=&gt;{
    const item=resultsByName[name]||{};
    return [String(i+1), name, item.characteristics||&#x27;&#x27;, item.support||&#x27;&#x27;, item.note||&#x27;&#x27;];
  });
  function tsvField(s){ s=String(s||&#x27;&#x27;); return /[\n\t&quot;]/.test(s) ? &#x27;&quot;&#x27;+s.replace(/&quot;/g,&#x27;&quot;&quot;&#x27;)+&#x27;&quot;&#x27; : s; }
  const tsv=[header.map(tsvField).join(&#x27;\t&#x27;)].concat(rows.map(r=&gt;r.map(tsvField).join(&#x27;\t&#x27;))).join(&#x27;\n&#x27;);
  document.getElementById(&#x27;rpResultTa&#x27;).value=tsv;
  document.getElementById(&#x27;rpResult&#x27;).style.display=&#x27;block&#x27;;
  const saveBtn=document.getElementById(&#x27;rpSaveBtn&#x27;);
  if(saveBtn) saveBtn.style.display=&#x27;none&#x27;;

  let tableHtml=&#x27;&lt;div class=&quot;rp-section-title&quot;&gt;📊 &#x27;+escHtml(periodLabel)+&#x27; 학기 종합 보고서 (전체 유아)&lt;/div&gt;&#x27;;
  tableHtml+=&#x27;&lt;div class=&quot;rp-table-preview-wrap&quot;&gt;&lt;table class=&quot;rp-table-preview&quot;&gt;&lt;thead&gt;&lt;tr&gt;&#x27;+header.map(h=&gt;`&lt;th&gt;${escHtml(h)}&lt;/th&gt;`).join(&#x27;&#x27;)+&#x27;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
  rows.forEach(r=&gt;{
    tableHtml+=&#x27;&lt;tr&gt;&#x27;+r.map(c=&gt;`&lt;td&gt;${escHtml(c)}&lt;/td&gt;`).join(&#x27;&#x27;)+&#x27;&lt;/tr&gt;&#x27;;
  });
  tableHtml+=&#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&#x27;;
  document.getElementById(&#x27;rpTablePreview&#x27;).innerHTML=tableHtml;

  const fallbackNote = remaining.length ? ` (${remaining.length}명은 기본 문구로 채워짐 - 다시 생성하면 개선될 수 있어요)` : &#x27;&#x27;;
  showToast(`✨ 전체 유아 ${rows.length}명 보고서 생성 완료!${fallbackNote}`);
  icon.textContent=&#x27;✨&#x27;;btn.disabled=false;
}

function parseThemeBatchJson(raw){
  try{
    const s=raw.slice(raw.indexOf(&#x27;[&#x27;), raw.lastIndexOf(&#x27;]&#x27;)+1);
    const parsed=JSON.parse(s);
    if(Array.isArray(parsed)) return parsed;
  }catch(e){}
  const items=[];
  const re=/\{[^{}]*&quot;date&quot;\s*:\s*&quot;[^&quot;]+&quot;[^{}]*\}/g;
  let m;
  while((m=re.exec(raw))){
    try{ items.push(JSON.parse(m[0])); }catch(e){}
  }
  return items.length?items:null;
}

const THEME_BATCH_SYS = `당신은 유치원 놀이중심 교육과정 전문가입니다.
교사가 체크한 이번 주의 생활주제를 바탕으로, 주어진 날짜 목록 각각에 대해 아래 5개의 키를 &quot;모두&quot; 채운 JSON 객체를 만드세요. 어떤 키도 비워두거나 생략하면 안 됩니다.

- date: &quot;YYYY-MM-DD&quot;
- theme: 그날의 &quot;놀이주제 및 교사 계획 활동&quot; 문장. 아래 plays 2개를 아우르는 내용으로 1~2문장. 절대 빈 문자열로 두지 마세요.
- plays: 추천 놀이 정확히 2개 (배열), 각 1~2문장의 구체적인 활동 내용
- supports: plays와 1:1로 짝이 되는 지원계획 2개 (배열), 각각 하이픈(-)으로 시작하는 한 줄
- etc: &quot;기타&quot; 참고사항(준비물·유의사항 등). 하이픈(-)으로 시작하는 1~2줄. 절대 빈 문자열로 두지 마세요.

예시(형식 참고용, 내용은 매번 새로 작성):
{&quot;date&quot;:&quot;2026-07-02&quot;,&quot;theme&quot;:&quot;물놀이와 미술 활동을 통해 여름의 감각을 다양하게 경험한다.&quot;,&quot;plays&quot;:[&quot;1. 물총 놀이를 하며 시원한 여름을 체감한다.&quot;,&quot;2. 물감을 물에 풀어 색깔 물놀이를 한다.&quot;],&quot;supports&quot;:[&quot;- 젖어도 되는 옷과 여벌 옷을 미리 준비하도록 안내한다.&quot;,&quot;- 미끄럼 방지를 위해 바닥에 매트를 깔아준다.&quot;],&quot;etc&quot;:&quot;- 물총, 대야, 물감 등 놀이 재료를 미리 준비한다.\n- 야외 활동 시 자외선 차단제를 발라준다.&quot;}

규칙:
1. 각 날짜마다 생활주제와 관련된 추천 놀이를 정확히 2개씩 작성하세요.
2. 여러 날짜에 걸쳐 다양성을 주어 같은 내용이 반복되지 않도록 하세요.
3. 반드시 아래 JSON 배열 형식으로만 응답하세요. 다른 설명이나 코드블록 표시 없이 순수 JSON 배열만 출력하세요.
[{&quot;date&quot;:&quot;...&quot;,&quot;theme&quot;:&quot;...&quot;,&quot;plays&quot;:[&quot;...&quot;,&quot;...&quot;],&quot;supports&quot;:[&quot;...&quot;,&quot;...&quot;],&quot;etc&quot;:&quot;...&quot;}, ...]
4. 배열의 date는 반드시 주어진 날짜 목록에 있는 값만 사용하고, 목록의 모든 날짜를 빠짐없이 포함하세요.
5. theme와 etc를 포함해 5개 키를 모든 날짜 항목에 빠짐없이 채우세요.`;

async function requestThemeContentForDates(topics, datesList){
  if(!datesList.length) return {list:[], errMsg:&#x27;&#x27;, authFailed:false};
  try{
    const res=await fetch(&#x27;https://n8n.auto-navajin.com/webhook/eval-ai&#x27;,{
      method:&#x27;POST&#x27;,
      headers:getApiHeaders(),
      body:JSON.stringify({
        model:&#x27;claude-sonnet-4-6&#x27;,
        max_tokens:4000,
        system:THEME_BATCH_SYS,
        messages:[{role:&#x27;user&#x27;,content:`이번 주 생활주제: ${topics.join(&#x27;, &#x27;)}\n\n[배정 대상 날짜 목록]\n${datesList.join(&#x27;, &#x27;)}\n\n위 생활주제를 참고하여 각 날짜에 놀이주제(theme), 우리들의 놀이 2개, 지원계획 2개, 기타 참고사항을 작성해 JSON 배열로 응답해주세요.`}]
      })
    });
    if(!res.ok){
      if(res.status===401) return {list:null, errMsg:&#x27;&#x27;, authFailed:true};
      const err=await res.json().catch(()=&gt;({}));
      return {list:null, errMsg: err.error?.message||`오류 코드 ${res.status}`, authFailed:false};
    }
    const resData=await res.json();
    trackTokens(resData);
    const raw=(resData.content||[]).filter(b=&gt;b.type===&#x27;text&#x27;).map(b=&gt;b.text).join(&#x27;&#x27;).trim();
    const list=parseThemeBatchJson(raw);
    if(!list) return {list:null, errMsg:&#x27;AI 응답 해석 실패&#x27;, authFailed:false};
    return {list, errMsg:&#x27;&#x27;, authFailed:false};
  }catch(e){
    console.error(e);
    return {list:null, errMsg:&#x27;네트워크 오류: &#x27;+(e&amp;&amp;e.message?e.message:String(e)), authFailed:false};
  }
}

function stripNumbering(s){
  return String(s||&#x27;&#x27;).replace(/^\s*[0-9]+\.\s*/,&#x27;&#x27;).trim();
}

function applyThemeBatchResults(list, forceFill, counts){
  let filled=0;
  counts=counts||{our_play:0,support:0,play_theme:0,etc:0};
  (list||[]).forEach(item=&gt;{
    if(!item||!item.date) return;
    const rec=getRec(item.date);
    const plays=(item.plays||[]).filter(Boolean);
    const supports=(item.supports||[]).filter(Boolean);
    // 놀이주제/기타는 AI 응답 형식(단일 날짜 요청 시 형식이 달라지는 경우 등)에 영향받지 않도록
    // AI가 준 theme/etc가 있으면 쓰고, 없으면 우리들의 놀이 내용으로 항상 직접 만들어 절대 빈 칸으로 남기지 않는다
    let theme=(item.theme||&#x27;&#x27;).trim();
    if(!theme &amp;&amp; plays.length){ theme=plays.map(stripNumbering).join(&#x27; &#x27;); }
    let etcNote=(item.etc||&#x27;&#x27;).trim();
    if(!etcNote &amp;&amp; plays.length){ etcNote=&#x27;- 위 놀이에 필요한 재료·준비물을 미리 챙겨주세요.&#x27;; }

    if((forceFill||!rec.our_play) &amp;&amp; plays.length){
      rec.our_play=plays.map((p,i)=&gt;`${i+1}. ${p}`).join(&#x27;\n&#x27;);
      filled++; counts.our_play++;
    }
    if((forceFill||!rec.support) &amp;&amp; supports.length){
      rec.support=supports.map((s,i)=&gt;`${i+1}. ${s}`).join(&#x27;\n&#x27;);
      counts.support++;
    }
    if((forceFill||!rec.play_theme) &amp;&amp; theme){
      rec.play_theme=theme;
      counts.play_theme++;
    }
    if((forceFill||!rec.etc) &amp;&amp; etcNote){
      rec.etc=etcNote;
      counts.etc++;
    }
  });
  return filled;
}

let _themeBatchInFlight=new Set(); // 같은 주가 아직 생성 중이면 중복 API 호출 막는 안전장치
async function generateThemePlayBatch(weekKey){
  if(_themeBatchInFlight.has(weekKey)) return;
  const topics=getCheckedThemesForWeek(weekKey);
  if(!topics.length) return;
  _lastStatusWeekKey=weekKey; // 이 결과 메시지가 어느 주에 대한 것인지 기록해, 다른 주로 넘어가면 자동으로 지워지게 한다
  if(!checkApiKey()){ setThemeBatchStatus(&#x27;⚙️ 더보기 탭에서 API 키를 먼저 설정하세요.&#x27;, &#x27;err&#x27;); setThemeBatchRetryVisible(true); return; }

  const weekdayDates=getWeekdaysInWeek(weekKey);
  const curInWeek=(getWeekStartDate(cur)===weekKey);
  const allTargets = (curInWeek &amp;&amp; !weekdayDates.includes(cur)) ? [...weekdayDates,cur].sort() : weekdayDates;
  if(!allTargets.length){ setThemeBatchStatus(&#x27;이번 주에는 채울 평일이 없어요.&#x27;, &#x27;info&#x27;); return; }

  setThemeBatchRetryVisible(false);
  showToast(&#x27;생활주제로 이번 주 놀이를 채우는 중...&#x27;);
  _themeBatchInFlight.add(weekKey);

  try{
    const counts={our_play:0,support:0,play_theme:0,etc:0};

    // AI가 요청한 날짜 중 일부만 응답에 담아 보내는 경우가 있어(예: 5일 요청했는데 1일만 옴),
    // 빠진 날짜만 골라 다시 요청하는 과정을 최대 2회까지 반복해 전체 날짜를 채운다.
    let remaining=allTargets.slice();
    let combinedList=[];
    let attempts=0;
    let lastErrMsg=&#x27;&#x27;;
    let authFailed=false;
    while(remaining.length &amp;&amp; attempts&lt;2){
      attempts++;
      setThemeBatchStatus(`⏳ 이번 주(${remaining.length}/${allTargets.length}일) 채우는 중... (${attempts}회차)`, &#x27;info&#x27;);
      const r=await requestThemeContentForDates(topics, remaining);
      if(r.authFailed){ authFailed=true; break; }
      if(!r.list){ lastErrMsg=r.errMsg; break; }
      combinedList=combinedList.concat(r.list);
      const got=new Set(r.list.map(item=&gt;item&amp;&amp;item.date).filter(Boolean));
      remaining=remaining.filter(d=&gt;!got.has(d));
    }

    if(authFailed){
      setThemeBatchStatus(&#x27;❌ API 키가 올바르지 않습니다. 더보기 탭에서 키를 확인하세요.&#x27;, &#x27;err&#x27;);
      setThemeBatchRetryVisible(true);
      showToast(&#x27;❌ API 키가 올바르지 않습니다.&#x27;);
      return;
    }
    if(!combinedList.length){
      setThemeBatchStatus(`❌ 반영 실패 (${lastErrMsg||&#x27;응답 없음&#x27;}). 아래 버튼으로 다시 시도해보세요.`, &#x27;err&#x27;);
      setThemeBatchRetryVisible(true);
      showToast(&#x27;❌ 생활주제 반영에 실패했습니다.&#x27;);
      return;
    }

    const totalFilled = applyThemeBatchResults(combinedList, false, counts);
    if(allTargets.includes(cur)) loadForm(cur); // 화면에 새 내용부터 반영한 뒤 저장해야, 저장 시 화면의 예전(빈) 값으로 덮어써지지 않음
    saveData(true);
    const detail=`(우리들의 놀이 ${counts.our_play}·지원계획 ${counts.support}·놀이주제 ${counts.play_theme}·기타 ${counts.etc}일 채움)`;
    if(remaining.length){
      setThemeBatchStatus(`⚠️ 일부 날짜는 응답을 받지 못했어요 (${allTargets.length-remaining.length}/${allTargets.length}일 완료) ${detail}. 아래 버튼으로 다시 시도해보세요.`, &#x27;err&#x27;);
      setThemeBatchRetryVisible(true);
      showToast(`✨ 일부 반영 완료 (${allTargets.length-remaining.length}/${allTargets.length}일)`);
    } else {
      setThemeBatchStatus(`✅ 이번 주 생활주제 반영 완료! (${allTargets.length}일 중 ${totalFilled}일 새로 채움) ${detail}`, &#x27;ok&#x27;);
      setThemeBatchRetryVisible(false);
      showToast(`✨ 이번 주 반영 완료! (${allTargets.length}일 중 ${totalFilled}일 새로 채움)`);
    }
  } finally {
    _themeBatchInFlight.delete(weekKey);
  }
}

function getActMonthKey(off){
  const d=new Date();
  d.setDate(1);
  d.setMonth(d.getMonth()+off);
  return d.getFullYear()+&#x27;-&#x27;+String(d.getMonth()+1).padStart(2,&#x27;0&#x27;);
}

function renderActivity(){
  if(!document.getElementById(&#x27;panel-activity&#x27;).classList.contains(&#x27;active&#x27;))return;
  const DAYS_KO=[&#x27;일&#x27;,&#x27;월&#x27;,&#x27;화&#x27;,&#x27;수&#x27;,&#x27;목&#x27;,&#x27;금&#x27;,&#x27;토&#x27;];
  const monthKey=getActMonthKey(actMonthOff);
  const [yr,mo]=monthKey.split(&#x27;-&#x27;).map(Number);

  // 월 레이블
  document.getElementById(&#x27;actMonthLbl&#x27;).textContent=
    `${yr}년 ${mo}월`+(actMonthOff===0?&#x27; (이번 달)&#x27;:actMonthOff===-1?&#x27; (지난 달)&#x27;:&#x27;&#x27;);

  // 해당 월 날짜 필터
  const monthDates=Object.keys(db.records||{})
    .filter(d=&gt;d.startsWith(monthKey))
    .sort();

  // 요약 통계
  const recCount=monthDates.length;
  const obsCount=monthDates.reduce((s,d)=&gt;s+Object.keys(db.records[d].observations||{}).length,0);
  const actCount=monthDates.filter(d=&gt;db.records[d].our_play||db.records[d].play_theme).length;
  document.getElementById(&#x27;actSummary&#x27;).innerHTML=`
    &lt;div class=&quot;act-sum-card&quot;&gt;&lt;div class=&quot;act-sum-num&quot;&gt;${recCount}&lt;/div&gt;&lt;div class=&quot;act-sum-lbl&quot;&gt;기록한 날&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;act-sum-card&quot;&gt;&lt;div class=&quot;act-sum-num&quot;&gt;${actCount}&lt;/div&gt;&lt;div class=&quot;act-sum-lbl&quot;&gt;활동 기록&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;act-sum-card&quot;&gt;&lt;div class=&quot;act-sum-num&quot;&gt;${obsCount}&lt;/div&gt;&lt;div class=&quot;act-sum-lbl&quot;&gt;관찰 기록&lt;/div&gt;&lt;/div&gt;`;

  // 이달 생활주제 배너
  const themeEl=document.getElementById(&#x27;actThemeBanner&#x27;);
  const theme=db.monthlyThemes&amp;&amp;db.monthlyThemes[monthKey];
  if(theme){
    const kwText=(theme.keywords||[]).slice(0,6).join(&#x27; · &#x27;);
    themeEl.innerHTML=`&lt;div class=&quot;act-theme-banner&quot;&gt;
      &lt;span class=&quot;act-theme-icon&quot;&gt;🌱&lt;/span&gt;
      &lt;div class=&quot;act-theme-info&quot;&gt;
        &lt;div class=&quot;act-theme-name&quot;&gt;${mo}월 생활주제: ${escHtml(theme.theme||&#x27;&#x27;)}&lt;/div&gt;
        ${kwText?`&lt;div class=&quot;act-theme-kw&quot;&gt;${escHtml(kwText)}&lt;/div&gt;`:&#x27;&#x27;}
      &lt;/div&gt;
    &lt;/div&gt;`;
  } else {
    themeEl.innerHTML=&#x27;&#x27;;
  }

  // 날짜별 활동 카드
  const listEl=document.getElementById(&#x27;actDayList&#x27;);
  if(!monthDates.length){
    listEl.innerHTML=`&lt;div class=&quot;act-empty&quot;&gt;
      &lt;div class=&quot;act-empty-icon&quot;&gt;📅&lt;/div&gt;
      &lt;div&gt;${yr}년 ${mo}월에 기록된 활동이 없습니다.&lt;br&gt;‹ › 버튼으로 다른 달을 확인하세요.&lt;/div&gt;
    &lt;/div&gt;`;
    return;
  }

  listEl.innerHTML=monthDates.slice().reverse().map(date=&gt;{
    const r=db.records[date];
    const d=new Date(date);
    const dateLabel=`${mo}월 ${d.getDate()}일 (${DAYS_KO[d.getDay()]})`;
    const fields=[];

    if(r.play_theme) fields.push({icon:&#x27;🎯&#x27;,lbl:&#x27;놀이 주제&#x27;,val:r.play_theme});
    if(r.safety){
      let safetyHtml=`&lt;div class=&quot;act-field-val&quot;&gt;${escHtml(r.safety)}&lt;/div&gt;`;
      if(r.ytLinksSafety&amp;&amp;r.ytLinksSafety.length){
        safetyHtml+=r.ytLinksSafety.map(v=&gt;`&lt;div class=&quot;act-yt-item&quot;&gt;🛡️ ${escHtml(v.title||&#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;);
      }
      fields.push({icon:&#x27;🛡️&#x27;,lbl:&#x27;안전 교육&#x27;,html:safetyHtml});
    }
    if(r.our_play){
      const lines=(r.our_play||&#x27;&#x27;).split(&#x27;\n&#x27;).filter(l=&gt;l.trim());
      const playHtml=lines.length&gt;1
        ?lines.map(l=&gt;`&lt;div style=&quot;padding:1px 0;border-left:2px solid var(--tan);padding-left:6px;margin-bottom:3px;font-size:12.5px;&quot;&gt;${escHtml(l.trim())}&lt;/div&gt;`).join(&#x27;&#x27;)
        :`&lt;div class=&quot;act-field-val&quot;&gt;${escHtml(r.our_play)}&lt;/div&gt;`;
      let ytHtml=&#x27;&#x27;;
      if(r.ytLinks&amp;&amp;r.ytLinks.length){
        ytHtml=r.ytLinks.map(v=&gt;`&lt;div class=&quot;act-yt-item&quot;&gt;🎬 ${escHtml(v.title||&#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;);
      }
      fields.push({icon:&#x27;🧩&#x27;,lbl:&#x27;우리들의 놀이&#x27;,html:playHtml+ytHtml});
    }
    if(r.support) fields.push({icon:&#x27;💡&#x27;,lbl:&#x27;지원계획&#x27;,val:r.support});
    if(r.etc) fields.push({icon:&#x27;📌&#x27;,lbl:&#x27;기타&#x27;,val:r.etc});

    // 관찰한 아이들
    const obsChildren=Object.keys(r.observations||{});

    if(!fields.length&amp;&amp;!obsChildren.length) return &#x27;&#x27;;

    const fieldsHtml=fields.map(f=&gt;`
      &lt;div class=&quot;act-field&quot;&gt;
        &lt;div class=&quot;act-field-lbl&quot;&gt;${f.icon} ${f.lbl}&lt;/div&gt;
        ${f.html||`&lt;div class=&quot;act-field-val&quot;&gt;${escHtml(f.val||&#x27;&#x27;)}&lt;/div&gt;`}
      &lt;/div&gt;`).join(&#x27;&#x27;);

    const obsHtml=obsChildren.length?`
      &lt;div class=&quot;act-field&quot;&gt;
        &lt;div class=&quot;act-field-lbl&quot;&gt;👶 관찰 기록 (${obsChildren.length}명) &lt;span style=&quot;font-weight:400;color:#aaa;font-size:10px;&quot;&gt;· 이름을 눌러 내용 보기&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;act-obs-chips&quot;&gt;${obsChildren.map(n=&gt;`&lt;span class=&quot;act-obs-chip&quot; data-date=&quot;${date}&quot; data-name=&quot;${escHtml(n)}&quot; onclick=&quot;showObservation(this.dataset.date,this.dataset.name)&quot;&gt;${escHtml(n)}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;
      &lt;/div&gt;`:&#x27;&#x27;;

    return `&lt;div class=&quot;act-day-card&quot;&gt;
      &lt;div class=&quot;act-day-head&quot; onclick=&quot;goToDate(&#x27;${date}&#x27;)&quot;&gt;
        &lt;div class=&quot;act-day-left&quot;&gt;
          &lt;span class=&quot;act-day-date&quot;&gt;${dateLabel}&lt;/span&gt;
        &lt;/div&gt;
        &lt;span class=&quot;act-day-goto&quot;&gt;해당 날 기록 보기 →&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;act-day-body&quot;&gt;
        ${fieldsHtml}${obsHtml}
      &lt;/div&gt;
    &lt;/div&gt;`;
  }).filter(Boolean).join(&#x27;&#x27;);
}

function getWeekDates(off){
  const today=new Date();
  const dow=today.getDay()||7;
  const mon=new Date(today);
  mon.setDate(today.getDate()-dow+1+off*7);
  return Array.from({length:5},(_,i)=&gt;{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.toISOString().slice(0,10);});
}
function changeWeek(n){weekOff+=n;renderStats();}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/(864e5));}
function getLastObs(name){
  return Object.keys(db.records).sort().reverse().find(d=&gt;db.records[d].observations&amp;&amp;db.records[d].observations[name])||null;
}

// ═══════════════════════════════════════════
function switchTab(id,btn){
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
  document.querySelectorAll(&#x27;.panel&#x27;).forEach(p=&gt;p.classList.remove(&#x27;active&#x27;));
  btn.classList.add(&#x27;active&#x27;);
  document.getElementById(&#x27;panel-&#x27;+id).classList.add(&#x27;active&#x27;);
  if(id===&#x27;stats&#x27;)renderStats();
  if(id===&#x27;activity&#x27;)renderActivity();
  if(id===&#x27;report&#x27;)initReport();
  if(id===&#x27;more&#x27;){renderApiSetup();}
  document.getElementById(&#x27;scrollArea&#x27;).scrollTop=0;
}

function renderStats(){
  if(!document.getElementById(&#x27;panel-stats&#x27;).classList.contains(&#x27;active&#x27;))return;
  const wk=getWeekDates(weekOff);
  const today=todayStr();
  const d0=new Date(wk[0]),d4=new Date(wk[4]);
  document.getElementById(&#x27;weekLbl&#x27;).textContent=
    `${d0.getMonth()+1}/${d0.getDate()}(월) ~ ${d4.getMonth()+1}/${d4.getDate()}(금)`+
    (weekOff===0?&#x27; ★&#x27;:weekOff===-1?&#x27; 지난주&#x27;:&#x27;&#x27;);

  const active=wk.filter(d=&gt;db.records[d]);
  const totObs=wk.reduce((s,d)=&gt;s+(db.records[d]?Object.keys(db.records[d].observations||{}).length:0),0);
  const totPoss=active.length*db.children.length;
  const pct=totPoss&gt;0?Math.round(totObs/totPoss*100):0;
  const unobsWeek=db.children.filter(n=&gt;!wk.some(d=&gt;db.records[d]&amp;&amp;db.records[d].observations&amp;&amp;db.records[d].observations[n]));

  document.getElementById(&#x27;sumGrid&#x27;).innerHTML=
    `&lt;div class=&quot;sum-card sc-b&quot;&gt;&lt;div class=&quot;num&quot;&gt;${active.length}&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;기록한 날&lt;/div&gt;&lt;/div&gt;`+
    `&lt;div class=&quot;sum-card sc-g&quot;&gt;&lt;div class=&quot;num&quot;&gt;${totObs}&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;이번 주 관찰 수&lt;/div&gt;&lt;/div&gt;`+
    `&lt;div class=&quot;sum-card ${pct&gt;=80?&#x27;sc-g&#x27;:pct&gt;=50?&#x27;sc-b&#x27;:pct&gt;=20?&#x27;sc-o&#x27;:&#x27;sc-r&#x27;}&quot;&gt;&lt;div class=&quot;num&quot;&gt;${pct}%&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;달성률&lt;/div&gt;&lt;/div&gt;`+
    `&lt;div class=&quot;sum-card ${unobsWeek.length===0?&#x27;sc-g&#x27;:&#x27;sc-r&#x27;}&quot;&gt;&lt;div class=&quot;num&quot;&gt;${unobsWeek.length}&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;이번 주 미기록&lt;/div&gt;&lt;/div&gt;`;

  // alert
  const ab=document.getElementById(&#x27;alertBox&#x27;);
  if(unobsWeek.length===0&amp;&amp;active.length&gt;0){
    ab.innerHTML=&#x27;&lt;div class=&quot;alert-box alert-good&quot;&gt;🎉 &lt;span&gt;이번 주 &lt;strong&gt;모든 아이&lt;/strong&gt;가 기록되었어요!&lt;/span&gt;&lt;/div&gt;&#x27;;
  } else if(unobsWeek.length&gt;0){
    const chips=unobsWeek.map(n=&gt;{
      const last=getLastObs(n);
      const ago=last?daysBetween(last,today):null;
      const cls=ago===null?&#x27;nc-r&#x27;:ago&lt;=3?&#x27;nc-o&#x27;:&#x27;nc-r&#x27;;
      return`&lt;span class=&quot;nm-chip ${cls}&quot;&gt;${n}${ago!==null?` (${ago}일 전)`:&#x27; (없음)&#x27;}&lt;/span&gt;`;
    }).join(&#x27;&#x27;);
    ab.innerHTML=`&lt;div class=&quot;alert-box alert-warn&quot;&gt;⚠️ &lt;div&gt;&lt;strong&gt;${unobsWeek.length}명 미기록&lt;/strong&gt;&lt;div class=&quot;alert-names&quot;&gt;${chips}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
  } else {
    ab.innerHTML=&#x27;&lt;div class=&quot;alert-box alert-info&quot;&gt;📝 이번 주 아직 기록이 없습니다.&lt;/div&gt;&#x27;;
  }

  // heat grid
  const dn=[&#x27;월&#x27;,&#x27;화&#x27;,&#x27;수&#x27;,&#x27;목&#x27;,&#x27;금&#x27;];
  let h=&#x27;&lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;font-size:10px;padding:4px 5px;min-width:54px;&quot;&gt;이름&lt;/th&gt;&#x27;;
  wk.forEach((d,i)=&gt;{
    const isT=d===today;
    const hasR=!!db.records[d];
    h+=`&lt;th style=&quot;min-width:38px;${isT?&#x27;background:#c9b99a;&#x27;:&#x27;&#x27;}${!hasR?&#x27;color:#bbb;&#x27;:&#x27;&#x27;}&quot;&gt;${dn[i]}&lt;br&gt;&lt;span style=&quot;font-weight:400;font-size:9.5px&quot;&gt;${new Date(d).getDate()}일&lt;/span&gt;&lt;/th&gt;`;
  });
  h+=&#x27;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
  db.children.forEach(name=&gt;{
    h+=`&lt;tr&gt;&lt;td class=&quot;hn&quot;&gt;${name}&lt;/td&gt;`;
    wk.forEach(d=&gt;{
      const has=!!db.records[d];
      const obs=has&amp;&amp;db.records[d].observations&amp;&amp;db.records[d].observations[name];
      const isT=d===today;
      let cls,lbl;
      if(!has){cls=&#x27;hc-0&#x27;;lbl=&#x27;–&#x27;;}
      else if(obs){cls=isT?&#x27;hc-ty&#x27;:&#x27;hc-y&#x27;;lbl=&#x27;✓&#x27;;}
      else{cls=isT?&#x27;hc-tn&#x27;:&#x27;hc-n&#x27;;lbl=&#x27;✗&#x27;;}
      h+=`&lt;td class=&quot;hc ${cls}&quot;&gt;${lbl}&lt;/td&gt;`;
    });
    h+=&#x27;&lt;/tr&gt;&#x27;;
  });
  h+=&#x27;&lt;/tbody&gt;&#x27;;
  document.getElementById(&#x27;heatTbl&#x27;).innerHTML=h;

  // bars
  const p4=Array.from({length:28},(_,i)=&gt;addDays(today,-27+i));
  renderBars(&#x27;bars4w&#x27;,p4.filter(d=&gt;db.records[d]));
  renderBars(&#x27;barsAll&#x27;,Object.keys(db.records));
}

function renderBars(elId,activeDates){
  const el=document.getElementById(elId);
  if(!activeDates.length){el.innerHTML=&#x27;&lt;div style=&quot;color:#aaa;font-size:11.5px;padding:6px&quot;&gt;기록 데이터 없음&lt;/div&gt;&#x27;;return;}
  const total=activeDates.length;
  const counts=db.children.map(n=&gt;({n,c:activeDates.filter(d=&gt;db.records[d]&amp;&amp;db.records[d].observations&amp;&amp;db.records[d].observations[n]).length}));
  counts.sort((a,b)=&gt;b.c-a.c);
  const mx=Math.max(...counts.map(x=&gt;x.c),1);
  el.innerHTML=counts.map(({n,c})=&gt;{
    const pct=Math.round(c/total*100);
    const wp=Math.round(c/mx*100);
    const cls=pct&gt;=80?&#x27;bf-g&#x27;:pct&gt;=50?&#x27;bf-b&#x27;:pct&gt;=20?&#x27;bf-o&#x27;:c&gt;0?&#x27;bf-r&#x27;:&#x27;bf-0&#x27;;
    return`&lt;div class=&quot;bar-row2&quot;&gt;
      &lt;div class=&quot;bar-n&quot;&gt;${n}&lt;/div&gt;
      &lt;div class=&quot;bar-track&quot;&gt;&lt;div class=&quot;bar-fill2 ${cls}&quot; style=&quot;width:${wp}%&quot;&gt;${c&gt;0?`&lt;span&gt;${pct}%&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;bar-cnt&quot;&gt;${c}/${total}&lt;/div&gt;
    &lt;/div&gt;`;
  }).join(&#x27;&#x27;);
}

    &lt;tr&gt;
      &lt;td class=&quot;p-lbl lbl-play&quot;&gt;🎯 놀이 주제 및&lt;br&gt;교사 계획 활동&lt;/td&gt;
      &lt;td class=&quot;p-val&quot; style=&quot;min-height:28px;vertical-align:top;&quot;&gt;${r.play_theme||&#x27;&#x27;}&lt;/td&gt;
      &lt;td class=&quot;p-lbl lbl-safety&quot;&gt;🛡️ 안전 교육 및&lt;br&gt;생활 속 안전지도&lt;/td&gt;
      &lt;td style=&quot;padding:3px 7px;vertical-align:top;&quot;&gt;&lt;div class=&quot;p-val&quot;&gt;${r.safety||&#x27;&#x27;}&lt;/div&gt;
        ${(r.ytLinksSafety&amp;&amp;r.ytLinksSafety.length)?`&lt;div class=&quot;p-yt-list&quot;&gt;${r.ytLinksSafety.map(v=&gt;`&lt;div class=&quot;p-yt-item&quot;&gt;🛡️ ${escHtml(v.title||&#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}

    &lt;/tr&gt;
    &lt;tr&gt;&lt;td class=&quot;p-lbl lbl-ourplay&quot;&gt;🧩 우리들의 놀이&lt;/td&gt;&lt;td colspan=&quot;3&quot; style=&quot;padding:3px 7px;min-height:28px;vertical-align:top;&quot;&gt;
      ${formatOurPlay(r.our_play||&#x27;&#x27;)}
      ${(r.ytLinks&amp;&amp;r.ytLinks.length)?`&lt;div class=&quot;p-yt-list&quot;&gt;${r.ytLinks.map(v=&gt;`&lt;div class=&quot;p-yt-item&quot;&gt;🎬 ${escHtml(v.title||&#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}

/* ── 오늘 일지를 A4 한 페이지에 자동으로 맞춰서 인쇄 ── */
let printMode=&#x27;daily&#x27;;
function printToday(){
  printMode=&#x27;daily&#x27;;
  const el0=document.getElementById(&#x27;printLayout&#x27;);
  if(el0){ el0.className=&#x27;&#x27;; el0.style.transform=&#x27;&#x27;; el0.style.width=&#x27;&#x27;; }
  buildPrint();
  fitPrintToOnePage();
  // 브라우저가 zoom을 반영할 시간을 약간 주고 인쇄
  setTimeout(function(){ window.print(); }, 30);
}

function fitPrintToOnePage(){
  const el=document.getElementById(&#x27;printLayout&#x27;);
  if(!el) return;
  // 이전에 적용된 zoom 초기화
  el.style.zoom=&#x27;&#x27;;
  el.style.transform=&#x27;&#x27;;
  // 화면 밖에서 임시로 렌더링하여 실제 높이 측정 (A4 본문 폭 190mm에 맞춤)
  const origCss=el.getAttribute(&#x27;style&#x27;)||&#x27;&#x27;;
  el.setAttribute(&#x27;style&#x27;,&#x27;display:block;position:fixed;left:-9999px;top:0;width:190mm;visibility:hidden;z-index:-1;&#x27;);
  // 강제 reflow
  void el.offsetHeight;
  const h=el.scrollHeight;
  // 원래 스타일 복원
  el.setAttribute(&#x27;style&#x27;,origCss);
  // A4 한 페이지 가용 높이 (margin 9mm 기준, 보수적): 1020px 정도
  const maxH=1020;
  if(h&gt;maxH){
    let z=maxH/h;
    if(z&lt;0.55) z=0.55; // 너무 작아져 가독성 잃지 않도록 최소 55%
    el.style.zoom=z.toFixed(3);
  }
}

/* 각 페이지를 A4 한 장에 맞게 자동 축소 (zoom 사용 - 인쇄에서도 확실히 동작) */
function fitPages(){
  // A4 세로 297mm = 약 1122px @ 96dpi
  // Chrome 인쇄 기본 여백 + CSS @page margin 고려한 보수적 한계: 950px
  var maxH = 950;
  document.querySelectorAll(&#x27;.p-page&#x27;).forEach(function(p){
    // 이전 변환 모두 초기화 후 측정
    p.style.zoom = &#x27;&#x27;;
    p.style.transform = &#x27;&#x27;;
    p.style.transformOrigin = &#x27;&#x27;;
    p.style.width = &#x27;&#x27;;
    p.style.height = &#x27;&#x27;;
    var h = p.scrollHeight;
    if(h &gt; maxH){
      var z = (maxH / h);
      // 너무 작아지지 않도록 최소 0.5
      if(z &lt; 0.5) z = 0.5;
      p.style.zoom = z.toFixed(3);
    }
  });
}

  setTimeout(fitPages, 50);

function getRecordedDates(){
  return Object.keys(db.records||{})
    .filter(d=&gt;{const r=db.records[d];return r&amp;&amp;(r.play_theme||r.our_play||r.safety||r.support||(r.observations&amp;&amp;Object.keys(r.observations).length));})
    .sort();
}

function renderBpDateList(){
  const dates=getRecordedDates();
  const el=document.getElementById(&#x27;bp-date-list&#x27;);
  if(!dates.length){el.innerHTML=&#x27;&lt;div style=&quot;padding:12px;text-align:center;color:#bbb;font-size:12px;&quot;&gt;저장된 기록이 없습니다.&lt;/div&gt;&#x27;;return;}
  el.innerHTML=dates.slice().reverse().map(date=&gt;{
    const d=new Date(date);
    const dow=[&#x27;일&#x27;,&#x27;월&#x27;,&#x27;화&#x27;,&#x27;수&#x27;,&#x27;목&#x27;,&#x27;금&#x27;,&#x27;토&#x27;][d.getDay()];
    const sel=bpSelectedDates.has(date);
    return `&lt;div onclick=&quot;toggleBpDate(&#x27;${date}&#x27;)&quot; style=&quot;display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;background:${sel?&#x27;#fff8f0&#x27;:&#x27;#fff&#x27;};&quot;&gt;
      &lt;div style=&quot;width:18px;height:18px;border-radius:4px;border:2px solid ${sel?&#x27;var(--brown)&#x27;:&#x27;var(--border)&#x27;};background:${sel?&#x27;var(--brown)&#x27;:&#x27;#fff&#x27;};display:flex;align-items:center;justify-content:center;flex-shrink:0;&quot;&gt;
        ${sel?&#x27;&lt;span style=&quot;color:#fff;font-size:11px;font-weight:bold;&quot;&gt;✓&lt;/span&gt;&#x27;:&#x27;&#x27;}
      &lt;/div&gt;
      &lt;span style=&quot;font-size:13px;color:var(--text);&quot;&gt;${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${dow})&lt;/span&gt;
    &lt;/div&gt;`;
  }).join(&#x27;&#x27;);
}

function toggleBpDate(date){
  if(bpSelectedDates.has(date)) bpSelectedDates.delete(date);
  else bpSelectedDates.add(date);
  renderBpDateList();
  updateBpInfo();
}

function renderBpMonthList(){
  const dates=getRecordedDates();
  const months=[...new Set(dates.map(d=&gt;d.slice(0,7)))].sort().reverse();
  const el=document.getElementById(&#x27;bp-month-list&#x27;);
  el.innerHTML=months.map(m=&gt;{
    const [yr,mo]=[m.slice(0,4),parseInt(m.slice(5))];
    const sel=bpSelectedMonth===m;
    return `&lt;button onclick=&quot;selectBpMonth(&#x27;${m}&#x27;)&quot; style=&quot;padding:7px 14px;border-radius:16px;font-size:12.5px;font-weight:600;cursor:pointer;border:1.5px solid ${sel?&#x27;var(--brown)&#x27;:&#x27;var(--border)&#x27;};background:${sel?&#x27;var(--brown)&#x27;:&#x27;#fff&#x27;};color:${sel?&#x27;#fff&#x27;:&#x27;var(--text)&#x27;};font-family:&#x27;Noto Sans KR&#x27;,sans-serif;&quot;&gt;${yr}년 ${mo}월&lt;/button&gt;`;
  }).join(&#x27;&#x27;);
  if(!bpSelectedMonth&amp;&amp;months.length) selectBpMonth(months[0]);
}

function selectBpMonth(month){
  bpSelectedMonth=month;
  renderBpMonthList();
  updateBpInfo();
}

function renderBpAllInfo(){
  const dates=getRecordedDates();
  const el=document.getElementById(&#x27;bp-all-count&#x27;);
  if(el) el.textContent=`총 ${dates.length}일치 기록`;
}

function updateBpInfo(){
  const el=document.getElementById(&#x27;bp-selected-info&#x27;);
  if(bpTab===&#x27;date&#x27;){
    const n=bpSelectedDates.size;
    el.textContent=n&gt;0?`✓ ${n}일 선택됨`:&#x27;날짜를 선택해주세요&#x27;;
  } else if(bpTab===&#x27;month&#x27;){
    if(bpSelectedMonth){
      const [yr,mo]=[bpSelectedMonth.slice(0,4),parseInt(bpSelectedMonth.slice(5))];
      const cnt=getRecordedDates().filter(d=&gt;d.startsWith(bpSelectedMonth)).length;
      el.textContent=`✓ ${yr}년 ${mo}월 · ${cnt}일치`;
    } else el.textContent=&#x27;월을 선택해주세요&#x27;;
  } else {
    el.textContent=`✓ 전체 ${getRecordedDates().length}일치`;
  }
}

function doBatchPrint(){
  flushAll();
  let dates=[];
  if(bpTab===&#x27;date&#x27;) dates=[...bpSelectedDates].sort();
  else if(bpTab===&#x27;month&#x27;) dates=getRecordedDates().filter(d=&gt;d.startsWith(bpSelectedMonth));
  else dates=getRecordedDates();

  if(!dates.length){showToast(&#x27;인쇄할 기록이 없습니다.&#x27;);return;}
  document.getElementById(&#x27;batchPrintModal&#x27;).classList.remove(&#x27;open&#x27;);

  let title=&#x27;유아평가 일지&#x27;;
  if(bpTab===&#x27;month&#x27;&amp;&amp;bpSelectedMonth){
    const [yr,mo]=[bpSelectedMonth.slice(0,4),parseInt(bpSelectedMonth.slice(5))];
    title=`유아평가 ${yr}년 ${mo}월`;
  } else if(bpTab===&#x27;all&#x27;) title=&#x27;유아평가 전체 일지&#x27;;
  else if(dates.length===1) title=`유아평가 ${dates[0]}`;

  openDocWindow(dates,title);
}

   keywords:[&#x27;그리기&#x27;,&#x27;만들기&#x27;,&#x27;노래&#x27;,&#x27;음악&#x27;,&#x27;춤&#x27;,&#x27;색&#x27;,&#x27;표현&#x27;,&#x27;창의&#x27;,&#x27;미술&#x27;,&#x27;꾸미기&#x27;]},

let rpChild=null;
let rpGenerating=false; // 중복 클릭으로 API가 여러 번 호출되는 것을 막는 안전장치
let rpPeriod=&#x27;1h&#x27;; // &#x27;1h&#x27;,&#x27;2h&#x27;,&#x27;all&#x27;,&#x27;month&#x27;
let rpMonth=&#x27;&#x27;;
let rpReportType=&#x27;monthly&#x27;;
let rpModel=&#x27;claude-sonnet-4-6&#x27;; // 보고서 생성 모델: 기본은 정밀(Sonnet), 절약 모드 선택 시 Haiku

function initReport(){
  if(!document.getElementById(&#x27;panel-report&#x27;).classList.contains(&#x27;active&#x27;))return;
  renderRpChildChips();
  populateRpMonthSel();
  renderRpGuideFiles();
  if(rpChild) renderReportContent();
}

function renderRpChildChips(){
  const el=document.getElementById(&#x27;rpChildChips&#x27;);
  el.innerHTML=db.children.map(name=&gt;{
    const hasData=Object.values(db.records||{}).some(r=&gt;r.observations&amp;&amp;r.observations[name]);
    const isActive=name===rpChild;
    return `&lt;span class=&quot;rp-child-chip ${isActive?&#x27;active&#x27;:&#x27;&#x27;} ${hasData?&#x27;has-data&#x27;:&#x27;&#x27;}&quot; 
      onclick=&quot;selectRpChild(&#x27;${escQ(name)}&#x27;)&quot;&gt;${name}&lt;/span&gt;`;
  }).join(&#x27;&#x27;);
}

function selectRpChild(name){
  rpChild=name;
  renderRpChildChips();
  renderReportContent();
}

function populateRpMonthSel(){
  const sel=document.getElementById(&#x27;rpMonthSel&#x27;);
  const months=[...new Set(Object.keys(db.records||{}).map(d=&gt;d.slice(0,7)))].sort().reverse();
  sel.innerHTML=&#x27;&lt;option value=&quot;&quot;&gt;월별 선택&lt;/option&gt;&#x27;+
    months.map(m=&gt;{const d=new Date(m+&#x27;-01&#x27;);return`&lt;option value=&quot;${m}&quot;&gt;${d.getFullYear()}년 ${d.getMonth()+1}월&lt;/option&gt;`;}).join(&#x27;&#x27;);
  if(rpMonth) sel.value=rpMonth;
}

function setRpPeriod(period,btn,month){
  rpPeriod=period;
  rpMonth=month||&#x27;&#x27;;
  if(btn){
    document.querySelectorAll(&#x27;.rp-period-btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
    btn.classList.add(&#x27;active&#x27;);
    document.getElementById(&#x27;rpMonthSel&#x27;).value=&#x27;&#x27;;
  }
  if(period===&#x27;month&#x27;&amp;&amp;month){
    document.querySelectorAll(&#x27;.rp-period-btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
  }
  if(rpChild) renderReportContent();
}

function setReportType(type,btn){
  rpReportType=type;
  document.querySelectorAll(&#x27;.rp-type-btn:not(.rp-model-btn)&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
  btn.classList.add(&#x27;active&#x27;);
}

function setRpModel(model,btn){
  rpModel=model;
  document.getElementById(&#x27;rpmBtn-sonnet&#x27;).classList.remove(&#x27;active&#x27;);
  document.getElementById(&#x27;rpmBtn-haiku&#x27;).classList.remove(&#x27;active&#x27;);
  btn.classList.add(&#x27;active&#x27;);
}

function getRpDates(){
  const allDates=Object.keys(db.records||{}).filter(d=&gt;db.records[d].observations&amp;&amp;db.records[d].observations[rpChild]);
  if(rpPeriod===&#x27;1h&#x27;) return allDates.filter(d=&gt;{ const m=parseInt(d.slice(5,7)); return m&gt;=3&amp;&amp;m&lt;=8; });
  if(rpPeriod===&#x27;2h&#x27;) return allDates.filter(d=&gt;{ const m=parseInt(d.slice(5,7)); return m&gt;=9||m&lt;=2; });
  if(rpPeriod===&#x27;month&#x27;&amp;&amp;rpMonth) return allDates.filter(d=&gt;d.startsWith(rpMonth));
  return allDates; // all
}

function analyzeNuri(text){
  const results={};
  const lower=text.toLowerCase();
  NURI_AREAS.forEach(a=&gt;{
    const found=a.keywords.filter(kw=&gt;lower.includes(kw));
    if(found.length&gt;0) results[a.key]={count:found.length, words:found};
  });
  return results;
}

function renderReportContent(){
  if(!rpChild){
    document.getElementById(&#x27;rpSummary&#x27;).innerHTML=&#x27;&#x27;;
    document.getElementById(&#x27;rpNuri&#x27;).innerHTML=&#x27;&#x27;;
    document.getElementById(&#x27;rpTimeline&#x27;).innerHTML=&#x27;&#x27;;
    document.getElementById(&#x27;rpAiSection&#x27;).style.display=&#x27;none&#x27;;
    document.getElementById(&#x27;rpSavedReports&#x27;).innerHTML=&#x27;&#x27;;
    return;
  }
  const dates=getRpDates().sort();
  const periodLabel=rpPeriod===&#x27;1h&#x27;?&#x27;1학기(3~8월)&#x27;:rpPeriod===&#x27;2h&#x27;?&#x27;2학기(9~2월)&#x27;:
    rpPeriod===&#x27;month&#x27;&amp;&amp;rpMonth?(()=&gt;{const d=new Date(rpMonth+&#x27;-01&#x27;);return`${d.getFullYear()}년 ${d.getMonth()+1}월`;})():&#x27;전체 기간&#x27;;

  // ── 요약 ──
  const totalObs=dates.length;
  const totalChars=dates.reduce((s,d)=&gt;s+(db.records[d].observations[rpChild]||&#x27;&#x27;).length,0);
  const allText=dates.map(d=&gt;db.records[d].observations[rpChild]||&#x27;&#x27;).join(&#x27; &#x27;);
  const nuriAll=analyzeNuri(allText);
  const topArea=Object.entries(nuriAll).sort((a,b)=&gt;b[1].count-a[1].count)[0];

  document.getElementById(&#x27;rpSummary&#x27;).innerHTML=`
    &lt;div style=&quot;font-size:12px;color:var(--brown);font-weight:600;margin-bottom:6px;&quot;&gt;📋 ${rpChild} · ${periodLabel}&lt;/div&gt;
    &lt;div class=&quot;rp-summary-grid&quot;&gt;
      &lt;div class=&quot;rp-sum-card&quot;&gt;&lt;div class=&quot;rp-sum-num&quot;&gt;${totalObs}&lt;/div&gt;&lt;div class=&quot;rp-sum-lbl&quot;&gt;관찰 기록 수&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;rp-sum-card&quot;&gt;&lt;div class=&quot;rp-sum-num&quot;&gt;${totalChars}&lt;/div&gt;&lt;div class=&quot;rp-sum-lbl&quot;&gt;총 기록 글자&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;rp-sum-card&quot;&gt;&lt;div class=&quot;rp-sum-num&quot;&gt;${topArea?topArea[0].slice(0,2):&#x27;—&#x27;}&lt;/div&gt;&lt;div class=&quot;rp-sum-lbl&quot;&gt;주요 발달영역&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;`;

  // ── 누리과정 영역 분석 ──
  const maxCount=Math.max(...NURI_AREAS.map(a=&gt;nuriAll[a.key]?.count||0),1);
  const nuriHtml=NURI_AREAS.map(a=&gt;{
    const info=nuriAll[a.key];
    const cnt=info?.count||0;
    const pct=Math.round(cnt/maxCount*100);
    const kwHtml=(info?.words||[]).map(w=&gt;`&lt;span class=&quot;rp-kw-tag&quot;&gt;${w}&lt;/span&gt;`).join(&#x27;&#x27;);
    return`&lt;div class=&quot;rp-nuri-item&quot;&gt;
      &lt;div class=&quot;rp-nuri-header&quot;&gt;
        &lt;span class=&quot;rp-nuri-name&quot;&gt;${a.icon} ${a.key}&lt;/span&gt;
        &lt;span class=&quot;rp-nuri-count&quot;&gt;${cnt}회 언급&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rp-nuri-bar&quot;&gt;&lt;div class=&quot;rp-nuri-fill ${a.color}&quot; style=&quot;width:${pct}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      ${kwHtml?`&lt;div class=&quot;rp-nuri-keywords&quot;&gt;${kwHtml}&lt;/div&gt;`:&#x27;&#x27;}
    &lt;/div&gt;`;
  }).join(&#x27;&#x27;);

  document.getElementById(&#x27;rpNuri&#x27;).innerHTML=`
    &lt;div class=&quot;rp-section-title&quot;&gt;🌱 누리과정 영역 분포&lt;/div&gt;
    ${totalObs&gt;0?nuriHtml:&#x27;&lt;div class=&quot;rp-empty&quot;&gt;관찰 기록이 없습니다.&lt;/div&gt;&#x27;}`;

  // ── 월별 타임라인 ──
  const byMonth={};
  dates.forEach(d=&gt;{
    const mk=d.slice(0,7);
    if(!byMonth[mk]) byMonth[mk]=[];
    byMonth[mk].push(d);
  });
  const tlHtml=Object.entries(byMonth).sort().map(([mk,ds])=&gt;{
    const dt=new Date(mk+&#x27;-01&#x27;);
    const items=ds.map(d=&gt;{
      const txt=db.records[d].observations[rpChild]||&#x27;&#x27;;
      const nuri=analyzeNuri(txt);
      const areas=Object.keys(nuri).map(k=&gt;{
        const a=NURI_AREAS.find(x=&gt;x.key===k);
        return a?`&lt;span class=&quot;rp-area-badge&quot; style=&quot;${a.badge.replace(/,/g,&#x27;;&#x27;)};padding:1px 6px;border-radius:8px;font-size:9.5px;font-weight:600;&quot;&gt;${a.icon}${a.key.slice(0,2)}&lt;/span&gt;`:&#x27;&#x27;;
      }).join(&#x27;&#x27;);
      return`&lt;div class=&quot;rp-tl-item&quot;&gt;
        &lt;div class=&quot;rp-tl-date&quot;&gt;${d.slice(5).replace(&#x27;-&#x27;,&#x27;/&#x27;)} (${[&#x27;일&#x27;,&#x27;월&#x27;,&#x27;화&#x27;,&#x27;수&#x27;,&#x27;목&#x27;,&#x27;금&#x27;,&#x27;토&#x27;][new Date(d).getDay()]})&lt;/div&gt;
        ${areas?`&lt;div class=&quot;rp-tl-areas&quot;&gt;${areas}&lt;/div&gt;`:&#x27;&#x27;}
        &lt;div class=&quot;rp-tl-text&quot;&gt;${escHtml(txt.slice(0,120))}${txt.length&gt;120?&#x27;…&#x27;:&#x27;&#x27;}&lt;/div&gt;
      &lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    return`&lt;div style=&quot;margin-bottom:10px;&quot;&gt;
      &lt;div style=&quot;font-size:12px;font-weight:700;color:var(--brown);padding:5px 0;border-bottom:2px solid var(--tan);&quot;&gt;${dt.getFullYear()}년 ${dt.getMonth()+1}월 (${ds.length}건)&lt;/div&gt;
      ${items}
    &lt;/div&gt;`;
  }).join(&#x27;&#x27;);

  document.getElementById(&#x27;rpTimeline&#x27;).innerHTML=`
    &lt;div class=&quot;rp-section-title&quot;&gt;📅 관찰 타임라인&lt;/div&gt;
    ${tlHtml||&#x27;&lt;div class=&quot;rp-empty&quot;&gt;해당 기간 관찰 기록이 없습니다.&lt;/div&gt;&#x27;}`;

  // AI 섹션 표시
  document.getElementById(&#x27;rpAiSection&#x27;).style.display=totalObs&gt;0?&#x27;block&#x27;:&#x27;none&#x27;;
  document.getElementById(&#x27;rpResult&#x27;).style.display=&#x27;none&#x27;;

  // 저장된 보고서
  renderSavedReports();
}

async function generateReport(){
  if(rpGenerating){ showToast(&#x27;⏳ 이미 보고서를 생성하고 있어요. 잠시만 기다려주세요.&#x27;); return; }
  rpGenerating=true;
  try{
    return await generateReportInner();
  } finally {
    rpGenerating=false;
  }
}

async function generateReportInner(){
  if(rpReportType===&#x27;semester&#x27;){ return generateSemesterTable(); }
  if(!rpChild){showToast(&#x27;아이를 먼저 선택하세요.&#x27;);return;}
  const existingTa=document.getElementById(&#x27;rpResultTa&#x27;);
  if(existingTa &amp;&amp; existingTa.value.trim()){
    const ok=confirm(&#x27;이미 생성된 보고서가 있어요. 다시 생성하면 API 비용이 또 발생해요.\n조금만 고칠 거라면 취소하고 아래에서 직접 수정해주세요.\n\n그래도 새로 생성할까요?&#x27;);
    if(!ok) return;
  }
  const key=getApiKey();
  if(!key){showToast(&#x27;💾 더보기 탭에서 API 키를 먼저 설정하세요.&#x27;);return;}

  const dates=getRpDates().sort();
  if(!dates.length){showToast(&#x27;해당 기간 관찰 기록이 없습니다.&#x27;);return;}

  const icon=document.getElementById(&#x27;rpGenIcon&#x27;);
  const btn=document.getElementById(&#x27;rpGenBtn&#x27;);
  icon.innerHTML=&#x27;&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt;&#x27;;
  btn.disabled=true;
  document.getElementById(&#x27;rpTablePreview&#x27;).innerHTML=&#x27;&#x27;;
  const saveBtnEl=document.getElementById(&#x27;rpSaveBtn&#x27;);
  if(saveBtnEl) saveBtnEl.style.display=&#x27;&#x27;;

  // 관찰 기록 수집
  const obsData=dates.map(d=&gt;`[${d}] ${db.records[d].observations[rpChild]||&#x27;&#x27;}`).join(&#x27;\n&#x27;);
  const guideText=(db.reportGuideFiles||[]).map(f=&gt;f.text).join(&#x27;\n\n&#x27;).slice(0,4000);
  const periodLabel=rpPeriod===&#x27;1h&#x27;?&#x27;1학기(3~8월)&#x27;:rpPeriod===&#x27;2h&#x27;?&#x27;2학기(9~2월)&#x27;:
    rpPeriod===&#x27;month&#x27;&amp;&amp;rpMonth?(()=&gt;{const d=new Date(rpMonth+&#x27;-01&#x27;);return`${d.getFullYear()}년 ${d.getMonth()+1}월`;})():&#x27;전체 기간&#x27;;

  const typePrompts={
    monthly:`월별 관찰 보고서를 작성해주세요. 각 달의 주요 발달 변화를 누리과정 5개 영역과 연계하여 서술하세요.`,
    semester:`학기 종합 발달 평가 보고서를 작성해주세요. 학기 전반에 걸친 발달 과정과 성장을 누리과정 5개 영역별로 종합하여 서술하세요.`,
    record:`초등학교 입학을 위한 생활기록부 행동발달 및 특이사항을 누리과정 5개 영역별로 나누어 작성해주세요. 반드시 아래 형식을 지키세요:\n🏃 신체운동·건강: (1~2문장)\n💬 의사소통: (1~2문장)\n🤝 사회관계: (1~2문장)\n🎨 예술경험: (1~2문장)\n🔍 자연탐구: (1~2문장)\n관찰 기록상 근거가 부족한 영역은 일반적이고 무난한 문장으로 작성하세요. 공식적이고 간결한 문체를 사용하세요.`
  };

  try{
    const res=await fetch(&#x27;https://n8n.auto-navajin.com/webhook/eval-ai&#x27;,{
      method:&#x27;POST&#x27;,
      headers:{
        &#x27;Content-Type&#x27;:&#x27;application/json&#x27;
      },
      body:JSON.stringify({
        model:rpModel,
        max_tokens:1700,
        system:`당신은 누리과정 전문 유아교육 평가 보고서 작성 전문가입니다.
교사의 관찰 기록을 분석하여 누리과정 5개 영역(신체운동·건강, 의사소통, 사회관계, 예술경험, 자연탐구)과 연계된 전문적인 발달 평가 보고서를 작성합니다.

규칙:
1. 관찰 기록에 실제로 나타난 내용만 근거로 사용하세요.
2. 아이의 강점과 긍정적 성장을 중심으로 서술하세요.
3. 유아교육 전문 용어와 누리과정 용어를 적절히 사용하세요.
4. 구체적인 행동 사례를 포함하세요.
5. 설명·코멘트 없이 보고서 본문만 출력하세요.`+(guideText?`\n\n[참고자료 - 아래 문체와 형식을 최대한 참고하여 작성하세요]\n${guideText}`:&#x27;&#x27;),
        messages:[{role:&#x27;user&#x27;,content:`유아 이름: ${rpChild}
대상 기간: ${periodLabel}
보고서 유형: ${rpReportType}
요청사항: ${typePrompts[rpReportType]}

관찰 기록:
${obsData}`}]
      })
    });
    if(!res.ok){
      if(res.status===401)showToast(&#x27;❌ API 키 오류&#x27;);
      else showToast(`오류 (${res.status})`);
      icon.textContent=&#x27;✨&#x27;;btn.disabled=false;return;
    }
    const data=await res.json();
    trackTokens(data);
    const text=(data.content||[]).filter(b=&gt;b.type===&#x27;text&#x27;).map(b=&gt;b.text).join(&#x27;&#x27;).trim();
    if(text){
      document.getElementById(&#x27;rpResultTa&#x27;).value=text;
      document.getElementById(&#x27;rpResult&#x27;).style.display=&#x27;block&#x27;;
      showToast(&#x27;✨ 보고서 생성 완료!&#x27;);
    }
  }catch(e){
    showToast(&#x27;네트워크 오류: 인터넷 연결을 확인하세요.&#x27;);
  }
  icon.textContent=&#x27;✨&#x27;;btn.disabled=false;
}

function copyReport(){
  const ta=document.getElementById(&#x27;rpResultTa&#x27;);
  ta.select();
  document.execCommand(&#x27;copy&#x27;);
  showToast(&#x27;보고서가 클립보드에 복사됐습니다 📋&#x27;);
}

function saveReportToChild(){
  if(!rpChild)return;
  const text=document.getElementById(&#x27;rpResultTa&#x27;).value.trim();
  if(!text){showToast(&#x27;저장할 내용이 없습니다.&#x27;);return;}

  const periodLabel=rpPeriod===&#x27;1h&#x27;?&#x27;1학기&#x27;:rpPeriod===&#x27;2h&#x27;?&#x27;2학기&#x27;:
    rpPeriod===&#x27;month&#x27;&amp;&amp;rpMonth?(()=&gt;{const d=new Date(rpMonth+&#x27;-01&#x27;);return`${d.getMonth()+1}월`;})():&#x27;전체&#x27;;
  db.reports[rpChild].push({
    id:Date.now(),

function printReport(){
  const typeLabel={monthly:&#x27;월별 보고서&#x27;,semester:&#x27;학기 종합 보고서&#x27;,record:&#x27;생활기록부용 보고서&#x27;}[rpReportType]||&#x27;보고서&#x27;;

    rpPeriod===&#x27;month&#x27;&amp;&amp;rpMonth?(()=&gt;{const d=new Date(rpMonth+&#x27;-01&#x27;);return`${d.getFullYear()}년 ${d.getMonth()+1}월`;})():&#x27;전체 기간&#x27;;

  let bodyHtml;
  if(rpReportType===&#x27;semester&#x27;){

        ${srcTable.innerHTML}
      &lt;/table&gt;`;
  } else {
    const text=(document.getElementById(&#x27;rpResultTa&#x27;).value||&#x27;&#x27;).trim();
    if(!text){ showToast(&#x27;먼저 보고서를 생성하세요.&#x27;); return; }
    const childLabel=rpChild||&#x27;&#x27;;
    bodyHtml=`&lt;div class=&quot;p-title&quot;&gt;📄 ${escHtml(typeLabel)} · ${escHtml(childLabel)} · ${escHtml(periodLabel)}&lt;/div&gt;

  }

  el.style.width=&#x27;&#x27;;

function deleteReport(child,id){

  showToast(&#x27;삭제됐습니다.&#x27;);
}

      &lt;div class=&quot;cp-nuri-head&quot;&gt;
        &lt;span class=&quot;cp-nuri-name&quot;&gt;${a.icon} ${a.key}&lt;/span&gt;
        &lt;span class=&quot;cp-nuri-cnt&quot;&gt;${cnt}회&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;cp-nuri-bar&quot;&gt;
        &lt;div class=&quot;cp-nuri-fill nuri-${a.key.slice(0,2)}&quot; style=&quot;width:${pct}%;background:${cnt&gt;0?&#x27;var(--brown)&#x27;:&#x27;#ddd&#x27;}&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  }).join(&#x27;&#x27;);

  // 색상별 바
  const nuriColors={&#x27;신체운동·건강&#x27;:&#x27;#4a7c59&#x27;,&#x27;의사소통&#x27;:&#x27;#3a5a8c&#x27;,&#x27;사회관계&#x27;:&#x27;#c0622a&#x27;,&#x27;예술경험&#x27;:&#x27;#7a3a8c&#x27;,&#x27;자연탐구&#x27;:&#x27;#6a8c3a&#x27;};
  const nuriHtmlColored=NURI_AREAS_DEF.map(a=&gt;{
    const cnt=areaCounts[a.key]||0;
    const pct=Math.round(cnt/maxCnt*100);
    const col=nuriColors[a.key]||&#x27;#8b6f4e&#x27;;
    return`&lt;div class=&quot;cp-nuri-row&quot;&gt;
      &lt;div class=&quot;cp-nuri-head&quot;&gt;
        &lt;span class=&quot;cp-nuri-name&quot;&gt;${a.icon} ${a.key}&lt;/span&gt;
        &lt;span class=&quot;cp-nuri-cnt&quot;&gt;${cnt}회&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;cp-nuri-bar&quot;&gt;
        &lt;div class=&quot;cp-nuri-fill&quot; style=&quot;width:${pct}%;background:${col};&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  }).join(&#x27;&#x27;);

  // 최근 기록 (최대 10개)
  const recentHtml=allDates.slice(0,10).map(d=&gt;{
    const txt=db.records[d].observations[name]||&#x27;&#x27;;
    const areas=detectNuriAreas(txt);
    const dow=[&#x27;일&#x27;,&#x27;월&#x27;,&#x27;화&#x27;,&#x27;수&#x27;,&#x27;목&#x27;,&#x27;금&#x27;,&#x27;토&#x27;][new Date(d).getDay()];
    const areaBadges=areas.map(a=&gt;
      `&lt;span style=&quot;font-size:9.5px;padding:1px 6px;border-radius:8px;font-weight:600;${a.style}&quot;&gt;${a.icon}${a.key.slice(0,2)}&lt;/span&gt;`
    ).join(&#x27;&#x27;);
    return`&lt;div class=&quot;cp-rec-item&quot;&gt;
      &lt;div class=&quot;cp-rec-date&quot;&gt;${d.slice(5).replace(&#x27;-&#x27;,&#x27;/&#x27;)} (${dow})&lt;/div&gt;
      ${areaBadges?`&lt;div class=&quot;cp-rec-areas&quot;&gt;${areaBadges}&lt;/div&gt;`:&#x27;&#x27;}
      &lt;div class=&quot;cp-rec-text&quot;&gt;${escHtml(txt)}&lt;/div&gt;
    &lt;/div&gt;`;
  }).join(&#x27;&#x27;);

  body.innerHTML=`
    &lt;div class=&quot;cp-stats-grid&quot;&gt;
      &lt;div class=&quot;cp-stat&quot;&gt;&lt;div class=&quot;cp-stat-num&quot;&gt;${allDates.length}&lt;/div&gt;&lt;div class=&quot;cp-stat-lbl&quot;&gt;관찰 횟수&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;cp-stat&quot;&gt;&lt;div class=&quot;cp-stat-num&quot;&gt;${totalChars}&lt;/div&gt;&lt;div class=&quot;cp-stat-lbl&quot;&gt;총 기록량&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;cp-stat&quot;&gt;&lt;div class=&quot;cp-stat-num&quot;&gt;${NURI_AREAS_DEF.filter(a=&gt;areaCounts[a.key]&gt;0).length}/5&lt;/div&gt;&lt;div class=&quot;cp-stat-lbl&quot;&gt;영역 커버&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div style=&quot;font-size:11px;color:#aaa;margin-bottom:10px;&quot;&gt;
      첫 기록: ${firstDate.slice(5).replace(&#x27;-&#x27;,&#x27;/&#x27;)} ~ 최근: ${lastDate.slice(5).replace(&#x27;-&#x27;,&#x27;/&#x27;)}
    &lt;/div&gt;
    &lt;div class=&quot;cp-nuri-section&quot;&gt;
      &lt;div class=&quot;cp-nuri-title&quot;&gt;🌱 누리과정 영역 발달 분포&lt;/div&gt;
      ${nuriHtmlColored}
    &lt;/div&gt;
    &lt;div style=&quot;font-size:12.5px;font-weight:700;color:var(--dark);margin-bottom:8px;&quot;&gt;📋 관찰 기록 (최근 ${Math.min(allDates.length,10)}건)&lt;/div&gt;
    ${recentHtml}
    ${allDates.length&gt;10?`&lt;div style=&quot;font-size:12px;color:#aaa;text-align:center;padding:8px 0;&quot;&gt;+ ${allDates.length-10}건 더 있음&lt;/div&gt;`:&#x27;&#x27;}
    &lt;!-- AI 보고서 생성 --&gt;
    &lt;div style=&quot;background:linear-gradient(135deg,#f0f7ff,#f8f0ff);border:1.5px solid #90caf9;border-radius:12px;padding:14px;margin-top:14px;&quot;&gt;
      &lt;div style=&quot;font-size:13px;font-weight:700;color:#1a3a6c;margin-bottom:8px;&quot;&gt;✨ AI 발달 보고서 생성&lt;/div&gt;
      &lt;div class=&quot;cp-report-type-row&quot;&gt;
        &lt;button class=&quot;cp-rtype ${cpReportType===&#x27;semester&#x27;?&#x27;active&#x27;:&#x27;&#x27;}&quot; onclick=&quot;setCpType(&#x27;semester&#x27;,this)&quot;&gt;학기 종합&lt;/button&gt;
        &lt;button class=&quot;cp-rtype ${cpReportType===&#x27;monthly&#x27;?&#x27;active&#x27;:&#x27;&#x27;}&quot; onclick=&quot;setCpType(&#x27;monthly&#x27;,this)&quot;&gt;월별 분석&lt;/button&gt;
        &lt;button class=&quot;cp-rtype ${cpReportType===&#x27;record&#x27;?&#x27;active&#x27;:&#x27;&#x27;}&quot; onclick=&quot;setCpType(&#x27;record&#x27;,this)&quot;&gt;생활기록부용&lt;/button&gt;
      &lt;/div&gt;
      &lt;button class=&quot;cp-report-btn&quot; id=&quot;cpGenBtn&quot; onclick=&quot;generateCpReport(&#x27;${escQ(name)}&#x27;)&quot;&gt;
        &lt;span id=&quot;cpGenIcon&quot;&gt;✨&lt;/span&gt; 보고서 생성
      &lt;/button&gt;
      &lt;div id=&quot;cpGenResult&quot; style=&quot;display:none;&quot;&gt;
        &lt;textarea class=&quot;cp-gen-result&quot; id=&quot;cpGenTa&quot;&gt;&lt;/textarea&gt;
        &lt;div class=&quot;cp-action-row&quot;&gt;
          &lt;button class=&quot;cp-act-btn cp-act-copy&quot; onclick=&quot;copyCpReport()&quot;&gt;📋 복사&lt;/button&gt;
          &lt;button class=&quot;cp-act-btn cp-act-save&quot; onclick=&quot;saveCpReport(&#x27;${escQ(name)}&#x27;)&quot;&gt;💾 저장&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;!-- 저장된 보고서 --&gt;
    &lt;div id=&quot;cpSavedList&quot; style=&quot;margin-top:12px;&quot;&gt;&lt;/div&gt;
    ${renderCpSaved(name)}
  `;

  // cpSavedList를 innerHTML에 직접 넣으면 이중으로 들어가므로 아래에서 따로 렌더링
  setTimeout(()=&gt;{
    const sl=document.getElementById(&#x27;cpSavedList&#x27;);
    if(sl) sl.innerHTML=renderCpSaved(name);
  },0);
}

function setCpType(type,btn){
  cpReportType=type;
  document.querySelectorAll(&#x27;.cp-rtype&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
  btn.classList.add(&#x27;active&#x27;);
}

async function generateCpReport(name){
  const key=getApiKey();
  if(!key){showToast(&#x27;더보기 탭에서 API 키를 설정하세요.&#x27;);return;}
  const allDates=Object.keys(db.records||{})
    .filter(d=&gt;db.records[d].observations&amp;&amp;db.records[d].observations[name])
    .sort();
  if(!allDates.length){showToast(&#x27;관찰 기록이 없습니다.&#x27;);return;}

  const icon=document.getElementById(&#x27;cpGenIcon&#x27;);
  const btn=document.getElementById(&#x27;cpGenBtn&#x27;);
  icon.innerHTML=&#x27;&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt;&#x27;;
  btn.disabled=true;

  const obsData=allDates.map(d=&gt;`[${d}] ${db.records[d].observations[name]}`).join(&#x27;\n&#x27;);
  const typePrompts={
    monthly:&#x27;월별로 나누어 각 달의 주요 발달 변화를 누리과정 5개 영역과 연계하여 서술하세요.&#x27;,
    semester:&#x27;학기 전반의 발달 과정과 성장을 누리과정 5개 영역별로 종합하여 서술하세요.&#x27;,
    record:&#x27;초등학교 생활기록부 행동발달 및 특이사항 기재용 문장을 공식적·간결하게 3~5문장으로 작성하세요.&#x27;
  };
  try{
    const res=await fetch(&#x27;https://n8n.auto-navajin.com/webhook/eval-ai&#x27;,{
      method:&#x27;POST&#x27;,
      headers:{&#x27;Content-Type&#x27;:&#x27;application/json&#x27;},
      body:JSON.stringify({
        model:&#x27;claude-sonnet-4-6&#x27;,max_tokens:1000,
        system:`당신은 누리과정 전문 유아교육 평가 보고서 전문가입니다. 관찰 기록을 분석하여 누리과정 5개 영역과 연계된 전문적 발달 평가를 작성합니다. 아이의 강점과 긍정적 성장을 중심으로, 실제 관찰된 내용만 근거로 사용하세요. 보고서 본문만 출력하세요.`,
        messages:[{role:&#x27;user&#x27;,content:`유아: ${name}\n요청: ${typePrompts[cpReportType]}\n\n관찰기록:\n${obsData}`}]
      })
    });
    if(!res.ok){showToast(&#x27;오류: &#x27;+res.status);icon.textContent=&#x27;✨&#x27;;btn.disabled=false;return;}
    const data=await res.json();
    trackTokens(data);
    const text=(data.content||[]).filter(b=&gt;b.type===&#x27;text&#x27;).map(b=&gt;b.text).join(&#x27;&#x27;).trim();
    if(text){
      document.getElementById(&#x27;cpGenTa&#x27;).value=text;
      document.getElementById(&#x27;cpGenResult&#x27;).style.display=&#x27;block&#x27;;
      showToast(&#x27;✨ 보고서 생성 완료!&#x27;);
    }
  }catch(e){showToast(&#x27;네트워크 오류&#x27;);}
  icon.textContent=&#x27;✨&#x27;;btn.disabled=false;
}

function copyCpReport(){
  const ta=document.getElementById(&#x27;cpGenTa&#x27;);
  ta.select();document.execCommand(&#x27;copy&#x27;);
  showToast(&#x27;복사됐습니다 📋&#x27;);
}

function saveCpReport(name){
  const text=document.getElementById(&#x27;cpGenTa&#x27;).value.trim();
  if(!text)return;
  if(!db.reports) db.reports={};
  if(!db.reports[name]) db.reports[name]=[];
  const typeLabel={monthly:&#x27;월별&#x27;,semester:&#x27;학기종합&#x27;,record:&#x27;생활기록부&#x27;}[cpReportType]||&#x27;보고서&#x27;;
  db.reports[name].push({id:Date.now(),type:cpReportType,label:`${typeLabel} (${new Date().toLocaleDateString(&#x27;ko-KR&#x27;)})`,text,createdAt:new Date().toISOString()});
  saveData(true);
  const sl=document.getElementById(&#x27;cpSavedList&#x27;);
  if(sl) sl.innerHTML=renderCpSaved(name);
  showToast(`💾 ${name}의 보고서 저장 완료!`);
}

function renderCpSaved(name){
  if(!db.reports||!db.reports[name]||!db.reports[name].length) return &#x27;&#x27;;
  return `&lt;div style=&quot;font-size:12.5px;font-weight:700;color:var(--dark);margin-bottom:8px;&quot;&gt;📁 저장된 보고서&lt;/div&gt;`+
    db.reports[name].slice().reverse().map(rep=&gt;`
      &lt;div style=&quot;background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;&quot;&gt;
        &lt;div style=&quot;background:var(--beige);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;&quot;&gt;
          &lt;span style=&quot;font-size:12px;font-weight:700;&quot;&gt;${escHtml(rep.label)}&lt;/span&gt;
          &lt;button onclick=&quot;deleteCpReport(&#x27;${escQ(name)}&#x27;,${rep.id})&quot; style=&quot;background:none;border:none;color:#bbb;font-size:13px;cursor:pointer;&quot;&gt;✕&lt;/button&gt;
        &lt;/div&gt;
        &lt;div style=&quot;padding:10px 12px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;color:var(--text);&quot;&gt;${escHtml(rep.text)}&lt;/div&gt;
      &lt;/div&gt;`).join(&#x27;&#x27;);
}

function deleteCpReport(name,id){
  if(!confirm(&#x27;삭제할까요?&#x27;))return;
  if(db.reports&amp;&amp;db.reports[name]) db.reports[name]=db.reports[name].filter(r=&gt;r.id!==id);
  saveData(true);
  const sl=document.getElementById(&#x27;cpSavedList&#x27;);
  if(sl) sl.innerHTML=renderCpSaved(name);
  showToast(&#x27;삭제됐습니다.&#x27;);
}

let toastT=null;
function showToast(msg){
  const el=document.getElementById(&#x27;toast&#x27;);
  el.textContent=msg;el.classList.add(&#x27;show&#x27;);
  clearTimeout(toastT);
  toastT=setTimeout(()=&gt;el.classList.remove(&#x27;show&#x27;),2200);
}

// ── print hook + 1페이지 자동 맞춤 ──
window.addEventListener(&#x27;beforeprint&#x27;, function(){
  if(printMode===&#x27;report&#x27;) return; // 보고서 인쇄 중에는 일지로 덮어쓰지 않음
  buildPrint();
  const el=document.getElementById(&#x27;printLayout&#x27;);
  el.style.transform=&#x27;&#x27;;
  el.style.width=&#x27;&#x27;;
  // 렌더 후 높이 체크
  requestAnimationFrame(()=&gt;{
    const contentH=el.scrollHeight;
    // A4 @ 96dpi = 1122px, margin 9mm*2 = ~68px
    const pageH=1054;
    if(contentH&gt;pageH){
      const scale=pageH/contentH;
      el.style.transform=`scale(${scale.toFixed(3)})`;
      el.style.transformOrigin=&#x27;top left&#x27;;
      el.style.width=(100/scale).toFixed(1)+&#x27;%&#x27;;
    }
  });
});

══════════════════════════════ */
.list-toolbar{background:var(--warm);border-bottom:1px solid var(--rule);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.count-badge{background:var(--ink);color:var(--al);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:1px;}
.toolbar-btn{background:white;border:1.5px solid var(--rule);color:var(--ink2);padding:7px 11px;border-radius:4px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.toolbar-btn:hover{border-color:var(--accent);color:var(--accent);}
.toolbar-btn.word{border-color:#4472c4;color:#4472c4;}
.toolbar-btn.word:hover{background:#4472c4;color:white;}
.search-wrap{padding:10px 14px;background:white;border-bottom:1px solid var(--rule);}
.search-input{width:100%;padding:9px 14px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:13px;border:1.5px solid var(--rule);border-radius:20px;outline:none;background:var(--paper);color:var(--ink);}
.search-input:focus{border-color:var(--accent);}
.list-wrap{padding:14px;}
.empty{text-align:center;padding:48px 20px;color:var(--rule);font-size:13px;}
.empty-icon{font-size:32px;opacity:0.3;margin-bottom:10px;}

.record-card{background:white;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:4px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
.rc-head{background:var(--ink);color:white;padding:10px 14px;display:flex;align-items:center;gap:8px;}
.rc-num{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);font-size:11px;font-weight:800;color:var(--al);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rc-name{font-family:&#x27;Nanum Myeongjo&#x27;,serif;font-size:15px;font-weight:700;letter-spacing:2px;}
.rc-date{font-size:11px;color:rgba(255,255,255,0.5);margin-left:auto;}
.rc-del{background:transparent;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.4);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
.rc-del:hover{border-color:#e74c3c;color:#e74c3c;}
.rc-edit{background:transparent;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
.rc-edit:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.5);}
.rc-body{padding:12px 14px;}
.rc-table{width:100%;border-collapse:collapse;font-size:13px;}
.rc-table td{padding:6px 8px;border:1px solid #ede8de;}
.rc-table .lb{background:var(--warm);color:var(--accent);font-weight:700;font-size:11px;width:24%;}
.rc-content{line-height:1.8;font-size:13px;color:var(--ink);}

/* ══════════════════════════════
   ③ 반 관리 화면
══════════════════════════════ */
.class-wrap{padding:16px;}
.class-card{background:white;border:1px solid var(--rule);border-radius:6px;margin-bottom:14px;overflow:hidden;}
.class-card-head{background:var(--ink);color:white;padding:11px 14px;display:flex;align-items:center;gap:8px;}
.class-card-icon{font-size:16px;}
.class-card-title{font-family:&#x27;Nanum Myeongjo&#x27;,serif;font-size:14px;font-weight:700;letter-spacing:1px;}
.class-card-body{padding:14px;}

/* 반 추가 */
.add-class-row{display:flex;gap:8px;margin-bottom:14px;}
.class-input{flex:1;padding:10px 12px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:14px;border:1.5px solid var(--rule);border-radius:4px;background:white;color:var(--ink);outline:none;transition:border-color 0.2s;}
.class-input:focus{border-color:var(--accent);}
.class-add-btn{background:var(--accent);color:white;border:none;padding:10px 16px;border-radius:4px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background 0.2s;}
.class-add-btn:hover{background:var(--al);}
.class-add-btn.teal{background:var(--teal);}
.class-add-btn.teal:hover{background:#24898a;}

/* 반 목록 */
.class-list{display:flex;flex-direction:column;gap:12px;}
.class-item{border:1.5px solid var(--rule);border-radius:6px;overflow:hidden;}
.class-item-head{background:var(--warm);padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);}
.class-item-name{font-size:13px;font-weight:700;color:var(--teal);letter-spacing:2px;flex:1;}
.class-del-btn{background:transparent;border:1px solid var(--rule);color:var(--ink2);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.class-del-btn:hover{border-color:#e74c3c;color:#e74c3c;}
.children-area{padding:12px 14px;}
.children-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
.child-tag{display:flex;align-items:center;gap:5px;background:var(--ink);color:#faf8f3;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;}
.child-tag-del{background:transparent;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:14px;padding:0;line-height:1;transition:color 0.2s;}
.child-tag-del:hover{color:#e74c3c;}
.no-child{font-size:12px;color:var(--rule);padding:4px 0;}
.add-child-row{display:flex;gap:7px;}
.child-input{flex:1;padding:8px 11px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:13px;border:1.5px solid var(--rule);border-radius:4px;background:white;color:var(--ink);outline:none;transition:border-color 0.2s;}
.child-input:focus{border-color:var(--teal);}
.child-add-btn{background:var(--teal);color:white;border:none;padding:8px 14px;border-radius:4px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.child-add-btn:hover{background:#24898a;}

/* ══════════════════════════════
   ④ 백업 화면
══════════════════════════════ */
.backup-wrap{padding:16px;}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:white;border:1px solid var(--rule);border-radius:4px;padding:12px;text-align:center;}
.stat-num{font-family:&#x27;Nanum Myeongjo&#x27;,serif;font-size:22px;font-weight:800;color:var(--accent);}
.stat-lbl{font-size:10px;color:var(--ink2);letter-spacing:1px;margin-top:2px;}
.backup-card{background:white;border:1px solid var(--rule);border-radius:6px;margin-bottom:12px;overflow:hidden;}
.backup-card-head{background:var(--ink);color:white;padding:11px 14px;display:flex;align-items:center;gap:8px;}
.backup-icon{font-size:16px;}
.backup-title{font-family:&#x27;Nanum Myeongjo&#x27;,serif;font-size:13px;font-weight:700;letter-spacing:1px;}
.backup-card-body{padding:14px;}
.backup-desc{font-size:12px;color:var(--ink2);line-height:1.7;margin-bottom:12px;}
.backup-btn{width:100%;padding:12px;border:none;border-radius:4px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.5px;}
.backup-btn.export{background:var(--blue);color:white;}
.backup-btn.export:hover{background:#3a6fbe;}
.backup-btn.import{background:var(--warm);color:var(--ink);border:1.5px solid var(--rule);}
.backup-btn.import:hover{border-color:var(--accent);color:var(--accent);}
.backup-btn.word-all{background:var(--accent);color:white;}
.backup-btn.word-all:hover{background:var(--al);}
.backup-status{margin-top:8px;padding:9px 12px;border-radius:4px;font-size:12px;font-weight:500;display:none;}
.backup-status.ok{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}
.backup-status.err{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
input[type=file]{display:none;}

/* ── AI 보완 ── */
.ai-wrap{position:relative;margin-top:4px;}
.ai-btn{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:6px;padding:7px 14px;border-radius:20px;
  border:1.5px solid var(--blue);background:#eef3ff;
  color:var(--blue);font-size:12px;font-weight:700;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;cursor:pointer;
  transition:all .15s;
}
.ai-btn:active{background:var(--blue);color:#fff;}
.ai-btn:disabled{opacity:.5;cursor:not-allowed;}
.ai-spinner{
  display:inline-block;width:13px;height:13px;
  border:2px solid rgba(44,82,130,.25);border-top-color:var(--blue);
  border-radius:50%;animation:ai-spin .7s linear infinite;
}
@keyframes ai-spin{to{transform:rotate(360deg)}}
.ai-toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:rgba(26,26,46,.9);color:#faf8f3;
  padding:8px 18px;border-radius:20px;font-size:12.5px;
  z-index:999;pointer-events:none;opacity:0;transition:opacity .25s;
  white-space:nowrap;
}
.ai-toast.show{opacity:1;}
/* ── API 키 설정 ── */
.api-key-card{background:white;border:1px solid var(--rule);border-radius:6px;margin-bottom:12px;overflow:hidden;}
.api-key-head{background:var(--ink);color:white;padding:11px 14px;display:flex;align-items:center;gap:8px;}
.api-key-body{padding:14px;}
.api-key-desc{font-size:12px;color:var(--ink2);line-height:1.7;margin-bottom:10px;}
.api-key-desc a{color:var(--blue);font-weight:600;}
.api-key-row{display:flex;gap:8px;}
.api-key-input{
  flex:1;padding:9px 12px;font-size:13px;
  border:1.5px solid var(--rule);border-radius:4px;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;color:var(--ink);
  background:white;outline:none;
}
.api-key-input:focus{border-color:var(--accent);}
.api-key-save{
  padding:9px 14px;background:var(--accent);color:white;
  border:none;border-radius:4px;font-size:13px;font-weight:700;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;cursor:pointer;white-space:nowrap;
}
.api-key-ok{
  background:#d4edda;border:1px solid #c3e6cb;border-radius:6px;
  padding:9px 12px;font-size:12.5px;color:#155724;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;
}
.api-key-del{background:none;border:none;color:#e74c3c;cursor:pointer;font-size:12px;}

@media print{
  .nav,.form-wrap,.search-wrap,.list-toolbar,.rc-del{display:none!important;}
  .record-card{break-inside:avoid;}
  .rc-head{background:#1a1a2e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}

/* ── 수정 모달 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-box{background:var(--paper);width:100%;max-width:520px;max-height:90vh;border-radius:16px 16px 0 0;overflow-y:auto;padding:20px 16px 32px;}
.modal-handle{width:40px;height:4px;background:var(--rule);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-family:&#x27;Nanum Myeongjo&#x27;,serif;font-size:16px;font-weight:800;color:var(--ink);letter-spacing:2px;margin-bottom:16px;text-align:center;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-save{flex:2;background:var(--accent);color:white;border:none;padding:13px;border-radius:4px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
.modal-save:hover{background:var(--al);}
.modal-cancel{flex:1;background:white;color:var(--ink2);border:1.5px solid var(--rule);padding:13px;border-radius:4px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
.modal-cancel:hover{border-color:var(--accent);color:var(--accent);}
/* ── 큰 화면(폴드 펼침/태블릿)에서 UI 전체 확대 ── */
@media screen and (min-width:520px){ body{zoom:1.15;} }
@media screen and (min-width:620px){ body{zoom:1.30;} }
@media screen and (min-width:760px){ body{zoom:1.45;} }
@media screen and (min-width:950px){ body{zoom:1.60;} }
@media screen and (min-width:1200px){ body{zoom:1.75;} }
&lt;/style&gt;
