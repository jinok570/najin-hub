<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="교실일지"><meta name="theme-color" content="#1a1a2e"><title>🌱 교실일지</title><link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}html,body{height:100%;overflow:hidden;background:#1a1a2e;}.top-bar{position:fixed;top:0;left:0;right:0;height:52px;background:#1a1a2e;border-bottom:3px solid #8b4513;display:flex;align-items:stretch;z-index:9999;box-shadow:0 2px 12px rgba(0,0,0,.5);}.logo{padding:0 12px;display:flex;align-items:center;font-family:"Nanum Myeongjo",serif;font-size:13px;font-weight:800;color:#faf8f3;letter-spacing:2px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.12);flex-shrink:0;}.tab{flex:1;border:none;background:transparent;cursor:pointer;color:rgba(255,255,255,.4);font-family:"Noto Sans KR",sans-serif;font-size:10.5px;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .18s;}.tab .icon{font-size:17px;line-height:1;}.tab.active{color:#fff;border-bottom-color:#c4792a;}.tab:active{background:rgba(255,255,255,.1);}.tab.soon{opacity:.28;pointer-events:none;}.frames{position:fixed;top:52px;left:0;right:0;bottom:0;}iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;}iframe.active{display:block;}.soon-panel{position:absolute;inset:0;background:#f2ede6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:14px;color:#aaa;}.soon-panel.active{display:flex;}
/* 통합 백업/복원 메뉴 + ☁️ 자동 클라우드 백업(2026-09-04) */
.menu-btn{padding:0 10px;border:none;background:transparent;cursor:pointer;color:rgba(255,255,255,.7);font-size:19px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.12);font-family:"Noto Sans KR",sans-serif;}
.menu-btn:active{background:rgba(255,255,255,.1);color:#fff;}
.bk-modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99999;display:none;align-items:center;justify-content:center;padding:16px;font-family:"Noto Sans KR",sans-serif;}
.bk-modal.open{display:flex;}
.bk-box{background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.4);}
.bk-head{background:#1a1a2e;color:#faf8f3;padding:14px 18px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center;}
.bk-title{font-size:15px;font-weight:700;letter-spacing:1px;}
.bk-x{background:transparent;border:none;color:#faf8f3;font-size:20px;cursor:pointer;padding:0 6px;}
.bk-body{padding:18px;}
.bk-desc{font-size:12.5px;color:#666;line-height:1.7;margin-bottom:14px;}
.bk-btn{display:block;width:100%;margin-bottom:10px;padding:14px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;}
.bk-btn-dl{background:#4a7c59;color:#fff;}
.bk-btn-up{background:#3a5a8c;color:#fff;cursor:pointer;display:block;width:100%;margin-bottom:10px;padding:14px;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;text-align:left;}
.bk-btn-up input{display:none;}
.bk-btn-c{background:#888;color:#fff;}
.bk-btn:active,.bk-btn-up:active{opacity:.85;}
.bk-status{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:12.5px;display:none;line-height:1.6;}
.bk-status.ok{display:block;background:#d4edda;color:#155724;}
.bk-status.err{display:block;background:#f8d7da;color:#721c24;}
.sync-pw{width:100%;padding:13px 14px;margin-bottom:10px;border:1.5px solid #d8cfc4;border-radius:10px;font-size:16px;font-family:"Noto Sans KR",sans-serif;background:#fff;color:#2c2416;}
.sync-pw:focus{outline:none;border-color:#8b6f4e;}
.bk-btn-sync{background:#5a4530;color:#fff;}
.bk-btn-cloud{background:linear-gradient(135deg,#0284c7,#0891b2);color:#fff;}
.cloud-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;border:1px solid transparent;white-space:nowrap;}
.cloud-chip.off{background:#f3ede3;color:#8b6f4e;border-color:#e3d9c8}.cloud-chip.ok{background:#d4edda;color:#155724}.cloud-chip.busy,.cloud-chip.pending{background:#fff3cd;color:#7a5a00}.cloud-chip.warn{background:#ffe8cc;color:#8a4b00}.cloud-chip.err{background:#f8d7da;color:#721c24}

.token-chip{display:flex;align-items:center;gap:4px;padding:0 10px;cursor:pointer;color:rgba(255,255,255,.78);font-family:"Noto Sans KR",sans-serif;font-size:11px;font-weight:700;border-left:1px solid rgba(255,255,255,.12);flex-shrink:0;transition:background .15s;letter-spacing:.3px;}
.token-chip:active{background:rgba(255,255,255,.1);}
.token-chip .tk-icon{font-size:13px;line-height:1;}
.token-chip .tk-num{min-width:24px;text-align:left;}

.sz-b{border:none;background:rgba(255,255,255,.12);color:#faf8f3;font-family:inherit;font-weight:800;font-size:12.5px;width:27px;height:27px;border-radius:8px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;}
.sz-b:active{background:#c4792a;}
.sz-v{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.8);min-width:36px;text-align:center;font-variant-numeric:tabular-nums;}
/* ── Token usage modal ── */
.token-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100000;padding:20px;-webkit-tap-highlight-color:transparent;}
.token-modal.show{display:flex;animation:tkFade .18s ease-out;}
@keyframes tkFade{from{opacity:0;}to{opacity:1;}}
.token-box{background:#faf8f3;border-radius:16px;width:100%;max-width:360px;padding:20px 22px 18px;font-family:"Noto Sans KR",sans-serif;color:#2c2416;box-shadow:0 10px 40px rgba(0,0,0,.4);animation:tkSlide .22s ease-out;}
@keyframes tkSlide{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.token-box h3{font-family:"Nanum Myeongjo",serif;font-size:16px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:7px;letter-spacing:1px;color:#2c2416;}
.token-sub{font-size:11px;color:#8b6f4e;margin-bottom:14px;}
.token-cost-card{background:linear-gradient(135deg,#8b6f4e,#5a4530);color:#faf8f3;border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.token-cost-label{font-size:11px;opacity:.75;letter-spacing:1px;margin-bottom:4px;}
.token-cost-usd{font-family:"Nanum Myeongjo",serif;font-size:24px;font-weight:800;letter-spacing:.5px;}
.token-cost-krw{font-size:11.5px;opacity:.8;margin-top:2px;}
.token-stats{background:#fff;border:1px solid #e3d9c8;border-radius:10px;padding:4px 12px;}
.token-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0e9dc;font-size:12.5px;}
.token-row:last-child{border-bottom:none;}
.token-row .lbl{color:#7a6b58;font-weight:500;}
.token-row .val{font-weight:700;color:#2c2416;font-variant-numeric:tabular-nums;}
.token-row .val.muted{font-weight:500;color:#999;font-size:11px;}
.token-actions{display:flex;gap:8px;margin-top:14px;}
.token-btn{flex:1;padding:10px;border:none;border-radius:9px;font-family:"Noto Sans KR",sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:all .12s;}
.token-btn.close{background:#1a1a2e;color:#fff;}
.token-btn.close:active{background:#000;}
.token-btn.reset{background:#fff;color:#9c3a2e;border:1.5px solid #e3d9c8;}
.token-btn.reset:active{background:#fbe9e7;}
.token-foot{font-size:10px;color:#aaa;text-align:center;margin-top:10px;line-height:1.5;}
/* ── 큰 화면(폴드 펼침/태블릿) 상단바 확대 ── */
@media screen and (min-width:520px){
  .top-bar{height:64px;}.frames{top:64px;}
  .logo{font-size:15.5px;padding:0 16px;}
  .tab{font-size:12.5px;gap:3px;}.tab .icon{font-size:21px;}
  .menu-btn{font-size:23px;padding:0 14px;}
  .token-chip{font-size:13px;padding:0 13px;}.token-chip .tk-icon{font-size:15px;}
  .sz-b{width:32px;height:32px;font-size:15px;}.sz-v{font-size:12.5px;min-width:42px;}
  .bk-box{max-width:520px;}.token-box{max-width:440px;}
}
@media screen and (min-width:760px){

  .menu-btn{font-size:26px;padding:0 17px;}
  .token-chip{font-size:15px;padding:0 15px;}.token-chip .tk-icon{font-size:17.5px;}
  .sz-b{width:38px;height:38px;font-size:17px;}.sz-v{font-size:14px;min-width:50px;}
  .bk-box{max-width:600px;}.token-box{max-width:500px;}
}</style></head><body><div class="top-bar"><div class="logo">🌱 교실일지</div><button class="tab active" onclick="showTab('eval',this)"><span class="icon">📋</span>유아평가</button><button class="tab" onclick="showTab('consult',this)"><span class="icon">💬</span>상담기록</button><button class="tab soon"><span class="icon">📅</span>월간계획</button><div class="size-ctl" title="화면 크기 조절"><button class="sz-b" onclick="stepScale(-1)" aria-label="작게">A−</button><span class="sz-v" id="szVal">100%</span><button class="sz-b" onclick="stepScale(1)" aria-label="크게">A+</button></div><div class="token-chip" onclick="openTokenModal()" title="AI 토큰 사용량"><span class="tk-icon">🪙</span><span class="tk-num" id="tkChipNum">0</span></div><span class="cloud-chip off" id="cloudChip" onclick="openBackupMenu()"><span class="cc-ic">☁️</span><span class="cc-tx">…</span></span><button class="menu-btn" onclick="openBackupMenu()" title="통합 백업/복원">⚙️</button></div><div class="frames"><iframe id="f-eval" class="active" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;ko&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;

&lt;title&gt;유아평가 일지&lt;/title&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&amp;family=Noto+Serif+KR:wght@600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
:root {
  --bg: #f2ede6;
  --card: #ffffff;
  --beige: #ede5d8;
  --tan: #c9b99a;
  --brown: #8b6f4e;
  --dark: #2c2416;
  --text: #3a2e22;
  --border: #d8cfc4;
  --green: #4a7c59;
  --orange: #c0622a;
  --red: #9c3a2e;
  --blue: #3a5a8c;
  --yellow: #b8860b;
  --hdr: #ede5d8;
  --nav-h: 60px;
  --top-h: 56px;
  --radius: 14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:&#x27;Noto Sans KR&#x27;,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

/* ── SCREEN LAYOUT ── */
#app{
  max-width:100%;margin:0 auto;
  min-height:100%;
  display:flex;flex-direction:column;
  padding-top:var(--top-h);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}

/* TOP BAR */
.top-bar{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:100%;
  height:var(--top-h);
  background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;gap:8px;z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.top-date{display:flex;align-items:center;gap:6px;}
.top-date .nav-btn{
  width:30px;height:30px;border-radius:50%;
  border:1.5px solid var(--border);background:var(--beige);
  color:var(--brown);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.top-date .nav-btn:active{background:var(--tan);}
.date-center{text-align:center;}
.date-input{
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:14px;font-weight:600;
  border:none;outline:none;background:transparent;color:var(--dark);
  cursor:pointer;text-align:center;width:130px;
}
.date-day{font-size:10.5px;color:var(--brown);margin-top:1px;}
.save-btn{
  padding:6px 14px;background:var(--brown);color:#fff;
  border:none;border-radius:20px;font-size:12.5px;font-weight:600;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;cursor:pointer;
  display:flex;align-items:center;gap:4px;flex-shrink:0;
}
.save-btn:active{background:var(--dark);}

/* TAB BAR (bottom nav) - FIXED */
.tab-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:100%;
  height:var(--nav-h);
  background:#fff;border-top:1.5px solid var(--border);
  display:flex;align-items:stretch;
  box-shadow:0 -2px 10px rgba(0,0,0,.08);
  z-index:50;
  /* safe area for iPhone notch / Android nav bar */
  padding-bottom:env(safe-area-inset-bottom);
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:transparent;cursor:pointer;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:10.5px;color:#aaa;
  transition:color .15s;
}
.tab-btn .icon{font-size:20px;line-height:1;}
.tab-btn.active{color:var(--brown);}
.tab-btn.active .icon{filter:drop-shadow(0 0 2px rgba(139,111,78,.4));}

/* SCROLL AREA */
.scroll-area{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:12px 12px 20px;
}
.scroll-area::-webkit-scrollbar{display:none;}

/* PANELS */
.panel{display:none;}
.panel.active{display:block;}

/* ── CARDS ── */
.card{
  background:var(--card);border-radius:var(--radius);
  border:1px solid var(--border);margin-bottom:10px;
  overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.card-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;cursor:pointer;user-select:none;
  background:#fff;transition:background .12s;
}
.card-hdr:active{background:var(--beige);}
.card-hdr-left{display:flex;align-items:center;gap:8px;}
.card-icon{font-size:17px;}
.card-title{font-size:13.5px;font-weight:600;color:var(--dark);}
.card-badge{
  font-size:10.5px;padding:2px 8px;border-radius:10px;
  font-weight:500;
}
.badge-ok{background:#e8f5e9;color:#2d6a40;}
.badge-empty{background:#f5f0e8;color:#999;}
.badge-ai{background:#e3f0ff;color:#1a4a8c;}
.card-arrow{font-size:12px;color:#bbb;transition:transform .2s;}
.card-arrow.open{transform:rotate(180deg);}
.card-body{padding:12px 14px;border-top:1px solid var(--border);display:none;}
.card-body.open{display:block;}

/* COMPACT ROW (출석/결석/투약) */
.info-grid{display:flex;flex-direction:column;gap:10px;}
.info-row{display:flex;align-items:flex-start;gap:8px;}
.info-label{
  min-width:68px;font-size:12px;font-weight:600;
  color:var(--brown);padding-top:8px;
}
.info-val{
  flex:1;background:var(--beige);border-radius:8px;
  border:none;outline:none;padding:8px 10px;
  font-size:13px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;
  color:var(--text);resize:none;min-height:36px;
  line-height:1.6;width:100%;
}
.info-val:focus{background:#fdfaf5;outline:2px solid var(--tan);}

/* FIELD WITH AI */
.field-wrap{position:relative;}
.field-ta{
  width:100%;background:var(--beige);border-radius:10px;
  border:none;outline:none;padding:10px 12px;
  font-size:13px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;
  color:var(--text);resize:none;min-height:80px;
  line-height:1.7;
}
.field-ta:focus{background:#fdfaf5;outline:2px solid var(--tan);}
.field-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.ai-btn{
  display:flex;align-items:center;gap:4px;
  padding:6px 12px;border-radius:20px;
  border:1.5px solid #3a5a8c;background:#f0f5ff;
  color:#3a5a8c;font-size:12px;font-weight:600;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;cursor:pointer;
  transition:all .15s;
}
.ai-btn:active{background:#3a5a8c;color:#fff;}
.yt-btn{
  display:flex;align-items:center;gap:4px;
  padding:6px 12px;border-radius:20px;
  border:1.5px solid #c0392b;background:#fff0f0;
  color:#c0392b;font-size:12px;font-weight:600;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;cursor:pointer;
}
.yt-btn:active{background:#c0392b;color:#fff;}

/* LOADING SPINNER */
.spinner{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(58,90,140,.3);
  border-top-color:#3a5a8c;border-radius:50%;
  animation:spin .7s linear infinite;flex-shrink:0;
}
.spinner-red{border-color:rgba(192,57,43,.3);border-top-color:#c0392b;}
@keyframes spin{to{transform:rotate(360deg)}}

/* YOUTUBE RESULTS */
.yt-results{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.yt-card{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;display:flex;align-items:flex-start;gap:10px;
}
.yt-thumb{font-size:22px;flex-shrink:0;margin-top:1px;}
.yt-info{flex:1;min-width:0;}
.yt-title{font-size:12.5px;font-weight:600;color:var(--dark);margin-bottom:3px;line-height:1.4;}
.yt-desc{font-size:11.5px;color:#888;line-height:1.5;}
.yt-link{
  display:inline-flex;align-items:center;gap:3px;
  margin-top:5px;font-size:11.5px;color:#c0392b;font-weight:600;
  text-decoration:none;
}
.yt-link:active{opacity:.7;}

/* ── OBSERVATION SECTION ── */
.obs-section{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.obs-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:var(--tan);
}
.obs-hdr-title{font-size:14px;font-weight:700;color:var(--dark);}
.obs-today-count{font-size:11px;background:rgba(0,0,0,.12);color:var(--dark);padding:2px 9px;border-radius:10px;}
/* CHIPS */
.chips-wrap{padding:10px 12px;border-bottom:1px solid var(--border);background:#fdfbf8;}
.chips-label{font-size:11px;color:#999;margin-bottom:6px;}
.chips-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--brown) #eee6d8;}
.chips-scroll::-webkit-scrollbar{display:block;height:8px;}
.chips-scroll::-webkit-scrollbar-track{background:#eee6d8;border-radius:4px;}
.chips-scroll::-webkit-scrollbar-thumb{background:var(--brown);border-radius:4px;}
.chips-scroll::-webkit-scrollbar-thumb:hover{background:var(--tan);}
.chip{
  flex-shrink:0;padding:6px 13px;border-radius:20px;
  font-size:12.5px;font-weight:500;cursor:pointer;
  border:1.5px solid var(--border);background:#fff;
  color:var(--text);transition:all .12s;
  position:relative;display:flex;align-items:center;gap:4px;
}
.chip:active{transform:scale(.96);}
.chip.sel{background:var(--brown);color:#fff;border-color:var(--brown);}
/* 관찰 작성된 유아: 초록 배경 + ✓ 체크 마크 (눈에 잘 띄게) */

.chip.done:not(.sel){background:#4a7c59;color:#fff;font-weight:700;}
.chip.done:not(.sel)::after{content:&#x27;✓&#x27;;margin-left:2px;font-weight:bold;}
.chip.done.sel::after{content:&#x27;✓&#x27;;margin-left:2px;font-weight:bold;}
/* 최근 관찰 (1~7일 내): 주황 */
.chip.warn{border-color:#e09c3a;}
.chip.warn:not(.sel){background:#fffbf0;color:#b87000;}
.chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
/* OBS CONTENT */

}

/* ── STATS TAB ── */
.stats-week-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;}

}

.sc-g{background:#e8f5e9;color:#2d6a40;border-color:#a5d6a7;}
.sc-b{background:#e3f2fd;color:#0d47a1;border-color:#90caf9;}
.sc-o{background:#fff3e0;color:#7a4e00;border-color:#ffcc80;}
.sc-r{background:#fce4ec;color:#880e4f;border-color:#f48fb1;}
.alert-box{

}

.alert-good{background:#e8f5e9;border:1.5px solid #4a7c59;color:#1a4a2a;}

.alert-names{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.nm-chip{padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600;}
.nc-r{background:#fde8e8;color:#9c3a2e;}
.nc-o{background:#fef0dc;color:#b84f00;}
.nc-g{background:#e4f2e8;color:#2d6a40;}
.s-section-title{font-size:12.5px;font-weight:700;color:var(--dark);margin:14px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--tan);}
/* HEAT TABLE */
.heat-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.heat-scroll::-webkit-scrollbar{display:none;}

.bf-b{background:linear-gradient(90deg,#6a9e3a,#8dbf5a);}
.bf-o{background:linear-gradient(90deg,#d4a017,#e8c040);}

.bar-cnt{font-size:10.5px;color:#999;min-width:40px;}

/* MORE TAB */
.more-list{display:flex;flex-direction:column;gap:8px;}

  display:flex;align-items:flex-start;gap:10px;
}
.act-theme-icon{font-size:18px;flex-shrink:0;}
.act-theme-info{flex:1;}
.act-theme-name{font-size:13px;font-weight:700;color:#7a5500;}
.act-theme-kw{font-size:11px;color:#b8860b;margin-top:3px;line-height:1.6;}
.act-day-card{background:#fff;border-radius:12px;border:1px solid var(--border);margin-bottom:10px;overflow:hidden;}
.act-day-head{background:var(--beige);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.act-day-head:active{background:var(--tan);}
.act-day-left{display:flex;align-items:center;gap:6px;}
.act-day-date{font-size:13px;font-weight:700;color:var(--dark);}
.act-day-dow{font-size:11px;color:var(--brown);}
.act-day-goto{font-size:11px;color:var(--brown);font-weight:600;}
.act-day-body{padding:10px 14px;}
.act-field{margin-bottom:8px;padding-left:8px;border-left:3px solid var(--tan);}
.act-field:last-child{margin-bottom:0;}
.act-field-lbl{font-size:10.5px;font-weight:700;color:var(--brown);margin-bottom:2px;}
.act-field-val{font-size:12.5px;color:var(--text);line-height:1.65;white-space:pre-wrap;}
.act-yt-item{font-size:11.5px;color:var(--blue);padding:1px 0;}
.act-obs-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.act-obs-chip{font-size:11px;padding:3px 10px;border-radius:10px;background:#e8f5e9;color:#2d6a40;border:1px solid #9fd4ae;cursor:pointer;transition:all .15s;user-select:none;}
.act-obs-chip:hover{background:#d4ecd9;border-color:#7cbc92;}
.act-obs-chip:active{background:#c8e6c9;transform:scale(0.95);}
/* ── 관찰 보기 모달 (act 탭에서 칩 클릭 시) ── */
.obs-view-text{background:#f7f4ef;border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word;}
.obs-view-meta{display:flex;align-items:center;gap:8px;background:#fff8e1;border:1px solid #f3e0a8;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11.5px;color:#7a5500;}
.obs-view-empty{text-align:center;padding:30px 14px;color:#bbb;font-size:13px;}
.obs-view-foot{padding:10px 14px 14px;border-top:1px solid var(--border);display:flex;gap:8px;background:#fff;}
.obs-view-btn{flex:1;padding:11px;border-radius:9px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.obs-view-btn.cancel{background:#fff;color:var(--text);border:1.5px solid var(--border);}
.obs-view-btn.cancel:active{background:var(--beige);}
.obs-view-btn.edit{background:var(--brown);color:#fff;border:none;}
.obs-view-btn.edit:active{background:var(--dark);}
.act-empty{text-align:center;padding:40px 20px;font-size:13px;color:#bbb;}
.act-empty-icon{font-size:36px;margin-bottom:10px;}

/* TOAST */
.toast{
  position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  background:rgba(44,36,22,.88);color:#fff;
  padding:8px 18px;border-radius:20px;font-size:12.5px;
  z-index:999;pointer-events:none;opacity:0;transition:opacity .25s;
  white-space:nowrap;max-width:90%;
}
.toast.show{opacity:1;}

/* 설정 안내 */
.fb-guide{
  background:#fff;border:1px solid #c8e6c9;border-radius:8px;
  padding:10px 12px;margin-bottom:12px;font-size:12px;
  color:#2e7d32;line-height:1.7;
}
.fb-guide ol{padding-left:18px;}
.fb-guide li{margin-bottom:3px;}
.fb-guide a{color:#1565c0;font-weight:600;}
.fb-guide code{
  background:#e8f5e9;padding:1px 5px;border-radius:4px;
  font-size:11px;font-family:monospace;
}
.fb-input-row{display:flex;gap:8px;margin-bottom:8px;}
.fb-input{
  flex:1;border:1.5px solid #a5d6a7;border-radius:8px;
  padding:8px 10px;font-size:12.5px;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;color:var(--text);
  background:#fff;outline:none;
}
.fb-input:focus{border-color:#4caf50;}
.fb-save-btn{
  padding:8px 14px;background:#4caf50;color:#fff;
  border:none;border-radius:8px;font-size:12.5px;font-weight:700;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;cursor:pointer;white-space:nowrap;
}
.fb-save-btn:active{background:#388e3c;}
.fb-connected{
  background:#e8f5e9;border:1.5px solid #4caf50;border-radius:10px;
  padding:10px 14px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.fb-connected-info{font-size:12px;color:#2e7d32;font-weight:600;}
.fb-last-sync{font-size:11px;color:#666;margin-top:2px;}
.fb-btn-row{display:flex;gap:8px;margin-top:8px;}
.fb-sync-btn{
  flex:1;padding:9px;background:#4caf50;color:#fff;
  border:none;border-radius:8px;font-size:12.5px;font-weight:700;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.fb-sync-btn:active{background:#388e3c;}
.fb-disc-btn{
  padding:9px 14px;background:#fff;color:#e53935;
  border:1.5px solid #ef9a9a;border-radius:8px;font-size:12px;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;cursor:pointer;
}
.fb-disc-btn:active{background:#ffebee;}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px;}
.photo-item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:#f0ebe3;border:1px solid var(--border);}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;transition:opacity .15s;}
.photo-item img:active{opacity:.8;}
.photo-del{
  position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;border:none;cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;
}
.photo-del:active{background:rgba(192,57,43,.9);}
.photo-count-badge{
  position:absolute;bottom:4px;left:4px;
  background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;
}
.storage-warn{font-size:11px;color:#c0622a;margin-top:6px;padding:5px 8px;background:#fff3e0;border-radius:6px;}
/* LIGHTBOX */
.lightbox{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.93);align-items:center;justify-content:center;flex-direction:column;
}
.lightbox.open{display:flex;}
.lightbox-img{max-width:96vw;max-height:78vh;object-fit:contain;border-radius:8px;}
.lightbox-close{
  position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.18);color:#fff;border:none;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.lightbox-nav{
  display:flex;gap:20px;margin-top:14px;
}
.lightbox-nav button{
  padding:8px 20px;border-radius:20px;border:1.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.1);color:#fff;font-size:14px;cursor:pointer;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;
}
.lightbox-info{color:#aaa;font-size:11.5px;margin-top:8px;}
/* print photo */
.p-photos{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.p-photo{width:60px;height:60px;object-fit:cover;border-radius:3px;border:1px solid #c5b49a;}

/* ═══ PRINT ═══ */
@media print {
  html,body{height:auto;overflow:visible;padding:0;margin:0;}
  #app{display:none!important;}
  #printLayout{display:block!important;}
  .toast,.lightbox{display:none!important;}
  @page{size:A4 portrait;margin:9mm 10mm;}
  /* 일지 인쇄: 한 페이지에 들어가도록 페이지 넘김 방지 (보고서 인쇄는 여러 페이지에 자연스럽게 걸치도록 제외) */
  #printLayout:not(.pl-report), #printLayout:not(.pl-report) *{page-break-inside:avoid;break-inside:avoid;}
  #printLayout .p-tbl, #printLayout .obs-two-col{page-break-inside:avoid;break-inside:avoid;}
  #printLayout .obs-child{page-break-inside:avoid;break-inside:avoid;}
  /* 보고서(학기 종합 등) 인쇄: 표가 여러 페이지에 걸쳐 자연스럽게 이어지도록 함 */
  #printLayout.pl-report{width:190mm;}
  #printLayout.pl-report .p-report-tbl tr{page-break-inside:auto;break-inside:auto;}
  #printLayout.pl-report .p-report-tbl thead{display:table-header-group;}
}
.p-report-title{
  font-family:&#x27;맑은 고딕&#x27;,&#x27;Noto Serif KR&#x27;,serif;
  font-size:16pt;font-weight:700;text-align:center;
  margin-bottom:10px;letter-spacing:.04em;color:#000;
}
.p-report-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-family:&#x27;맑은 고딕&#x27;,&#x27;Noto Sans KR&#x27;,sans-serif;}
.p-report-tbl th,.p-report-tbl td{border:1px solid #000;padding:6px 8px;font-size:10pt;line-height:1.6;color:#000;vertical-align:top;white-space:pre-wrap;word-break:keep-all;word-wrap:break-word;}
.p-report-tbl th{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:center;font-weight:700;white-space:normal;}
.p-report-tbl td:nth-child(1),.p-report-tbl td:nth-child(2){text-align:center;white-space:normal;}
#printLayout{
  display:none;
  font-family:&#x27;맑은 고딕&#x27;,&#x27;Noto Sans KR&#x27;,sans-serif;
  color:#2c2416;font-size:10pt;
  transform-origin:top left;
  width:190mm; /* A4 본문 폭 (210mm - 좌우 10mm씩 여백) */
}
.p-title{
  font-family:&#x27;맑은 고딕&#x27;,&#x27;Noto Serif KR&#x27;,serif;
  font-size:13pt;font-weight:700;text-align:center;
  margin-bottom:6px;letter-spacing:.04em;color:#5a3e28;
  padding:5px 0;
  border-top:3px solid #e8a87c;border-bottom:2px solid #f0c89a;
  background:linear-gradient(to right,#fff8f2,#fff3e8,#fff8f2);
}
.lbl-basic  {background:#fff3cd;}
.lbl-play   {background:#d4edda;}
.lbl-safety {background:#cce5ff;}
.lbl-ourplay{background:#e2d9f3;}
.lbl-etc    {background:#fde2d8;}
.lbl-support{background:#d1ecf1;}
.lbl-obs    {background:#fce4ec;}
/* 메인 테이블 */
.p-tbl{width:100%;border-collapse:collapse;margin-bottom:0;table-layout:fixed;}
.p-tbl td{border:1px solid #bbb;padding:3px 7px;vertical-align:middle;font-size:10pt;line-height:1.5;word-break:keep-all;word-wrap:break-word;}
.p-lbl{font-weight:700;text-align:center;white-space:normal;font-size:9pt;color:#3a2e22;width:68px;vertical-align:middle;}
.p-sh{font-weight:700;text-align:center;font-size:10pt;padding:4px;color:#3a2e22;background:#fce4ec;border:1px solid #bbb;letter-spacing:.04em;}
.p-val{white-space:pre-wrap;line-height:1.5;font-size:10pt;color:#2c2416;}
/* 우리들의 놀이 활동별 단락 */
.p-activity-line{display:block;padding:2px 0 2px 7px;border-left:3px solid #c9b0e8;margin-bottom:3px;line-height:1.5;font-size:10pt;}
.p-activity-line:last-child{margin-bottom:0;}
/* YouTube 기록 (인쇄용) */
.p-yt-list{margin-top:3px;}
.p-yt-item{font-size:8.5pt;color:#5a3a8c;padding:1px 0 1px 6px;border-left:2px solid #c9b0e8;margin-bottom:2px;}
/* 유아 관찰: 두 열 완전 독립 */
.obs-two-col{
  display:flex;
  border:1px solid #bbb;
  margin-top:-1px;
}
.obs-col{flex:1;display:flex;flex-direction:column;}
.obs-col+.obs-col{border-left:1px solid #bbb;}
.obs-child{
  display:flex;
  border-bottom:1px solid #bbb;
  min-height:18px;
}
.obs-child:last-child{border-bottom:none;}
.obs-nm{
  width:58px;min-width:58px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:9.5pt;color:#3a2e22;
  white-space:nowrap;border-right:1px solid #bbb;
  padding:3px 2px;text-align:center;
}
.obs-ct{
  flex:1;padding:3px 6px;font-size:10pt;line-height:1.5;
  white-space:pre-wrap;vertical-align:top;word-break:keep-all;
}
.obs-ct.has-obs{background:#fffef8;}
.obs-ct.no-obs{background:#fafaf8;}
.og-photos{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;}
.og-photo{width:46px;height:46px;object-fit:cover;border-radius:3px;border:1px solid #bbb;}

/* ── 체크리스트 카드 ── */
.cl-month-label{
  font-size:12px;font-weight:700;color:var(--brown);
  background:var(--beige);border-radius:8px;padding:5px 10px;
  margin-bottom:10px;display:inline-block;
}
.cl-section-title{
  font-size:11.5px;font-weight:700;color:var(--dark);
  margin:10px 0 6px;display:flex;align-items:center;gap:5px;
}
.cl-progress{
  height:6px;background:#e8e0d0;border-radius:3px;margin-bottom:12px;overflow:hidden;
}
.cl-progress-bar{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--brown),var(--tan));
  transition:width .4s ease;
}
.cl-list{
  max-height:170px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--border);border-radius:8px;
  background:#fdfaf5;
  scrollbar-width:thin;scrollbar-color:var(--brown) #eee6d8;
}
.cl-list::-webkit-scrollbar{display:block;width:8px;}
.cl-list::-webkit-scrollbar-track{background:#eee6d8;border-radius:4px;}
.cl-list::-webkit-scrollbar-thumb{background:var(--brown);border-radius:4px;}
.cl-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .12s;
}
.cl-item:last-child{border-bottom:none;}
.cl-item:active{background:var(--beige);}
.cl-item.checked{background:#e3f2e8;}
.cl-checkbox{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--tan);background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;transition:all .15s;
}
.cl-item.checked .cl-checkbox{
  background:var(--green);border-color:var(--green);
}
.cl-text{font-size:13px;color:var(--text);line-height:1.4;}
.cl-item.checked .cl-text{color:var(--dark);font-weight:600;}
/* 커스텀 추가 */
.cl-add-row{display:flex;gap:6px;margin-top:8px;}
.cl-add-input{
  flex:1;border:1.5px solid var(--border);border-radius:8px;
  padding:7px 10px;font-size:12.5px;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;color:var(--text);
  background:#fff;outline:none;
}
.cl-add-input:focus{border-color:var(--tan);}
.cl-add-btn{
  padding:7px 13px;background:var(--brown);color:#fff;
  border:none;border-radius:8px;font-size:12px;font-weight:700;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;cursor:pointer;
}
.cl-add-btn:active{background:var(--dark);}
.cl-reset-btn{
  margin-top:8px;padding:6px 12px;
  border:1.5px solid var(--border);border-radius:16px;
  font-size:11.5px;background:#fff;color:#999;cursor:pointer;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;
}
/* 놀이주제 자동생성 항목 */
.pt-items-wrap{margin-bottom:8px;}
.pt-items{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.pt-chip{
  display:flex;align-items:center;gap:6px;
  background:#eef6f0;border:1px solid #bfe0c8;border-radius:16px;
  padding:5px 6px 5px 11px;font-size:11.5px;color:var(--text);
  max-width:100%;
}
.pt-chip-kw{font-weight:700;color:var(--green);margin-right:2px;}
.pt-chip-x{
  width:17px;height:17px;border-radius:50%;border:none;
  background:rgba(0,0,0,.08);color:#666;font-size:11px;line-height:1;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  padding:0;
}
.pt-chip-x:active{background:rgba(0,0,0,.18);}
.pt-add-row{display:flex;gap:6px;margin-bottom:2px;}
.pt-add-input{
  flex:1;border:1.5px solid var(--border);border-radius:8px;
  padding:7px 10px;font-size:12px;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;
  color:var(--text);background:#fff;outline:none;
}
.pt-add-input:focus{border-color:var(--tan);}
.pt-add-btn{
  padding:7px 12px;background:var(--brown);color:#fff;border:none;
  border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;
}
.pt-add-btn:active{background:var(--dark);}
/* 안전교육/놀이계획 자료 업로드 */
.pf-wrap{margin-bottom:10px;}
.pf-files{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
.pf-file-chip{
  display:flex;align-items:center;gap:8px;

  padding:6px 10px;font-size:12px;color:var(--text);
}
.pf-file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pf-file-x{
  width:18px;height:18px;border-radius:50%;border:none;
  background:rgba(0,0,0,.08);color:#666;font-size:11px;line-height:1;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  padding:0;
}
.pf-file-x:active{background:rgba(0,0,0,.18);}
.pf-btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.pf-upload-btn{
  padding:7px 12px;background:#fff;color:var(--brown);
  border:1.5px solid var(--brown);border-radius:8px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;
}
.pf-upload-btn:active{background:var(--beige);}
.pf-auto-btn{
  padding:7px 12px;background:var(--brown);color:#fff;border:none;
  border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;
}
.pf-auto-btn:active{background:var(--dark);}
.pf-auto-btn:disabled{opacity:.5;cursor:default;}
.pf-status{font-size:11px;color:#999;margin-top:4px;line-height:1.5;}
/* 학기 종합 - 전체 유아 표 미리보기 */
.rp-table-preview-wrap{overflow-x:auto;margin-bottom:10px;border-radius:8px;}
.rp-table-preview{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff;}
.rp-table-preview th,.rp-table-preview td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top;white-space:pre-wrap;word-break:keep-all;}
.rp-table-preview th{background:var(--tan);color:var(--dark);font-weight:700;white-space:nowrap;}
.rp-table-preview td:first-child,.rp-table-preview th:first-child{text-align:center;white-space:nowrap;}
.rp-table-preview td:nth-child(2),.rp-table-preview th:nth-child(2){white-space:nowrap;}
/* 이달 주제 배너 (기록 탭 상단) */
.month-theme-banner{
  background:linear-gradient(90deg,#f0f7f2,#e8f5e9);
  border:1.5px solid #8fd4a0;border-radius:12px;
  padding:10px 14px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.mtb-left{display:flex;align-items:center;gap:8px;}
.mtb-icon{font-size:18px;}
.mtb-text{font-size:12.5px;color:#155724;}
.mtb-name{font-weight:700;font-size:13px;color:#0d4a1e;}
.mtb-btn{
  padding:6px 14px;background:#4a7c59;color:#fff;
  border:none;border-radius:16px;font-size:12px;font-weight:600;
  font-family:&#x27;Noto Sans KR&#x27;,sans-serif;cursor:pointer;white-space:nowrap;
  flex-shrink:0;
}
.mtb-btn:active{background:#3a6347;}
/* ── 큰 화면(폴드 펼침/태블릿)에서 UI 전체 확대 ── */
@media screen and (min-width:520px){ body{zoom:1.15;} }
@media screen and (min-width:620px){ body{zoom:1.30;} }
@media screen and (min-width:760px){ body{zoom:1.45;} }
@media screen and (min-width:950px){ body{zoom:1.60;} }
@media screen and (min-width:1200px){ body{zoom:1.75;} }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;app&quot;&gt;

  &lt;!-- TOP BAR --&gt;
  &lt;div class=&quot;top-bar&quot;&gt;
    &lt;div class=&quot;top-date&quot;&gt;
      &lt;button class=&quot;nav-btn&quot; onclick=&quot;changeDate(-1)&quot;&gt;‹&lt;/button&gt;
      &lt;div class=&quot;date-center&quot;&gt;
        &lt;input type=&quot;date&quot; class=&quot;date-input&quot; id=&quot;fDate&quot; onchange=&quot;onDateChange()&quot;&gt;
        &lt;div class=&quot;date-day&quot; id=&quot;fDay&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;button class=&quot;nav-btn&quot; onclick=&quot;changeDate(1)&quot;&gt;›&lt;/button&gt;
    &lt;/div&gt;
    &lt;button class=&quot;save-btn&quot; onclick=&quot;saveData()&quot;&gt;💾 저장&lt;/button&gt;
  &lt;/div&gt;

  &lt;!-- SCROLL AREA --&gt;
  &lt;div class=&quot;scroll-area&quot; id=&quot;scrollArea&quot;&gt;

    &lt;!-- ── RECORD PANEL ── --&gt;
    &lt;div class=&quot;panel active&quot; id=&quot;panel-record&quot;&gt;

      &lt;!-- 📚 이달 생활주제 체크리스트 --&gt;
      &lt;div class=&quot;card&quot; id=&quot;card-checklist&quot;&gt;
        &lt;div class=&quot;card-hdr&quot; onclick=&quot;toggleCard(&#x27;checklist&#x27;)&quot;&gt;
          &lt;div class=&quot;card-hdr-left&quot;&gt;
            &lt;span class=&quot;card-icon&quot;&gt;📚&lt;/span&gt;
            &lt;span class=&quot;card-title&quot;&gt;이달 생활주제 체크리스트&lt;/span&gt;
          &lt;/div&gt;
          &lt;div style=&quot;display:flex;align-items:center;gap:6px;&quot;&gt;
            &lt;span class=&quot;card-badge badge-ok&quot; id=&quot;badge-checklist&quot; style=&quot;display:none;&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;card-arrow&quot; id=&quot;arrow-checklist&quot;&gt;▼&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card-body open&quot; id=&quot;body-checklist&quot;&gt;
          &lt;div id=&quot;checklistContent&quot;&gt;&lt;/div&gt;
          &lt;div style=&quot;font-size:11px;color:#999;margin-top:8px;line-height:1.5;&quot;&gt;💡 체크한 생활주제는 그 주(월~금, 공휴일 제외)에 적용돼요. 다른 주의 날짜를 보다가 체크하면 그 주만 바뀌고, 이전에 고른 주는 그대로 남아있어요. &lt;b&gt;우리들의 놀이&lt;/b&gt;·&lt;b&gt;지원계획&lt;/b&gt;·&lt;b&gt;놀이주제&lt;/b&gt;·&lt;b&gt;기타&lt;/b&gt;에 자동으로 채워드리고, 이미 적어둔 내용은 절대 덮어쓰지 않아요.&lt;/div&gt;
          &lt;div id=&quot;themeBatchStatus&quot; style=&quot;display:none;font-size:12px;margin-top:8px;padding:8px 10px;border-radius:8px;line-height:1.5;&quot;&gt;&lt;/div&gt;
          &lt;button type=&quot;button&quot; id=&quot;themeBatchRetryBtn&quot; onclick=&quot;manualThemeBatchRetry()&quot; style=&quot;display:none;margin-top:6px;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;&quot;&gt;🔄 지금 다시 반영하기&lt;/button&gt;
          &lt;button type=&quot;button&quot; id=&quot;dayRegenBtn&quot; onclick=&quot;regenerateThemeForDate(cur)&quot; style=&quot;display:none;margin-top:6px;margin-left:6px;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid #e0a35c;background:#fff8ef;color:#a05a1e;cursor:pointer;&quot;&gt;🔁 오늘 날짜만 다시 생성&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 이달 배너 --&gt;
      &lt;div id=&quot;monthThemeBanner&quot; style=&quot;display:none;&quot;&gt;&lt;/div&gt;

      &lt;!-- 기본정보 --&gt;
      &lt;div class=&quot;card&quot; id=&quot;card-basic&quot;&gt;
        &lt;div class=&quot;card-hdr&quot; onclick=&quot;toggleCard(&#x27;basic&#x27;)&quot;&gt;
          &lt;div class=&quot;card-hdr-left&quot;&gt;
            &lt;span class=&quot;card-icon&quot;&gt;📋&lt;/span&gt;
            &lt;span class=&quot;card-title&quot;&gt;기본 정보&lt;/span&gt;
          &lt;/div&gt;
          &lt;div style=&quot;display:flex;align-items:center;gap:6px;&quot;&gt;
            &lt;span class=&quot;card-badge badge-empty&quot; id=&quot;badge-basic&quot;&gt;출석·결석·투약&lt;/span&gt;
            &lt;span class=&quot;card-arrow&quot; id=&quot;arrow-basic&quot;&gt;▼&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card-body open&quot; id=&quot;body-basic&quot;&gt;
          &lt;div class=&quot;info-grid&quot;&gt;
            &lt;div class=&quot;info-row&quot;&gt;
              &lt;span class=&quot;info-label&quot;&gt;출석인원&lt;/span&gt;
              &lt;textarea class=&quot;info-val&quot; id=&quot;f_attend&quot; rows=&quot;1&quot; placeholder=&quot;명&quot; oninput=&quot;markChanged();syncBadge(&#x27;basic&#x27;)&quot;&gt;&lt;/textarea&gt;
            &lt;/div&gt;
            &lt;div class=&quot;info-row&quot;&gt;
              &lt;span class=&quot;info-label&quot;&gt;결석유아&lt;/span&gt;
              &lt;textarea class=&quot;info-val&quot; id=&quot;f_absent&quot; rows=&quot;2&quot; placeholder=&quot;이름&quot; oninput=&quot;markChanged()&quot;&gt;&lt;/textarea&gt;
            &lt;/div&gt;
            &lt;div class=&quot;info-row&quot;&gt;
              &lt;span class=&quot;info-label&quot;&gt;투약&lt;/span&gt;
              &lt;textarea class=&quot;info-val&quot; id=&quot;f_med&quot; rows=&quot;2&quot; placeholder=&quot;투약 내용&quot; oninput=&quot;markChanged()&quot;&gt;&lt;/textarea&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 놀이주제 --&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-hdr&quot; onclick=&quot;toggleCard(&#x27;play&#x27;)&quot;&gt;
          &lt;div class=&quot;card-hdr-left&quot;&gt;
            &lt;span class=&quot;card-icon&quot;&gt;🎯&lt;/span&gt;
            &lt;span class=&quot;card-title&quot;&gt;놀이 주제 및 교사 계획 활동&lt;/span&gt;
          &lt;/div&gt;
          &lt;div style=&quot;display:flex;align-items:center;gap:6px;&quot;&gt;
            &lt;span class=&quot;card-badge badge-empty&quot; id=&quot;badge-play&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;card-arrow&quot; id=&quot;arrow-play&quot;&gt;▼&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card-body&quot; id=&quot;body-play&quot;&gt;
          &lt;div class=&quot;field-wrap&quot;&gt;
            &lt;textarea class=&quot;field-ta&quot; id=&quot;f_play_theme&quot; rows=&quot;4&quot; placeholder=&quot;놀이 주제나 계획을 입력하거나, 키워드 입력 후 AI 보완을 사용해보세요.&quot; oninput=&quot;markChanged();syncBadge(&#x27;play&#x27;)&quot;&gt;&lt;/textarea&gt;
            &lt;div class=&quot;field-actions&quot;&gt;
              &lt;button class=&quot;ai-btn&quot; onclick=&quot;expandAI(&#x27;f_play_theme&#x27;,&#x27;놀이 주제 및 교사 계획 활동&#x27;)&quot;&gt;
                &lt;span id=&quot;ai-icon-f_play_theme&quot;&gt;✨&lt;/span&gt; AI 보완
              &lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 안전교육 --&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-hdr&quot; onclick=&quot;toggleCard(&#x27;safety&#x27;)&quot;&gt;
          &lt;div class=&quot;card-hdr-left&quot;&gt;
            &lt;span class=&quot;card-icon&quot;&gt;🛡️&lt;/span&gt;
            &lt;span class=&quot;card-title&quot;&gt;안전 교육 및 생활 속 안전지도&lt;/span&gt;
          &lt;/div&gt;
          &lt;div style=&quot;display:flex;align-items:center;gap:6px;&quot;&gt;
            &lt;span class=&quot;card-badge badge-empty&quot; id=&quot;badge-safety&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;card-arrow&quot; id=&quot;arrow-safety&quot;&gt;▼&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card-body&quot; id=&quot;body-safety&quot;&gt;
          &lt;div id=&quot;safetyFilesWrap&quot; class=&quot;pf-wrap&quot;&gt;&lt;/div&gt;
          &lt;input type=&quot;file&quot; id=&quot;safetyFileInput&quot; accept=&quot;application/pdf&quot; multiple style=&quot;display:none&quot; onchange=&quot;onSafetyFilesSelected(event)&quot;&gt;
          &lt;textarea class=&quot;field-ta&quot; id=&quot;f_safety&quot; rows=&quot;4&quot; placeholder=&quot;키워드 입력 후 ✨AI 보완 또는 🎬YouTube 찾기&quot; oninput=&quot;markChanged();syncBadge(&#x27;safety&#x27;)&quot;&gt;&lt;/textarea&gt;
          &lt;div class=&quot;field-actions&quot;&gt;
            &lt;button class=&quot;ai-btn&quot; onclick=&quot;expandAI(&#x27;f_safety&#x27;,&#x27;안전 교육 및 생활 속 안전지도&#x27;)&quot;&gt;
              &lt;span id=&quot;ai-icon-f_safety&quot;&gt;✨&lt;/span&gt; AI 보완
            &lt;/button&gt;
            &lt;button class=&quot;yt-btn&quot; onclick=&quot;searchYouTubeSafety()&quot;&gt;
              🎬 YouTube 찾기
            &lt;/button&gt;
          &lt;/div&gt;
          &lt;div id=&quot;ytResultsSafety&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 우리들의 놀이 --&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-hdr&quot; onclick=&quot;toggleCard(&#x27;ourplay&#x27;)&quot;&gt;
          &lt;div class=&quot;card-hdr-left&quot;&gt;
            &lt;span class=&quot;card-icon&quot;&gt;🧩&lt;/span&gt;
            &lt;span class=&quot;card-title&quot;&gt;우리들의 놀이&lt;/span&gt;
          &lt;/div&gt;
          &lt;div style=&quot;display:flex;align-items:center;gap:6px;&quot;&gt;
            &lt;span class=&quot;card-badge badge-empty&quot; id=&quot;badge-ourplay&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;card-arrow&quot; id=&quot;arrow-ourplay&quot;&gt;▼&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card-body&quot; id=&quot;body-ourplay&quot;&gt;
          &lt;div id=&quot;playPlanFilesWrap&quot; class=&quot;pf-wrap&quot;&gt;&lt;/div&gt;
          &lt;input type=&quot;file&quot; id=&quot;playPlanFileInput&quot; accept=&quot;application/pdf&quot; multiple style=&quot;display:none&quot; onchange=&quot;onPlayPlanFilesSelected(event)&quot;&gt;
          &lt;textarea class=&quot;field-ta&quot; id=&quot;f_our_play&quot; rows=&quot;5&quot; placeholder=&quot;키워드 입력 후 ✨AI 보완 또는 🎬YouTube 찾기&quot; oninput=&quot;markChanged();syncBadge(&#x27;ourplay&#x27;)&quot;&gt;&lt;/textarea&gt;
          &lt;div class=&quot;field-actions&quot;&gt;
            &lt;button class=&quot;ai-btn&quot; onclick=&quot;expandAI(&#x27;f_our_play&#x27;,&#x27;우리들의 놀이 활동 내용&#x27;)&quot;&gt;
              &lt;span id=&quot;ai-icon-f_our_play&quot;&gt;✨&lt;/span&gt; AI 보완
            &lt;/button&gt;
            &lt;button class=&quot;yt-btn&quot; id=&quot;ytBtn&quot; onclick=&quot;searchYouTube()&quot;&gt;
              &lt;span id=&quot;yt-icon&quot;&gt;🎬&lt;/span&gt; YouTube 찾기
            &lt;/button&gt;
          &lt;/div&gt;
          &lt;div id=&quot;ytResults&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 기타/지원계획 --&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-hdr&quot; onclick=&quot;toggleCard(&#x27;etc&#x27;)&quot;&gt;
          &lt;div class=&quot;card-hdr-left&quot;&gt;
            &lt;span class=&quot;card-icon&quot;&gt;📌&lt;/span&gt;
            &lt;span class=&quot;card-title&quot;&gt;기타 / 지원계획&lt;/span&gt;
          &lt;/div&gt;
          &lt;div style=&quot;display:flex;align-items:center;gap:6px;&quot;&gt;
            &lt;span class=&quot;card-badge badge-empty&quot; id=&quot;badge-etc&quot;&gt;&lt;/span&gt;
            &lt;span class=&quot;card-arrow&quot; id=&quot;arrow-etc&quot;&gt;▼&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card-body&quot; id=&quot;body-etc&quot;&gt;
          &lt;div style=&quot;font-size:11.5px;color:#999;margin-bottom:5px;&quot;&gt;기타&lt;/div&gt;
          &lt;textarea class=&quot;field-ta&quot; id=&quot;f_etc&quot; rows=&quot;3&quot; placeholder=&quot;기타 내용&quot; oninput=&quot;markChanged();syncBadge(&#x27;etc&#x27;)&quot;&gt;&lt;/textarea&gt;
          &lt;div class=&quot;field-actions&quot; style=&quot;margin-bottom:12px;&quot;&gt;
            &lt;button class=&quot;ai-btn&quot; onclick=&quot;expandAI(&#x27;f_etc&#x27;,&#x27;기타 사항&#x27;)&quot;&gt;
              &lt;span id=&quot;ai-icon-f_etc&quot;&gt;✨&lt;/span&gt; AI 보완
            &lt;/button&gt;
          &lt;/div&gt;
          &lt;div style=&quot;font-size:11.5px;color:#999;margin-bottom:5px;margin-top:4px;&quot;&gt;지원계획&lt;/div&gt;
          &lt;textarea class=&quot;field-ta&quot; id=&quot;f_support&quot; rows=&quot;3&quot; placeholder=&quot;지원계획 내용&quot; oninput=&quot;markChanged()&quot;&gt;&lt;/textarea&gt;
          &lt;div class=&quot;field-actions&quot;&gt;
            &lt;button class=&quot;ai-btn&quot; onclick=&quot;expandAI(&#x27;f_support&#x27;,&#x27;지원계획&#x27;)&quot;&gt;
              &lt;span id=&quot;ai-icon-f_support&quot;&gt;✨&lt;/span&gt; AI 보완
            &lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- 유아 관찰 --&gt;
      &lt;div class=&quot;obs-section&quot;&gt;
        &lt;div class=&quot;obs-hdr&quot;&gt;
          &lt;span class=&quot;obs-hdr-title&quot;&gt;👶 유아 관찰&lt;/span&gt;
          &lt;span class=&quot;obs-today-count&quot; id=&quot;obsTodayCount&quot;&gt;0명 기록&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;chips-wrap&quot;&gt;
          &lt;div class=&quot;chips-label&quot;&gt;← 스크롤하여 이름 선택 →&lt;/div&gt;
          &lt;div class=&quot;chips-scroll&quot; id=&quot;chipsScroll&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;obs-content&quot;&gt;
          &lt;div id=&quot;obsNoSel&quot; class=&quot;obs-empty-msg&quot;&gt;위에서 아이 이름을 선택하세요&lt;/div&gt;
          &lt;div id=&quot;obsEditor&quot; style=&quot;display:none;&quot;&gt;
            &lt;div class=&quot;obs-name-row&quot;&gt;
              &lt;div class=&quot;obs-name-badge&quot;&gt;
                &lt;span class=&quot;dot&quot; id=&quot;obsSelDot&quot;&gt;&lt;/span&gt;
                &lt;span id=&quot;obsSelName&quot;&gt;&lt;/span&gt;
              &lt;/div&gt;
              &lt;div style=&quot;display:flex;align-items:center;gap:8px;&quot;&gt;
                &lt;div style=&quot;font-size:11px;color:#aaa;&quot; id=&quot;obsLastDate&quot;&gt;&lt;/div&gt;
                &lt;button onclick=&quot;openChildProfile(selChild)&quot; style=&quot;font-size:11px;padding:3px 9px;border-radius:10px;border:1.5px solid var(--brown);background:var(--beige);color:var(--brown);cursor:pointer;font-family:&#x27;Noto Sans KR&#x27;,sans-serif;font-weight:600;&quot;&gt;전체현황&lt;/button&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;!-- 자동 누리과정 영역 태그 --&gt;
            &lt;div id=&quot;obsAutoAreas&quot; style=&quot;display:flex;flex-wrap:wrap;gap:5px;margin:5px 0;min-height:0;&quot;&gt;&lt;/div&gt;
            &lt;textarea class=&quot;obs-ta&quot; id=&quot;obsText&quot; rows=&quot;5&quot;
              placeholder=&quot;관찰 내용 또는 키워드 입력 후 AI 보완&quot;
              oninput=&quot;onObsInput()&quot;&gt;&lt;/textarea&gt;
            &lt;div class=&quot;obs-actions&quot;&gt;
              &lt;button class=&quot;ai-btn&quot; onclick=&quot;expandObsAI()&quot;&gt;
                &lt;span id=&quot;ai-icon-obs&quot;&gt;✨&lt;/span&gt; AI 보완
              &lt;/button&gt;
              &lt;label class=&quot;ai-btn&quot; style=&quot;border-color:#4a7c59;background:#f0f7f2;color:#4a7c59;cursor:pointer;&quot;&gt;
                📷 사진 추가
                &lt;input type=&quot;file&quot; accept=&quot;image/*&quot; multiple style=&quot;display:none&quot; onchange=&quot;addPhotos(event)&quot;&gt;
              &lt;/label&gt;
              &lt;button class=&quot;ai-btn&quot; style=&quot;border-color:#8b6f4e;background:#fdf5ee;color:#8b6f4e;&quot; onclick=&quot;addChildFromObs()&quot;&gt;
                ＋ 이름 추가
              &lt;/button&gt;
            &lt;/div&gt;
            &lt;div id=&quot;photoGrid&quot; class=&quot;photo-grid&quot;&gt;&lt;/div&gt;
            &lt;div id=&quot;storageWarn&quot;&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div style=&quot;height:12px;&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;!-- /panel-record --&gt;

    &lt;!-- ── STATS PANEL ── --&gt;
    &lt;div class=&quot;panel&quot; id=&quot;panel-stats&quot;&gt;
      &lt;div class=&quot;stats-week-nav&quot;&gt;
        &lt;button onclick=&quot;changeWeek(-1)&quot;&gt;‹&lt;/button&gt;
        &lt;div class=&quot;week-lbl&quot; id=&quot;weekLbl&quot;&gt;&lt;/div&gt;
        &lt;button onclick=&quot;changeWeek(1)&quot;&gt;›&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sum-grid&quot; id=&quot;sumGrid&quot;&gt;&lt;/div&gt;
      &lt;div id=&quot;alertBox&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;s-section-title&quot;&gt;🗓️ 주간 관찰 현황&lt;/div&gt;
      &lt;div class=&quot;heat-scroll&quot;&gt;&lt;table class=&quot;heat-tbl&quot; id=&quot;heatTbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;
      &lt;div class=&quot;s-section-title&quot; style=&quot;margin-top:16px;&quot;&gt;📈 관찰 횟수 (최근 4주)&lt;/div&gt;
      &lt;div class=&quot;bar-list&quot; id=&quot;bars4w&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;s-section-title&quot; style=&quot;margin-top:16px;&quot;&gt;📋 전체 기간 관찰 횟수&lt;/div&gt;
      &lt;div class=&quot;bar-list&quot; id=&quot;barsAll&quot;&gt;&lt;/div&gt;
      &lt;div style=&quot;height:16px;&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- ── ACTIVITY PANEL ── --&gt;
    &lt;div class=&quot;panel&quot; id=&quot;panel-activity&quot;&gt;
      &lt;div class=&quot;act-month-nav&quot;&gt;
        &lt;button onclick=&quot;changeActMonth(-1)&quot;&gt;‹&lt;/button&gt;
        &lt;div class=&quot;act-month-lbl&quot; id=&quot;actMonthLbl&quot;&gt;&lt;/div&gt;
        &lt;button onclick=&quot;changeActMonth(1)&quot;&gt;›&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;act-summary&quot; id=&quot;actSummary&quot;&gt;&lt;/div&gt;
      &lt;div id=&quot;actThemeBanner&quot;&gt;&lt;/div&gt;
      &lt;div id=&quot;actDayList&quot;&gt;&lt;/div&gt;
      &lt;div style=&quot;height:16px;&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- ── REPORT PANEL ── --&gt;
    &lt;div class=&quot;panel&quot; id=&quot;panel-report&quot;&gt;

      &lt;!-- 아이 선택 --&gt;
      &lt;div class=&quot;rp-child-section&quot;&gt;
        &lt;div class=&quot;rp-label&quot;&gt;👶 아이 선택&lt;/div&gt;
        &lt;div class=&quot;rp-child-chips&quot; id=&quot;rpChildChips&quot;&gt;&lt;/div&gt;

// ═══════════════════════════════════════════
// API KEY MANAGEMENT
// ═══════════════════════════════════════════
function getApiKey(){ return localStorage.getItem(SK_KEY)||&#x27;&#x27;; }

function getApiHeaders(){
  const key = getApiKey();
  return {
    &#x27;Content-Type&#x27;: &#x27;application/json&#x27;
  };
}

function checkApiKey(){
  // Gateway mode (2026-09-02): Claude runs via n8n -> Claude Code subscription. No API key needed.
  return true;
  if(!getApiKey()){
    showToast(&#x27;⚙️ 더보기 탭에서 API 키를 먼저 설정하세요&#x27;);
    switchTab(&#x27;more&#x27;, document.getElementById(&#x27;tabmore&#x27;));
    return false;
  }
  return true;
}

function renderApiSetup(){
  const el = document.getElementById(&#x27;apiSetupSection&#x27;);
  if(!el) return;
  const key = getApiKey();
  if(key){
    el.innerHTML=`&lt;div class=&quot;api-status-ok&quot;&gt;
      🔑 API 키 연결됨 (✨AI·🎬YouTube 사용 가능)
      &lt;button class=&quot;api-del-btn&quot; onclick=&quot;deleteApiKey()&quot;&gt;삭제&lt;/button&gt;
    &lt;/div&gt;`;
  } else {
    el.innerHTML=`&lt;div class=&quot;api-setup-banner&quot;&gt;
      &lt;h4&gt;🔑 AI 기능 사용을 위해 API 키 설정 필요&lt;/h4&gt;
      &lt;p&gt;✨AI 보완과 🎬YouTube 찾기 기능은 Anthropic API 키가 필요합니다.&lt;br&gt;
      &lt;a href=&quot;https://console.anthropic.com&quot; target=&quot;_blank&quot;&gt;console.anthropic.com&lt;/a&gt;에서 무료로 발급받을 수 있습니다.&lt;/p&gt;
      &lt;div class=&quot;api-key-row&quot;&gt;
        &lt;input type=&quot;password&quot; class=&quot;api-key-input&quot; id=&quot;apiKeyInput&quot; placeholder=&quot;sk-ant-api03-...&quot;&gt;
        &lt;button class=&quot;api-key-save&quot; onclick=&quot;saveApiKey()&quot;&gt;저장&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  }
}

function saveApiKey(){
  const v = document.getElementById(&#x27;apiKeyInput&#x27;).value.trim();
  if(!v){showToast(&#x27;API 키를 입력하세요.&#x27;);return;}
  if(!v.startsWith(&#x27;sk-&#x27;)){showToast(&#x27;올바른 API 키 형식이 아닙니다.&#x27;);return;}
  localStorage.setItem(SK_KEY, v);
  renderApiSetup();
  showToast(&#x27;API 키가 저장되었습니다 ✓&#x27;);
}

function deleteApiKey(){
  if(!confirm(&#x27;API 키를 삭제할까요?&#x27;)) return;
  localStorage.removeItem(SK_KEY);
  renderApiSetup();
  showToast(&#x27;API 키가 삭제되었습니다.&#x27;);
}

  if(data &amp;&amp; typeof data === &#x27;object&#x27;){

function getDotStyle(name){
  const r=db.records[cur];
  if(r&amp;&amp;r.observations&amp;&amp;r.observations[name])return{bg:&#x27;#4a7c59&#x27;,cls:&#x27;done&#x27;};
  for(let i=1;i&lt;=7;i++){const d=addDays(cur,-i);if(db.records[d]&amp;&amp;db.records[d].observations&amp;&amp;db.records[d].observations[name])return{bg:&#x27;#e09c3a&#x27;,cls:&#x27;warn&#x27;};}
  return{bg:&#x27;#ccc&#x27;,cls:&#x27;&#x27;};
}
function renderChips(){
  const sc=document.getElementById(&#x27;chipsScroll&#x27;);
  sc.innerHTML=&#x27;&#x27;;
  db.children.forEach(function(name){
    const ds=getDotStyle(name);
    const isSel=name===selChild;
    const div=document.createElement(&#x27;div&#x27;);
    div.className=&#x27;chip&#x27;+( isSel?&#x27; sel&#x27;:( ds.cls?&#x27; &#x27;+ds.cls:&#x27;&#x27; ) );
    div.dataset.name=name;
    div.innerHTML=&#x27;&lt;span class=&quot;chip-dot&quot; style=&quot;background:&#x27;+ds.bg+&#x27;&quot;&gt;&lt;/span&gt;&#x27;+name;
    div.onclick=function(){ selectChild(name); };
    sc.appendChild(div);
  });
  updateObsCount();
}
function updateObsCount(){
  const r=db.records[cur];
  const n=r?(Object.keys(r.observations||{}).length):0;
  document.getElementById(&#x27;obsTodayCount&#x27;).textContent=n+&#x27;명 기록&#x27;;
}
function selectChild(name){
  flushObs();
  selChild=name;
  const r=getRec(cur);
  const txt=r.observations[name]||&#x27;&#x27;;

  // 칩 선택 상태만 업데이트 (전체 재렌더 안 함)
  document.querySelectorAll(&#x27;#chipsScroll .chip&#x27;).forEach(function(c){
    c.classList.remove(&#x27;sel&#x27;);
  });
  document.querySelectorAll(&#x27;#chipsScroll .chip&#x27;).forEach(function(c){
    if(c.textContent.trim()===name || c.dataset.name===name){
      c.classList.add(&#x27;sel&#x27;);
    }
  });

  // 에디터 업데이트
  const ta=document.getElementById(&#x27;obsText&#x27;);
  if(ta) ta.value=txt;
  const sn=document.getElementById(&#x27;obsSelName&#x27;);
  if(sn) sn.textContent=name;
  const ds=getDotStyle(name);
  const sd=document.getElementById(&#x27;obsSelDot&#x27;);
  if(sd) sd.style.background=ds.bg;

  let lastD=null;
  Object.keys(db.records).sort().reverse().forEach(function(d){
    if(!lastD&amp;&amp;d!==cur&amp;&amp;db.records[d].observations&amp;&amp;db.records[d].observations[name])lastD=d;
  });
  const ld=document.getElementById(&#x27;obsLastDate&#x27;);
  if(ld) ld.textContent=lastD?&#x27;마지막: &#x27;+lastD.slice(5).replace(&#x27;-&#x27;,&#x27;/&#x27;):&#x27;&#x27;;

  // 에디터 표시
  const noSel=document.getElementById(&#x27;obsNoSel&#x27;);
  const editor=document.getElementById(&#x27;obsEditor&#x27;);
  if(noSel) noSel.style.display=&#x27;none&#x27;;
  if(editor) editor.style.display=&#x27;block&#x27;;

  renderAutoAreas(txt);
  renderPhotoGrid();
  updateObsCount();

  // 에디터로 스크롤
  setTimeout(function(){
    try{
      const sa=document.getElementById(&#x27;scrollArea&#x27;);
      const obs=document.querySelector(&#x27;.obs-section&#x27;);
      if(sa&amp;&amp;obs){
        const top=obs.offsetTop - 70;
        sa.scrollTo({top:top,behavior:&#x27;smooth&#x27;});
      }
    }catch(e){}
  },80);
}

// PHOTO FUNCTIONS
// ═══════════════════════════════════════════
let lightboxPhotos=[];
let lightboxIdx=0;

function getObsPhotos(name){
  const r=getRec(cur);
  if(!r.obsPhotos)r.obsPhotos={};
  if(!r.obsPhotos[name])r.obsPhotos[name]=[];
  return r.obsPhotos[name];
}

function addPhotos(event){
  if(!selChild)return;
  const files=Array.from(event.target.files);
  if(!files.length)return;
  const photos=getObsPhotos(selChild);
  let loaded=0;
  files.forEach(file=&gt;{
    // 파일 크기 체크 (1장당 최대 3MB)
    if(file.size&gt;3*1024*1024){
      showToast(`⚠️ ${file.name}: 3MB 초과 - 건너뜁니다`);
      loaded++;if(loaded===files.length)afterPhotosLoaded();
      return;
    }
    const reader=new FileReader();
    reader.onload=e=&gt;{
      photos.push({dataUrl:e.target.result, name:file.name, date:new Date().toISOString()});
      loaded++;
      if(loaded===files.length)afterPhotosLoaded();
    };
    reader.readAsDataURL(file);
  });
  event.target.value=&#x27;&#x27;;
}

function afterPhotosLoaded(){
  renderPhotoGrid();
  checkStorage();
  markChanged();
  showToast(&#x27;사진이 추가되었습니다 📷&#x27;);
}

function renderPhotoGrid(){
  const grid=document.getElementById(&#x27;photoGrid&#x27;);
  if(!grid||!selChild){return;}
  const photos=getObsPhotos(selChild);
  if(photos.length===0){grid.innerHTML=&#x27;&#x27;;return;}
  grid.innerHTML=photos.map((p,i)=&gt;`
    &lt;div class=&quot;photo-item&quot;&gt;
      &lt;img src=&quot;${p.dataUrl}&quot; alt=&quot;관찰사진 ${i+1}&quot; onclick=&quot;openLightbox(${i})&quot;&gt;
      &lt;button class=&quot;photo-del&quot; onclick=&quot;deletePhoto(${i})&quot; title=&quot;삭제&quot;&gt;✕&lt;/button&gt;
      &lt;span class=&quot;photo-count-badge&quot;&gt;${i+1}&lt;/span&gt;
    &lt;/div&gt;`).join(&#x27;&#x27;);
}

function deletePhoto(idx){
  if(!selChild)return;
  if(!confirm(&#x27;이 사진을 삭제할까요?&#x27;))return;
  const photos=getObsPhotos(selChild);
  photos.splice(idx,1);
  renderPhotoGrid();
  markChanged();
  showToast(&#x27;사진을 삭제했습니다.&#x27;);
}

function checkStorage(){
  const warn=document.getElementById(&#x27;storageWarn&#x27;);
  if(!warn)return;
  try{
    const total=JSON.stringify(db).length;
    const mb=(total/1024/1024).toFixed(1);
    if(total&gt;6*1024*1024){
      warn.innerHTML=`&lt;div class=&quot;storage-warn&quot;&gt;⚠️ 저장 용량이 거의 찼습니다 (${mb}MB). 오래된 사진을 삭제해주세요.&lt;/div&gt;`;
    } else if(total&gt;4*1024*1024){
      warn.innerHTML=`&lt;div class=&quot;storage-warn&quot;&gt;💡 저장 용량: ${mb}MB 사용 중. 사진이 많으면 용량이 찰 수 있어요.&lt;/div&gt;`;
    } else {
      warn.innerHTML=&#x27;&#x27;;
    }
  }catch(e){}
}

// ── LIGHTBOX ──
function openLightbox(idx){
  if(!selChild)return;
  lightboxPhotos=getObsPhotos(selChild);
  lightboxIdx=idx;
  showLightboxPhoto();
  document.getElementById(&#x27;lightbox&#x27;).classList.add(&#x27;open&#x27;);
}
function showLightboxPhoto(){
  const p=lightboxPhotos[lightboxIdx];
  if(!p)return;
  document.getElementById(&#x27;lightboxImg&#x27;).src=p.dataUrl;
  document.getElementById(&#x27;lightboxInfo&#x27;).textContent=
    `${lightboxIdx+1} / ${lightboxPhotos.length}  •  ${selChild}  •  ${p.name||&#x27;&#x27;}`;
}
function lightboxPrev(e){e.stopPropagation();if(lightboxIdx&gt;0){lightboxIdx--;showLightboxPhoto();}}
function lightboxNext(e){e.stopPropagation();if(lightboxIdx&lt;lightboxPhotos.length-1){lightboxIdx++;showLightboxPhoto();}}
function closeLightbox(e){if(e.target===document.getElementById(&#x27;lightbox&#x27;))closeLightboxBtn();}
function closeLightboxBtn(){document.getElementById(&#x27;lightbox&#x27;).classList.remove(&#x27;open&#x27;);}

// swipe support for lightbox
let lbTouchX=null;
document.addEventListener(&#x27;touchstart&#x27;,e=&gt;{if(document.getElementById(&#x27;lightbox&#x27;).classList.contains(&#x27;open&#x27;))lbTouchX=e.touches[0].clientX;});
document.addEventListener(&#x27;touchend&#x27;,e=&gt;{
  if(!document.getElementById(&#x27;lightbox&#x27;).classList.contains(&#x27;open&#x27;)||lbTouchX===null)return;
  const dx=e.changedTouches[0].clientX-lbTouchX;
  if(Math.abs(dx)&gt;50){dx&lt;0?lightboxNext({stopPropagation:()=&gt;{}}):lightboxPrev({stopPropagation:()=&gt;{}});}
  lbTouchX=null;
});
function onObsInput(){
  if(!selChild)return;
  const v=document.getElementById(&#x27;obsText&#x27;).value.trim();

  renderAutoAreas(v);
  markChanged();
}

function detectNuriAreas(text){
  if(!text||text.length&lt;3) return [];
  const lower=text.toLowerCase();
  return NURI_AREAS_DEF.filter(a=&gt;a.kw.some(kw=&gt;lower.includes(kw)));
}

function renderAutoAreas(text){
  try{
    const el=document.getElementById(&#x27;obsAutoAreas&#x27;);
    if(!el)return;
    const areas=detectNuriAreas(text||&#x27;&#x27;);
    if(!areas.length){el.innerHTML=&#x27;&#x27;;return;}
    el.innerHTML=areas.map(a=&gt;
      `&lt;span class=&quot;obs-area-tag&quot; style=&quot;${a.style}&quot;&gt;${a.icon} ${a.key}&lt;/span&gt;`
    ).join(&#x27;&#x27;);
  }catch(e){/* 오류 무시 */}
}

        model:&#x27;claude-sonnet-4-6&#x27;,

        system:`당신은 누리과정 전문 유아교육 일지 작성 전문가입니다.
교사가 입력한 키워드나 간단한 메모를 누리과정 5개 영역과 연계하여 교육 일지에 적합한 전문적인 문장으로 보완해주세요.

function getSelectedThemeForDate(date){
  if(!db.weekTheme) db.weekTheme={};
  const weekKey=getWeekStartDate(date);
  // 이 주(달 경계로 나뉜 구간)에 내가 직접 선택한 기록이 있을 때만 표시한다.
  // 다른 주/달의 예전 선택값을 절대 이어받지 않는다 (내가 바꾸기 전까지는 그대로, 안 바꾸면 &#x27;선택 없음&#x27;).
  return (weekKey in db.weekTheme) ? db.weekTheme[weekKey] : null;
}

function formatMD(dateStr){
  return `${parseInt(dateStr.slice(5,7))}/${parseInt(dateStr.slice(8,10))}`;
}

function renderChecklist(){
  const el=document.getElementById(&#x27;checklistContent&#x27;);
  if(!el) return;
  const mo=cur.slice(5,7); // &#x27;MM&#x27;
  const monthKey=cur.slice(0,7); // &#x27;YYYY-MM&#x27;
  const weekKey=getWeekStartDate(cur);
  const weekDates=getWeekdaysInWeek(weekKey);
  const data=MONTHLY_KW[mo];
  const selected=getSelectedThemeForDate(cur);
  const allKw=data?data.keywords:[];

  let html=&#x27;&#x27;;
  if(data){
    html+=`&lt;div class=&quot;cl-month-label&quot;&gt;${data.icon} ${monthKey.slice(0,4)}년 ${parseInt(mo)}월 생활주제 · ${data.theme}&lt;/div&gt;`;
  } else {
    html+=`&lt;div class=&quot;cl-month-label&quot;&gt;📅 ${monthKey.slice(0,4)}년 ${parseInt(mo)}월&lt;/div&gt;`;
  }
  if(weekDates.length){
    html+=`&lt;div style=&quot;font-size:11px;color:#888;margin:-2px 0 8px;&quot;&gt;이번 주(${formatMD(weekDates[0])}~${formatMD(weekDates[weekDates.length-1])}) 활동으로 적용돼요&lt;/div&gt;`;
  }

  // 다른 주로 넘어오면, 예전 주에 대한 결과 메시지가 그대로 남아있지 않도록 지운다
  if(weekKey!==_lastStatusWeekKey){
    setThemeBatchStatus(&#x27;&#x27;, null);
    setThemeBatchRetryVisible(false);
  }

  if(allKw.length){
    html+=&#x27;&lt;div class=&quot;cl-list&quot;&gt;&#x27;;
    allKw.forEach(kw=&gt;{
      const on=(kw===selected);
      html+=`&lt;div class=&quot;cl-item${on?&#x27; checked&#x27;:&#x27;&#x27;}&quot; onclick=&quot;selectTheme(&#x27;${kw.replace(/&#x27;/g,&quot;\\&#x27;&quot;)}&#x27;)&quot;&gt;

        &lt;span class=&quot;cl-text&quot;&gt;${escHtml(kw)}&lt;/span&gt;
      &lt;/div&gt;`;
    });
    html+=&#x27;&lt;/div&gt;&#x27;;
  } else {
    html+=&#x27;&lt;div style=&quot;font-size:12px;color:#bbb;padding:8px 0;&quot;&gt;이달 생활주제가 없습니다.&lt;/div&gt;&#x27;;
  }

  el.innerHTML=html;

// 주 전체가 아니라 특정 하루만 골라 놀이·지원계획을 새로 생성 (기존 주간 일괄 채우기 결과와 다르게 바꾸고 싶을 때)
async function regenerateThemeForDate(date){
  const theme=getSelectedThemeForDate(date);
  if(!theme){ showToast(&#x27;먼저 이번 주 생활주제를 체크하세요.&#x27;); return; }
  if(!checkApiKey()){ showToast(&#x27;💾 더보기 탭에서 API 키를 먼저 설정하세요.&#x27;); return; }
  const flightKey=&#x27;day:&#x27;+date;
  if(_themeBatchInFlight.has(flightKey)){ showToast(&#x27;⏳ 이미 이 날짜를 생성하고 있어요.&#x27;); return; }

  const rec=getRec(date);
  const hasExisting=!!(rec.our_play||rec.support||rec.play_theme||rec.etc);
  if(hasExisting){
    const ok=confirm(`${formatMD(date)}에 이미 채워진 놀이·지원계획·놀이주제·기타 내용을 새로 생성하면 기존 내용을 덮어씁니다.\n계속할까요?`);
    if(!ok) return;
  }

  const btn=document.getElementById(&#x27;dayRegenBtn&#x27;);
  if(btn) btn.disabled=true;
  _themeBatchInFlight.add(flightKey);
  showToast(`${formatMD(date)} 하루치를 새로 생성하는 중...`);
  try{
    const r=await requestThemeContentForDates([theme], [date]);
    if(r.authFailed){ showToast(&#x27;❌ API 키가 올바르지 않습니다.&#x27;); return; }
    if(!r.list||!r.list.length){ showToast(`❌ 생성 실패 (${r.errMsg||&#x27;응답 없음&#x27;})`); return; }
    applyThemeBatchResults(r.list, true, {our_play:0,support:0,play_theme:0,etc:0}); // 이 날짜만 명시적으로 덮어쓰기
    if(date===cur) loadForm(cur); // 화면에 새 내용부터 반영한 뒤 저장해야, 저장 시 화면의 예전(빈) 값으로 덮어써지지 않음
    saveData(true);
    showToast(`✨ ${formatMD(date)} 새로 생성 완료!`);
  } finally {
    _themeBatchInFlight.delete(flightKey);
    if(btn) btn.disabled=false;
  }
}

let _pdfJsLoading=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(_pdfJsLoading) return _pdfJsLoading;
  _pdfJsLoading=new Promise((resolve,reject)=&gt;{
    const s=document.createElement(&#x27;script&#x27;);
    s.src=&#x27;https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js&#x27;;
    s.onload=()=&gt;{
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc=&#x27;https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js&#x27;;
        resolve();
      }catch(e){reject(e);}
    };
    s.onerror=()=&gt;reject(new Error(&#x27;pdf.js 로드 실패&#x27;));
    document.head.appendChild(s);
  });
  return _pdfJsLoading;
}

async function extractPdfText(file){
  await loadPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let text=&#x27;&#x27;;
  for(let i=1;i&lt;=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    text += content.items.map(it=&gt;it.str).join(&#x27; &#x27;) + &#x27;\n&#x27;;
  }
  return text.trim();
}

// 대한민국 공휴일 (관공서 기준). 새 해가 되면 목록을 추가해주세요.
const KR_HOLIDAYS = {
  2026: [&#x27;2026-01-01&#x27;,&#x27;2026-02-16&#x27;,&#x27;2026-02-17&#x27;,&#x27;2026-02-18&#x27;,&#x27;2026-03-02&#x27;,
         &#x27;2026-05-05&#x27;,&#x27;2026-05-25&#x27;,&#x27;2026-06-03&#x27;,&#x27;2026-06-06&#x27;,
         &#x27;2026-08-17&#x27;,&#x27;2026-09-24&#x27;,&#x27;2026-09-25&#x27;,&#x27;2026-10-05&#x27;,&#x27;2026-10-09&#x27;,&#x27;2026-12-25&#x27;]
};
function isKrHoliday(dateStr){
  const y=parseInt(dateStr.slice(0,4));
  const list=KR_HOLIDAYS[y];
  return !!(list &amp;&amp; list.includes(dateStr));
}
function getWeekdaysInMonth(monthKey){
  const [y,m]=monthKey.split(&#x27;-&#x27;).map(Number);
  const last=new Date(y,m,0).getDate();
  const list=[];
  for(let d=1;d&lt;=last;d++){
    const dt=new Date(y,m-1,d);
    const day=dt.getDay();
    if(day===0||day===6) continue; // 주말 제외
    const mm=String(m).padStart(2,&#x27;0&#x27;);
    const dd=String(d).padStart(2,&#x27;0&#x27;);
    const dateStr=`${y}-${mm}-${dd}`;
    if(isKrHoliday(dateStr)) continue; // 공휴일 제외
    list.push(dateStr);
  }
  return list;
}

// 생활주제 체크리스트는 &#x27;주&#x27; 단위로 적용된다: 어느 요일에 체크하든 그 주의 월~금 전체에 반영.
// 단, 주가 달을 넘어가는 경우(예: 월~화는 6월, 수~금은 7월) 그 달 안에서만 이어지도록 주를 나눈다.
function fmtDateObj(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,&#x27;0&#x27;), dd=String(d.getDate()).padStart(2,&#x27;0&#x27;);
  return `${y}-${m}-${dd}`;
}

function getWeekRangeForDate(dateStr){
  const d=new Date(dateStr+&#x27;T00:00:00&#x27;);
  const day=d.getDay(); // 0=일 ... 6=토
  const diffToMonday=(day===0)?-6:(1-day);
  const mon=new Date(d); mon.setDate(d.getDate()+diffToMonday);
  const fri=new Date(mon); fri.setDate(mon.getDate()+4);
  const refY=d.getFullYear(), refM=d.getMonth();
  const firstOfMonth=new Date(refY, refM, 1);
  const lastOfMonth=new Date(refY, refM+1, 0);
  const segStart = mon &lt; firstOfMonth ? firstOfMonth : mon;
  const segEnd = fri &gt; lastOfMonth ? lastOfMonth : fri;
  return {segStart, segEnd};
}

function getWeekStartDate(dateStr){
  const {segStart}=getWeekRangeForDate(dateStr);
  return fmtDateObj(segStart);
}

function getWeekdaysInWeek(weekStartStr){
  // weekStartStr을 기준 날짜로 다시 그 주(달 경계 포함)의 범위를 계산한다
  const {segStart,segEnd}=getWeekRangeForDate(weekStartStr);
  const list=[];
  const cursor=new Date(segStart);
  while(cursor&lt;=segEnd){
    const dow=cursor.getDay();
    if(dow!==0 &amp;&amp; dow!==6){
      const dateStr=fmtDateObj(cursor);
      if(!isKrHoliday(dateStr)) list.push(dateStr);
    }
    cursor.setDate(cursor.getDate()+1);
  }
  return list;
}

}

  if(files.length){
    html+=&#x27;&lt;div class=&quot;pf-files&quot;&gt;&#x27;;
    files.forEach((f,i)=&gt;{
      html+=`&lt;div class=&quot;pf-file-chip&quot;&gt;&lt;span class=&quot;pf-file-name&quot;&gt;📄 ${escHtml(f.name)}&lt;/span&gt;&lt;button class=&quot;pf-file-x&quot; onclick=&quot;removePlayPlanFile(${i})&quot; title=&quot;삭제&quot;&gt;✕&lt;/button&gt;&lt;/div&gt;`;

  } else if(files.length){
    html+=&#x27;&lt;div class=&quot;pf-status&quot;&gt;PDF를 추가했으면 &quot;계획 반영하기&quot;를 눌러주세요.&lt;/div&gt;&#x27;;

async function onPlayPlanFilesSelected(event){
  const fileList=Array.from(event.target.files||[]);
  event.target.value=&#x27;&#x27;;
  if(!fileList.length) return;
  ensurePlayPlanData();
  showToast(&#x27;PDF에서 글자를 읽는 중...&#x27;);

      const text=await extractPdfText(file);

  saveData(true);
  renderPlayPlanFiles();

function removePlayPlanFile(idx){
  ensurePlayPlanData();
  db.playPlanFiles.splice(idx,1);
  saveData(true);
  renderPlayPlanFiles();
}

async function generatePlayMonthPlan(){
  ensurePlayPlanData();
  if(!db.playPlanFiles.length){showToast(&#x27;먼저 월안·주안 PDF를 추가하세요.&#x27;);return;}
  if(!checkApiKey()) return;
  const btn=document.getElementById(&#x27;playPlanAutoBtn&#x27;);
  if(btn){btn.disabled=true;btn.textContent=&#x27;⏳ 반영 중...&#x27;;}
  const monthKey=cur.slice(0,7);
  const dates=getWeekdaysInMonth(monthKey);
  const planText=db.playPlanFiles.map(f=&gt;`[${f.name}]\n${f.text}`).join(&#x27;\n\n&#x27;).slice(0,8000);
  try{
    const res=await fetch(&#x27;https://n8n.auto-navajin.com/webhook/eval-ai&#x27;,{
      method:&#x27;POST&#x27;,
      headers:getApiHeaders(),
      body:JSON.stringify({
        model:&#x27;claude-sonnet-4-6&#x27;,
        max_tokens:4000,
        system:`당신은 유치원 놀이중심 교육과정 전문가입니다.
교사가 올린 월안 또는 주안(주간/월간 놀이계획안)을 참고하여, 그 계획에 담긴 놀이 주제·흐름·문체를 파악한 뒤, 주어진 날짜 목록 각각에 대해 &quot;우리들의 놀이&quot;와 &quot;지원계획&quot; 내용을 작성해주세요.

규칙:
1. 올라온 계획안이 한 주(주안)만 다루고 있다면, 같은 주제와 형식을 이번 달 나머지 주차에도 자연스럽게 확장해서 적용하세요. 월안이라면 그 안의 흐름을 그대로 날짜별로 배분하세요.
2. &quot;우리들의 놀이&quot;는 그날 진행할 구체적인 놀이 활동을 2~4문장으로 작성하세요.
3. &quot;지원계획&quot;은 교사가 그 놀이를 지원하는 방법을 1~2문장으로 작성하세요.
4. 계획안의 말투와 형식(구성 방식)을 최대한 유지하세요.
5. 반드시 아래 JSON 배열 형식으로만 응답하세요. 다른 설명이나 코드블록 표시(\`\`\`) 없이 순수 JSON 배열만 출력하세요.
[{&quot;date&quot;:&quot;YYYY-MM-DD&quot;,&quot;our_play&quot;:&quot;...&quot;,&quot;support&quot;:&quot;...&quot;}, ...]
6. 배열의 date는 반드시 주어진 날짜 목록에 있는 값만 사용하고, 목록의 모든 날짜를 빠짐없이 포함하세요.`,
        messages:[{role:&#x27;user&#x27;,content:`[월안/주안 계획안]\n${planText}\n\n[이번 달 배정 대상 날짜 목록]\n${dates.join(&#x27;, &#x27;)}\n\n위 계획안을 참고하여 각 날짜에 우리들의 놀이·지원계획을 작성해 JSON 배열로 응답해주세요.`}]
      })
    });
    if(!res.ok){
      const err=await res.json().catch(()=&gt;({}));
      const msg=err.error?.message||`오류 코드: ${res.status}`;
      if(res.status===401){showToast(&#x27;❌ API 키가 올바르지 않습니다.&#x27;);}
      else{showToast(&#x27;AI 오류: &#x27;+msg);}
      if(btn){btn.disabled=false;btn.textContent=&#x27;🧩 계획 반영하기&#x27;;}
      return;
    }
    const data=await res.json();
    trackTokens(data);
    const raw=data.content.filter(b=&gt;b.type===&#x27;text&#x27;).map(b=&gt;b.text).join(&#x27;&#x27;).trim();
    const jsonStr=raw.slice(raw.indexOf(&#x27;[&#x27;), raw.lastIndexOf(&#x27;]&#x27;)+1);
    let list;
    try{ list=JSON.parse(jsonStr); }catch(e){
      showToast(&#x27;AI 응답을 해석하지 못했습니다. 다시 시도해주세요.&#x27;);
      if(btn){btn.disabled=false;btn.textContent=&#x27;🧩 계획 반영하기&#x27;;}
      return;
    }
    const monthPlan={};
    list.forEach(item=&gt;{
      if(item&amp;&amp;item.date) monthPlan[item.date]={our_play:item.our_play||&#x27;&#x27;, support:item.support||&#x27;&#x27;};
    });
    db.playMonthPlan[monthKey]=monthPlan;
    dates.forEach(d=&gt;{
      const rec=getRec(d);
      const plan=monthPlan[d];
      if(!plan) return;
      if(!rec.our_play &amp;&amp; plan.our_play) rec.our_play=plan.our_play;
      if(!rec.support &amp;&amp; plan.support) rec.support=plan.support;
    });
    saveData(true);
    renderPlayPlanFiles();
    loadForm(cur);
    showToast(`${monthKey} 우리들의 놀이·지원계획 반영 완료 ✓ (${dates.length}일)`);
  }catch(e){
    showToast(&#x27;네트워크 오류: 인터넷 연결을 확인하세요.&#x27;);
    console.error(e);
  }
  if(btn){btn.disabled=false;btn.textContent=&#x27;🧩 계획 반영하기&#x27;;}
}

function getDatesForChildInPeriod(name){
  const allDates=Object.keys(db.records||{}).filter(d=&gt;db.records[d].observations&amp;&amp;db.records[d].observations[name]);
  if(rpPeriod===&#x27;1h&#x27;) return allDates.filter(d=&gt;{const m=parseInt(d.slice(5,7));return m&gt;=3&amp;&amp;m&lt;=8;});
  if(rpPeriod===&#x27;2h&#x27;) return allDates.filter(d=&gt;{const m=parseInt(d.slice(5,7));return m&gt;=9||m&lt;=2;});
  if(rpPeriod===&#x27;month&#x27;&amp;&amp;rpMonth) return allDates.filter(d=&gt;d.startsWith(rpMonth));
  return allDates;
}

function parseNameKeyedJson(raw){
  try{
    const s=raw.slice(raw.indexOf(&#x27;[&#x27;), raw.lastIndexOf(&#x27;]&#x27;)+1);
    const parsed=JSON.parse(s);
    if(Array.isArray(parsed)) return parsed;
  }catch(e){}
  const items=[];
  const re=/\{[^{}]*&quot;name&quot;\s*:\s*&quot;[^&quot;]+&quot;[^{}]*\}/g;
  let m;
  while((m=re.exec(raw))){
    try{ items.push(JSON.parse(m[0])); }catch(e){}
  }
  return items.length?items:null;
}

const SEMESTER_SYS=`당신은 유치원 학기 종합 유아평가표(공식 서식) 작성 전문가입니다.
교사가 유아별로 모아둔 관찰 기록을 바탕으로, 반 전체 유아평가표를 유아 한 명당 한 항목씩 작성합니다.
관찰 기록이 부족하거나 없는 유아도 반드시 포함해서, 그 나이대에 일반적이고 무난한 발달 특성으로 작성하세요. &quot;기록이 없다&quot;는 문구는 절대 쓰지 마세요.

지원방안: &quot;- 감정카드 지원, 짝꿍 놀이 지원\n- 다양한 도전적 신체활동 실시\n- 다양하게 구슬 미로를 만들 수 있는 큐바메이즈 교구 지원\n- 레고 호환되는 다양한 소품 지원\n- 톡톡 블록을 도안과 함께 제시하여 창의적 표현 및 도안을 보고 구성하는 활동 지원&quot;

규칙:
