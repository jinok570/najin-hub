<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>📥 공문 브리핑</title>
<!-- 나진허브 · 공문 브리핑 (2026-09-04)
     데이터: n8n 웹훅(gongmun-list) → 노션 "공문 자동정리함" (API 키 0개)
     특징: 큰 글씨(A−/A+), 폴드·태블릿 화면 가득, 카테고리·상태 필터, 월별 그룹, 마감 D-day -->
<style>
:root{
  --bg:#0b0d14; --card:#151a26; --line:#26304a; --tx:#e8edf7; --tx2:#9aa6c0; --tx3:#6b7590;
  --pri:#5b8cff; --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --chip:#1e2536;
  --fs:18px;
}
html[data-theme="light"]{
  --bg:#f5f3ee; --card:#ffffff; --line:#e3ddd0; --tx:#22201c; --tx2:#6b6357; --tx3:#9a927f; --chip:#efeae0;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:var(--fs);line-height:1.4;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 16px 10px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd h1{margin:0;font-size:1.25em;font-weight:900;flex:1;white-space:nowrap}
.hd .sub{width:100%;font-size:.8em;color:var(--tx2);margin-top:2px}
.ctl{display:flex;gap:6px;align-items:center}
.ctl button{background:var(--chip);color:var(--tx);border:1px solid var(--line);border-radius:10px;min-width:44px;height:42px;font-size:.95em;font-weight:800;cursor:pointer;padding:0 10px}
.ctl .v{font-size:.75em;color:var(--tx2);min-width:44px;text-align:center}
main{padding:12px 16px 90px;max-width:1400px;margin:0 auto}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer}
.sum b{display:block;font-size:1.4em;font-weight:900}
.sum small{color:var(--tx2);font-size:.75em;white-space:nowrap}
.sum .bad b{color:var(--bad)} .sum .warn b{color:var(--warn)} .sum .pri b{color:var(--pri)} .sum .ok b{color:var(--ok)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 16px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--tx2);font-weight:800;font-size:.9em;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.chip{padding:7px 13px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--tx2);font-size:.8em;font-weight:700;cursor:pointer}
.chip.on{color:var(--tx);border-color:var(--tx2);background:var(--card)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:1em;margin-bottom:10px}
.month{display:flex;align-items:center;gap:10px;margin:18px 0 8px;color:var(--tx2);font-weight:800;font-size:.9em}
.month::after{content:"";flex:1;height:1px;background:var(--line)}
.month .n{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.85em}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.card{display:block;min-width:0;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--tx3);border-radius:14px;padding:14px 16px;text-decoration:none;color:inherit}
.card.i-high{border-left-color:var(--bad)} .card.i-mid{border-left-color:var(--warn)} .card.i-low{border-left-color:var(--pri)}
.card .t{font-weight:800;font-size:.92em;line-height:1.35;margin-bottom:7px;display:flex;gap:8px;align-items:flex-start}
.card .t span{flex:1}
.badge{flex:none;font-size:.66em;font-weight:800;padding:3px 9px;border-radius:8px;border:1px solid var(--warn);color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.76em;color:var(--tx2)}
.st{font-weight:800;padding:3px 10px;border-radius:8px;font-size:.9em;background:var(--chip);border:1px solid var(--line);color:var(--tx)}
.st.접수{color:var(--pri)} .st.검토중{color:var(--warn)} .st.완료{color:var(--ok)}
.dd{font-weight:800} .dd.over{color:var(--bad)} .dd.soon{color:var(--warn)} .dd.ok{color:var(--tx2)}
.tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.68em;padding:3px 9px;border-radius:7px;background:var(--chip);border:1px solid var(--line);color:var(--tx2)}
.empty{text-align:center;color:var(--tx3);padding:50px 10px}
.note{font-size:.8em;color:var(--tx3);text-align:center;margin-top:20px;line-height:1.6}
.err{background:#3a1a1a;border:1px solid #7a2b2b;color:#ffd9d9;padding:12px 14px;border-radius:12px;margin:8px 0;font-size:.9em;line-height:1.6}
html[data-theme="light"] .err{background:#fdecec;border-color:#f3b4b4;color:#7a1f1f}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:none}
.sheetbg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;top:6vh;z-index:61;background:var(--bg);border-top:1px solid var(--line);border-radius:22px 22px 0 0;display:none;flex-direction:column;max-width:1100px;margin:0 auto}
.sheet.open{display:flex}
.sheet .sh{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet .sh button{background:var(--chip);color:var(--tx);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 14px;font-weight:800;font-size:.85em;cursor:pointer}
.sheet .sh .sp{flex:1}
.sheet .sb{flex:1;overflow-y:auto;padding:14px 18px 40px;-webkit-overflow-scrolling:touch}
.dt{font-size:1.05em;font-weight:900;line-height:1.35;margin-bottom:10px}
.dmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8em;color:var(--tx2);margin-bottom:14px}
.dcallout{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:.92em;line-height:1.55}
.dh{font-weight:900;margin:16px 0 6px;font-size:.95em}
.dtodo,.dli,.dp{font-size:.9em;line-height:1.55;margin:6px 0;display:flex;gap:10px;align-items:flex-start}
.dtodo .bx{flex:none;width:1.1em;height:1.1em;border:2px solid var(--tx2);border-radius:5px;margin-top:.2em}
.dtodo.done .bx{background:var(--ok);border-color:var(--ok)} .dtodo.done{color:var(--tx3);text-decoration:line-through}
.dli::before{content:"•";color:var(--tx2)}
.dquote{border-left:3px solid var(--tx3);padding-left:12px;color:var(--tx2);font-size:.9em;margin:8px 0}
.dhr{height:1px;background:var(--line);margin:14px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:560px;width:100%}
.box h3{margin:0 0 10px}
.box input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:.95em}
.box .row{display:flex;gap:8px;margin-top:12px}
.box .row button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:800;font-size:.95em;cursor:pointer;background:var(--chip);color:var(--tx)}
.box .row button.p{background:var(--pri);color:#fff}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>📥 공문 브리핑</h1>
    <div class="ctl">
      <button onclick="scale(-1)" aria-label="작게">A−</button><span class="v" id="szv">100%</span><button onclick="scale(1)" aria-label="크게">A+</button>
      <button onclick="load(true)" title="새로고침">🔄</button>
      <button onclick="toggleTheme()" title="밝게/어둡게">🌓</button>
      <button onclick="fullscreen()" title="전체화면">⛶</button>
      <button onclick="openSet()" title="설정">⚙️</button>
    </div>
    <div class="sub" id="sub">불러오는 중…</div>
  </div>
</header>
<main>
  <div class="sum" id="sum"></div>
  <input class="search" id="q" placeholder="🔍 제목 · 발신기관 · 문서번호 검색" oninput="render()">
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div class="note">노션 「공문 자동정리함」과 연결 · 카드를 누르면 노션 원문이 열려요<br>데이터는 n8n(내 서버)에서 가져오며 API 요금이 들지 않아요</div>
</main>

<div class="sheetbg" id="sheetBg" onclick="closeDetail()"></div>
<div class="sheet" id="sheet">
  <div class="sh"><button onclick="closeDetail()">← 목록</button><span class="sp"></span><button onclick="scale(-1)">A−</button><button onclick="scale(1)">A+</button><a id="dOpen" href="#" target="_blank" rel="noopener"><button>노션에서 열기 ↗</button></a></div>
  <div class="sb" id="sbody"></div>
</div>
<div class="modal" id="setModal" onclick="if(event.target===this)closeSet()">
  <div class="box">
    <h3>⚙️ 설정</h3>
    <div style="font-size:.85em;color:var(--tx2);margin-bottom:6px">데이터 주소 (n8n 웹훅)</div>
    <input id="whInput" placeholder="https://n8n.auto-navajin.com/webhook/gongmun-list">
    <div class="row"><button onclick="closeSet()">닫기</button><button class="p" onclick="saveSet()">저장</button></div>
  </div>
</div>

<script>
var DEFAULT_WH = "https://n8n.auto-navajin.com/webhook/gongmun-list";
var MEM={};
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ if(v===undefined) return MEM[k]||null; MEM[k]=v; } return v; }
function wh(){ return ls("gm_webhook")||DEFAULT_WH; }

/* ── 글자 크기 ── */
var STEPS=[0.8,0.9,1,1.15,1.3,1.5,1.7,2,2.3];
function autoScale(){ var w=innerWidth; return w>=1200?1.3:w>=700?1.5:w>=560?1.15:1; }
var SC=parseFloat(ls("gm_scale"))||autoScale();
function applyScale(){ document.documentElement.style.setProperty("--fs",(18*SC)+"px"); document.getElementById("szv").textContent=Math.round(SC*100)+"%"; }
function scale(d){ var bi=0,bd=9; STEPS.forEach(function(s,i){ var x=Math.abs(s-SC); if(x<bd){bd=x;bi=i;} }); SC=STEPS[Math.max(0,Math.min(STEPS.length-1,bi+d))]; ls("gm_scale",String(SC)); applyScale(); }
applyScale();

/* ── 테마 · 전체화면 ── */
if(ls("gm_theme")==="light") document.documentElement.setAttribute("data-theme","light");
function toggleTheme(){ var l=document.documentElement.getAttribute("data-theme")==="light"; if(l){ document.documentElement.removeAttribute("data-theme"); ls("gm_theme","dark"); } else { document.documentElement.setAttribute("data-theme","light"); ls("gm_theme","light"); } }
function fullscreen(){ var el=document.documentElement; try{ if(document.fullscreenElement){ document.exitFullscreen(); return; } var r=el.requestFullscreen||el.webkitRequestFullscreen; if(r){ var p=r.call(el,{navigationUI:"hide"}); if(p&&p.catch) p.catch(function(){}); } }catch(e){} }

/* ── 설정 ── */
function openSet(){ document.getElementById("whInput").value=wh(); document.getElementById("setModal").classList.add("open"); }
function closeSet(){ document.getElementById("setModal").classList.remove("open"); }
function saveSet(){ var v=document.getElementById("whInput").value.trim(); ls("gm_webhook",v||null); closeSet(); load(true); }

/* ── 데이터 ── */
var DATA=[], AT="", cat=ls("gm_cat")||"전체", sts=(function(){ try{ return JSON.parse(ls("gm_sts")||"null"); }catch(e){ return null; } })()||["확인필요","접수","검토중"];
function load(force){
  document.getElementById("sub").textContent="불러오는 중…";
  var cached=null; try{ cached=JSON.parse(ls("gm_cache")||"null"); }catch(e){}
  if(cached&&cached.items&&!force){ DATA=cached.items; AT=cached.at; render(); }
  fetch(wh()+(wh().indexOf("?")>=0?"&":"?")+"t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("서버 응답 "+r.status); return r.json(); }).then(function(j){
    if(!j||!j.items) throw new Error("응답 형식이 달라요");
    DATA=j.items; AT=j.at||new Date().toISOString(); ls("gm_cache",JSON.stringify({items:DATA,at:AT})); render();
  }).catch(function(e){
    if(!DATA.length){ document.getElementById("list").innerHTML='<div class="err">❌ 데이터를 못 가져왔어요: '+e.message+'<br><br>① n8n에서 「📋 공문 브리핑 API」 워크플로가 <b>활성(Published)</b>인지<br>② ⚙️ 설정의 주소가 맞는지 확인해주세요.</div>'; document.getElementById("sub").textContent="연결 실패"; }
    else document.getElementById("sub").textContent="⚠️ 새로 못 가져와서 저장본 표시 중 ("+fmtAt(AT)+")";
  });
}
function fmtAt(iso){ if(!iso) return ""; var d=new Date(iso); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function today(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function dday(s){ if(!s) return null; var p=s.slice(0,10).split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); return Math.round((d-today())/86400000); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function impClass(i){ return i==="상"||i==="긴급"||i==="높음"?"i-high":i==="중"||i==="보통"?"i-mid":i?"i-low":""; }

function render(){
  var q=(document.getElementById("q").value||"").trim().toLowerCase();
  // 요약
  var review=DATA.filter(function(x){return x.review;}).length;
  var soon=DATA.filter(function(x){ var d=dday(x.deadline); return d!==null&&d>=0&&d<=3&&x.status!=="완료"; }).length;
  var over=DATA.filter(function(x){ var d=dday(x.deadline); return d!==null&&d<0&&x.status!=="완료"; }).length;
  var open=DATA.filter(function(x){return x.status==="접수"||x.status==="검토중";}).length;
  document.getElementById("sum").innerHTML=
    '<div class="bad" onclick="quick(\'over\')"><b>'+over+'</b><small>마감 지남</small></div>'
   +'<div class="warn" onclick="quick(\'soon\')"><b>'+soon+'</b><small>3일 내 마감</small></div>'
   +'<div class="pri" onclick="quick(\'open\')"><b>'+open+'</b><small>진행 중</small></div>'
   +'<div class="ok" onclick="quick(\'review\')"><b>'+review+'</b><small>확인필요</small></div>';
  // 카테고리 탭
  var cats={}; DATA.forEach(function(x){ (x.categories||[]).forEach(function(c){ cats[c]=(cats[c]||0)+1; }); });
  var names=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];});
  if(cat!=="전체"&&names.indexOf(cat)<0) cat="전체";
  document.getElementById("tabs").innerHTML=['전체'].concat(names).map(function(n){ return '<div class="tab'+(n===cat?" on":"")+'" onclick="setCat(\''+esc(n).replace(/'/g,"\\'")+'\')">'+esc(n)+(n==="전체"?" "+DATA.length:" "+cats[n])+'</div>'; }).join("");
  // 상태 칩
  var allSt=["확인필요","접수","검토중","완료"];
  document.getElementById("chips").innerHTML=allSt.map(function(s){ return '<div class="chip'+(sts.indexOf(s)>=0?" on":"")+'" onclick="toggleSt(\''+s+'\')">'+(s==="확인필요"?"⚠️ ":"")+s+'</div>'; }).join("");
  // 목록
  var items=DATA.filter(function(x){
    if(cat!=="전체"&&(x.categories||[]).indexOf(cat)<0) return false;
    var stOk=(sts.indexOf(x.status)>=0)||(x.review&&sts.indexOf("확인필요")>=0);
    if(!stOk) return false;
    if(q){ var hay=(x.title+" "+x.sender+" "+x.docNo+" "+(x.categories||[]).join(" ")).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
  if(!items.length){ document.getElementById("list").innerHTML='<div class="empty">표시할 공문이 없어요 😊<br><small>상태 칩이나 카테고리를 바꿔보세요</small></div>'; }
  else{
    var groups={}, order=[];
    items.forEach(function(x){ var k=(x.recv||x.edited||"").slice(0,7)||"기타"; if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(x); });
    order.sort().reverse();
    document.getElementById("list").innerHTML=order.map(function(k){
      var label=k==="기타"?"날짜 없음":(k.slice(0,4)+"년 "+parseInt(k.slice(5,7))+"월");
      return '<div class="month">'+label+' <span class="n">'+groups[k].length+'</span></div><div class="grid">'+groups[k].map(card).join("")+'</div>';
    }).join("");
  }
  document.getElementById("sub").textContent="총 "+DATA.length+"건 · 갱신 "+fmtAt(AT)+(cat!=="전체"?" · "+cat:"");
}
function card(x){
  var d=dday(x.deadline), dh="";
  if(d!==null){ var cls=d<0?"over":d<=3?"soon":"ok"; var txt=d<0?"마감 지남":d===0?"오늘 마감":"D-"+d; if(x.status==="완료"){cls="ok";txt="";} dh='<span class="dd '+cls+'">📅 '+esc((x.deadline||"").slice(5,10).replace("-","/"))+(txt?" · "+txt:"")+'</span>'; }
  return '<a class="card '+impClass(x.importance)+'" href="javascript:void(0)" onclick="openDetail(\''+esc(x.id)+'\')">'
    +'<div class="t"><span>'+esc(x.title||"(제목 없음)")+'</span>'+(x.review?'<span class="badge">확인필요</span>':"")+'</div>'
    +'<div class="meta"><span class="st '+esc(x.status)+'">'+esc(x.status||"-")+'</span>'+(x.sender?'<span>'+esc(x.sender)+'</span>':"")+dh+(x.docNo?'<span style="color:var(--tx3)">'+esc(x.docNo)+'</span>':"")+'</div>'
    +((x.categories||[]).length?'<div class="tags">'+x.categories.map(function(c){return '<span class="tag">'+esc(c)+'</span>';}).join("")+'</div>':"")
    +'</a>';
}
/* ── 상세(허브 안에서 본문 보기) ── */
var PAGE_CACHE={};
function pageWh(){ return wh().replace(/gongmun-list\/?$/,"gongmun-page"); }
function openDetail(id){
  var x=DATA.filter(function(v){return v.id===id;})[0]; if(!x) return;
  var d=dday(x.deadline), dtxt=d===null?"":(d<0?"마감 지남":d===0?"오늘 마감":"D-"+d);
  document.getElementById("dOpen").href=x.url||"#";
  var head='<div class="dt">'+esc(x.title)+'</div><div class="dmeta"><span class="st '+esc(x.status)+'">'+esc(x.status||"-")+'</span>'
    +(x.sender?'<span>'+esc(x.sender)+'</span>':"")+(x.docNo?'<span>'+esc(x.docNo)+'</span>':"")
    +(x.recv?'<span>수신 '+esc(x.recv)+'</span>':"")+(x.deadline?'<span class="dd '+(d<0?"over":d<=3?"soon":"ok")+'">마감 '+esc(x.deadline)+(dtxt?" · "+dtxt:"")+'</span>':"")
    +(x.review?'<span class="badge">확인필요</span>':"")+'</div>';
  var body=document.getElementById("sbody");
  body.innerHTML=head+'<div class="empty" style="padding:30px 0">본문 불러오는 중…</div>';
  document.getElementById("sheetBg").classList.add("open"); document.getElementById("sheet").classList.add("open");
  var render=function(lines){
    body.innerHTML=head+(lines.length?lines.map(function(l){
      if(l.k==="callout") return '<div class="dcallout">'+(l.icon?l.icon+" ":"")+esc(l.t)+'</div>';
      if(l.k==="h") return '<div class="dh">'+esc(l.t)+'</div>';
      if(l.k==="todo") return '<div class="dtodo'+(l.done?" done":"")+'"><span class="bx"></span><span>'+esc(l.t)+'</span></div>';
      if(l.k==="li") return '<div class="dli"><span>'+esc(l.t)+'</span></div>';
      if(l.k==="quote") return '<div class="dquote">'+esc(l.t)+'</div>';
      if(l.k==="hr") return '<div class="dhr"></div>';
      return '<div class="dp"><span>'+esc(l.t)+'</span></div>';
    }).join(""):'<div class="empty">본문이 비어 있어요</div>');
  };
  if(PAGE_CACHE[id]){ render(PAGE_CACHE[id]); return; }
  fetch(pageWh()+"?id="+encodeURIComponent(id)+"&t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("서버 응답 "+r.status); return r.json(); })
    .then(function(j){ PAGE_CACHE[id]=j.lines||[]; render(PAGE_CACHE[id]); })
    .catch(function(e){ body.innerHTML=head+'<div class="err">본문을 못 가져왔어요: '+esc(e.message)+'<br>n8n에 「📋 공문 브리핑 API — 본문」 워크플로가 활성인지 확인해주세요. 위 "노션에서 열기"로는 볼 수 있어요.</div>'; });
}
function closeDetail(){ document.getElementById("sheetBg").classList.remove("open"); document.getElementById("sheet").classList.remove("open"); }
function setCat(c){ cat=c; ls("gm_cat",c); render(); }
function toggleSt(s){ var i=sts.indexOf(s); if(i>=0) sts.splice(i,1); else sts.push(s); ls("gm_sts",JSON.stringify(sts)); render(); }
function quick(k){ cat="전체"; document.getElementById("q").value=""; if(k==="review"){ sts=["확인필요"]; } else if(k==="open"){ sts=["접수","검토중"]; } else { sts=["접수","검토중","확인필요"]; } ls("gm_sts",JSON.stringify(sts)); render(); if(k==="over"||k==="soon"){ setTimeout(function(){ var first=document.querySelector(".dd."+(k==="over"?"over":"soon")); if(first) first.scrollIntoView({block:"center",behavior:"smooth"}); },50); } }
load(false);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) load(false); });
</script>
